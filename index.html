<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스피드브리딩 시설 통합 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://webfontworld.github.io/gmarket/GmarketSans.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css?v=20261106">
</head>
<body>

<header>
  <div class="header-v2">
    <div class="hv2-left">
      <div class="hv2-icon" id="adminToggleBtn" role="button" tabindex="0" onclick="toggleAdmin()" onkeydown="if(event.key==='Enter'||event.key===' '){ event.preventDefault(); toggleAdmin(); }">🌱</div>
      <div style="min-width:0; overflow:hidden;">
        <h1 onclick="goHome()" style="cursor:pointer;">
          <span class="hv2-title-text">밭작물개발과 스피드브리딩 시설 통합관리</span>
          <span class="hv2-live-badge">● 실시간 모니터링</span>
        </h1>
        <p>국립식량과학원 밭작물개발과 육종 가속화 통합 관제시스템</p>
      </div>
    </div>
    <div class="hv2-right">
      <div class="hv2-stats">
        <span>가동중 <b id="hv2StatRooms">-/-실</b></span>
        <span class="hv2-divider"></span>
        <span>재배작물 <b id="hv2StatCrops">-종</b></span>
        <span class="hv2-divider"></span>
        <span>총 집단수 <b id="hv2StatGroups">-개</b></span>
        <span class="hv2-divider"></span>
        <span>총 개체수 <b id="hv2StatQty" class="accent">-개체</b></span>
      </div>
      <button class="hv2-reset active" id="navBtnSpace" onclick="goHome()">종합현황</button>
      <button class="hv2-reset" id="navBtnWork" onclick="enterWorkView()">계통작성</button>
      <button class="hv2-reset" id="navBtnTasks" onclick="switchView('tasks')">작업계획</button>
      <button class="hv2-reset" id="navBtnSurvey" onclick="switchView('survey')">수요조사</button>
      <button class="hv2-reset" id="navBtnPlan" onclick="switchView('plan')">분기별 계획</button>
      <button class="hv2-guide" id="guideBtn" onclick="openGuide()" style="display:none;">? 사용법</button>
    </div>
  </div>
</header>

<div class="top-bar-wrap">
  <div class="section-head" id="facilitySectionHead" style="justify-content:flex-end; margin-bottom:14px;">
    <button class="btn small" id="addExtraRoomBtn" onclick="openRoomModal()">+ 목록에 없는 방 추가</button>
    <button class="btn small" id="excelSampleBtn" onclick="downloadSampleExcel()">엑셀 양식 다운로드</button>
    <button class="btn small primary" id="excelUploadBtn" onclick="document.getElementById('excelFileInput').click()">엑셀 업로드</button>
    <input type="file" id="excelFileInput" accept=".xlsx,.xls" style="display:none;" onchange="handleExcelUpload(event)" />
  </div>
</div>

<div class="page-shell">
  <main style="flex:1; width:100%;">
  <div id="spaceViewWrap">
    <div class="space-two-col">
      <div class="space-facility-col">
        <div class="facility" id="facility"></div>
      </div>
      <div class="space-detail-col" id="detail"></div>
    </div>
  </div>

  <div id="workViewWrap" style="display:none;">
    <div>
      <div class="section-head" style="margin-bottom:12px;">
        <div>
          <h2>계통작성</h2>
          <p>배치도에서 방을 고르고, 가운데 베드 맵에서 자리를 눌러 오른쪽에서 재료를 등록·수정해요.</p>
        </div>
        <button class="btn danger-text" id="deleteAllMaterialsBtn" onclick="deleteAllMaterials()" style="display:none;">계통작성 전체 삭제</button>
      </div>
    </div>
    <!-- 수요조사 화면과 같은 틀 · 같은 크기: 확대(survey-user-area) + 3열 비율(survey-two-col, work-map-panel, work-bed-panel, survey-form-panel) -->
    <div class="survey-user-area">
      <div class="survey-two-col">
        <div class="survey-facility-panel work-map-panel" id="workMapPanel"></div>
        <div class="panel-box survey-bed-panel work-bed-panel" id="workBedPanel"></div>
        <!-- 오른쪽 열: 작성 칸과 수확 완료 목록을 서로 다른 칸으로 나눠 위아래로 둔다 -->
        <div class="survey-form-panel work-side-col">
          <div class="panel-box" id="workRoomDetail"></div>
          <div class="panel-box work-harvest-panel" id="workHarvestPanel" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="tasksViewWrap" style="display:none; max-width:1200px;"></div>

  <div id="surveyViewWrap" style="display:none;"></div>

  <div id="planViewWrap" style="display:none;"></div>
  </main>
</div>

<div class="modal-overlay" id="roomModalOverlay">
  <div class="modal">
    <h3>새 방 추가</h3>
    <input id="newRoomName" placeholder="방 이름" />
    <input id="newRoomLocation" placeholder="위치 (예: 2층 좌측)" />
    <input id="newRoomManager" placeholder="담당자" />
    <div class="modal-actions">
      <button class="btn" onclick="closeRoomModal()">취소</button>
      <button class="btn primary" onclick="createRoom()">추가</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="historyModalOverlay">
  <div class="modal" style="width:340px; max-height:80vh; overflow-y:auto;">
    <h3>세대 이력</h3>
    <div id="historyModalList"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeHistoryModal()">닫기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="roomDetailModalOverlay">
  <div class="modal" style="width:920px; max-width:94vw; max-height:86vh; overflow-y:auto;">
    <div id="roomDetailModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="addTaskModalOverlay">
  <div class="modal" style="width:420px; max-width:92vw;">
    <h3 id="addTaskModalTitle">+ 작업 추가</h3>
    <div id="addTaskModalBody" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeAddTaskModal()">취소</button>
      <button class="btn primary" onclick="saveNewTask()">추가</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="planBarModalOverlay" onclick="if(event.target===this) closePlanBarPopup()">
  <div class="modal" style="width:400px; max-width:92vw; max-height:86vh; overflow-y:auto;">
    <h3 id="planBarModalTitle" style="display:flex; align-items:center; gap:8px;"></h3>
    <div id="planBarModalBody"></div>
    <div class="modal-actions" id="planBarModalActions">
      <button class="btn" onclick="closePlanBarPopup()">닫기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="planModalOverlay">
  <div class="modal" style="width:460px; max-width:92vw; max-height:86vh; overflow-y:auto;">
    <h3 id="planModalTitle">+ 장기 계획 제출</h3>
    <div id="planModalBody" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closePlanModal()">취소</button>
      <button class="btn primary" onclick="submitPlan()">제출</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editTaskModalOverlay">
  <div class="modal" style="width:420px; max-width:92vw;">
    <h3 id="editTaskModalTitle">수정</h3>
    <div id="editTaskModalBody" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeEditTaskModal()">취소</button>
      <button class="btn primary" onclick="saveEditedTask()">저장</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="lineHistoryModalOverlay">
  <div class="modal" style="width:600px; max-width:94vw; max-height:86vh; overflow-y:auto;">
    <h3>계통 이력 조회</h3>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <input id="lineHistorySearchInput" placeholder="계통번호 입력 (예: YS3228)" style="flex:1;" onkeydown="if(event.key==='Enter') runNewLineSearch();" />
      <button class="btn primary" onclick="runNewLineSearch()">검색</button>
    </div>
    <div id="lineHistoryResults" style="margin-top:16px;"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeLineHistoryModal()">닫기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="guideMenuOverlay" onclick="if(event.target===this) closeGuideMenu()">
  <div class="modal" style="width:380px; max-width:92vw;">
    <h3>? 사용법</h3>
    <div style="font-size:12px; color:var(--ink-faint); margin:-8px 0 12px;">보고 싶은 항목을 골라주세요</div>
    <div class="guide-menu" id="guideMenuList"></div>
    <div class="modal-actions"><button class="btn" onclick="closeGuideMenu()">닫기</button></div>
  </div>
</div>

<div id="tourVeil"></div>
<div class="tour-block" id="tourBlockT"></div>
<div class="tour-block" id="tourBlockB"></div>
<div class="tour-block" id="tourBlockL"></div>
<div class="tour-block" id="tourBlockR"></div>
<div id="tourRing"></div>
<div id="tourPop">
  <div id="tourArrow"></div>
  <div class="tour-pop-head">
    <span class="tour-step-no" id="tourStepNo"></span>
    <button class="tour-x" onclick="endTour()" title="투어 끝내기">✕</button>
  </div>
  <h4 id="tourTitle"></h4>
  <div class="tour-pop-body" id="tourBody"></div>
  <div class="tour-shots" id="tourShots" style="display:none;"></div>
  <div class="tour-skip-row" id="tourSkipRow" style="display:none;">
    <button class="tour-skip" onclick="dontShowTourAgain()">다시 보지 않기</button>
  </div>
  <div class="tour-pop-foot">
    <div class="tour-dots" id="tourDots"></div>
    <div class="tour-foot-btns">
      <button class="tour-btn" id="tourPrevBtn" onclick="moveTour(-1)">이전</button>
      <button class="tour-btn primary" id="tourNextBtn" onclick="moveTour(1)">다음</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 기능별 코드 파일. 순서가 중요해요: core.js가 맨 처음이에요. 이 순서를 바꾸지 마세요. -->
<script src="js/core.js?v=20261106"></script>
<script src="js/overview.js?v=20261102"></script>
<script src="js/lines-form.js?v=20261106"></script>
<script src="js/lines.js?v=20261102"></script>
<script src="js/harvest.js?v=20261106"></script>
<script src="js/history.js?v=20261102"></script>
<script src="js/tasks.js?v=20261102"></script>
<script src="js/survey.js?v=20261102"></script>
<script src="js/plan.js?v=20261102"></script>
<script src="js/plan-adjust.js?v=20261102"></script>
<script src="js/tour.js?v=20261106"></script>
<script src="js/main.js?v=20261102"></script>
<!-- TOUR_SHOTS:BEGIN -->
<!-- ? 사용법의 상황별 예시 스크린샷 (계통작성 · 작업계획). 그림 데이터라 한 줄이 아주 길어요 — 고치지 말고, 바꾸려면 다시 만들어 달라고 해주세요. -->
<script src="js/tour-shots.js?v=20261106"></script>
<!-- TOUR_SHOTS:END -->
</body>
</html>
