// ── 분기별 계획 → 계통작성 불러오기 ─────────────────────────────────────────
// 집단 추가 창을 열면 그 베드·층에 잡힌 분기별 계획을 보여주고, [불러오기]를 누르면 계획 내용이 입력칸에 채워진다.
// 계통번호처럼 실제로 심을 때 정해지는 값만 직접 입력하면 된다. (수요조사 → 계획 → 계통작성이 한 흐름으로 이어진다)
const PLAN_WHEN_CHIP = { now:'done', soon:'wait', past:'past' };
// 이 베드·층의 계획을 오늘 기준으로 정리한다: 진행 중 → 예정(빠른 순) → 지난 계획(최근 순)
function bedPlansAt(roomName, bedNo, floor){
  const spot = demandSpot(roomName, bedNo, floor), today = todayKST();
  const rank = { now:0, soon:1, past:2 };
  return bedPlans.filter(p=> p.planned_start && demandSpot(p.room_name, p.structure_no, p.floor)===spot).map(p=>{
    const end = p.planned_end || p.planned_start;
    return { p, when: p.planned_start > today ? 'soon' : end < today ? 'past' : 'now' };
  }).sort((a, b)=> rank[a.when]-rank[b.when]
    || (a.when==='past' ? b.p.planned_start.localeCompare(a.p.planned_start) : a.p.planned_start.localeCompare(b.p.planned_start)));
}
function planTitleText(p){ return [p.crop_name, p.generation || p.use_purpose].filter(Boolean).join(' · ') || '계획'; }
// 'YYYY-MM-DD'에 달 수를 더한다. 그 달에 없는 날이면 말일로 맞춘다 (예: 3/31 − 1개월 = 2/28)
function addMonthsYmd(ymd, n){
  const [y, m, d] = ymd.split('-').map(Number);
  const t = y*12 + (m-1) + n, ny = Math.floor(t/12), nm = t % 12;
  const last = new Date(ny, nm+1, 0).getDate();
  return `${ny}-${String(nm+1).padStart(2,'0')}-${String(Math.min(d, last)).padStart(2,'0')}`;
}

// 계통작성의 계획 목록에는 오늘(한국 시간)을 기준으로 앞뒤 한 달 안에 걸치는 계획만 보여준다. 기간이 이 범위와 조금이라도 겹치면 보인다.
const BATCH_PLAN_WINDOW_MONTHS = 1;
let batchPlanRefItems = [];     // 지금 집단 추가 창에 보이는 계획들
function renderBatchPlanRef(room, target){
  const wrap = document.getElementById('batchLocPlanRef');
  if(!wrap) return;
  const all = target ? bedPlansAt(room.name, target.bedNo, target.floor) : [];
  const today = todayKST();
  const winStart = addMonthsYmd(today, -BATCH_PLAN_WINDOW_MONTHS), winEnd = addMonthsYmd(today, BATCH_PLAN_WINDOW_MONTHS);
  batchPlanRefItems = all.filter(({ p })=> p.planned_start <= winEnd && (p.planned_end || p.planned_start) >= winStart);
  if(!batchPlanRefItems.length){ wrap.innerHTML = ''; return; }   // 보여줄 계획이 없으면 아무것도 보이지 않는다
  // 계획 하나가 카드 하나. 카드를 누르면 그 계획 내용이 아래 칸에 자동으로 채워진다.
  // 계통번호가 제일 크게 보이고(없으면 '계통번호 미정'), 그 아래에 작물·세대와 기간·규모·담당이 한눈에 보인다.
  const ymdDots = (ymd)=> ymd.replace(/-/g, '.');
  const whenText = (when, p)=>{
    if(when==='soon') return `예정 · ${daysBetween(today, p.planned_start)}일 후 시작`;
    if(when==='now'){ const left = daysBetween(today, p.planned_end || p.planned_start); return left>0 ? `진행 중 · ${left}일 남음` : '진행 중 · 오늘 끝나요'; }
    return '지난 계획';
  };
  const cards = batchPlanRefItems.map(({ p, when }, idx)=>{
    const end = p.planned_end || p.planned_start;
    const facts = [
      ['기간', `${ymdDots(p.planned_start)} ~ ${ymdDots(end)} · ${daysBetween(p.planned_start, end)}일`],
      ['검정 목적', planPurposeKind(p)==='고온검정' ? p.purpose : ''],
      ['교배', p.cross_combo],
      ['처리 조건', planCondText(p) || [p.heat_temp, p.heat_stage].filter(Boolean).join(' · ')],
      ['규모', p.expected_scale!=null ? `${Number(p.expected_scale).toLocaleString()}개체` : ''],
      ['담당', p.submitted_by]
    ].filter(([, v])=> v);
    return `
      <div class="bp-card ${when==='past' ? 'past' : ''}" role="button" tabindex="0" title="누르면 이 계획 내용이 아래 칸에 채워져요"
           onclick="loadBatchFromPlan(${idx})" onkeydown="if(event.key==='Enter'||event.key===' '){ event.preventDefault(); loadBatchFromPlan(${idx}); }">
        <div class="bp-main">
          <div class="bp-head">
            ${p.line_no ? `<span class="bp-line">${escapeHtml(p.line_no)}</span>` : lineNoHidden(p.use_purpose) ? '' : `<span class="bp-line none">${lineNoLabel(p.use_purpose)} 미정</span>`}
            <span class="sv-chip ${PLAN_WHEN_CHIP[when]}">${whenText(when, p)}</span>
          </div>
          <div class="bp-what"><span class="pd-dot" style="background:${cropColor(p.crop_name)};"></span>${escapeHtml(planTitleText(p))}</div>
          <dl class="bp-facts">${facts.map(([k, v])=> `<dt>${k}</dt><dd>${escapeHtml(String(v))}</dd>`).join('')}</dl>
        </div>
        <span class="bp-go">이 계획으로 채우기</span>
      </div>`;
  }).join('');
  const lacksLineNo = batchPlanRefItems.some(({ p })=> !p.line_no && !lineNoHidden(p.use_purpose));
  wrap.innerHTML = `
    <div class="bp-ref">
      <div class="bp-ref-title">📅 ${escapeHtml(spotText(target.bedNo, target.floor))}의 분기별 계획 ${batchPlanRefItems.length}건</div>
      <div class="bp-ref-hint">계획을 누르면 아래 칸이 자동으로 채워져요.${lacksLineNo ? ' 계통번호(고온검정은 계통/품종)가 미정인 계획은 그 칸만 직접 입력해주세요.' : ''}</div>
      <div class="bp-cards">${cards}</div>
    </div>`;
}
function loadBatchFromPlan(idx){
  const item = batchPlanRefItems[idx];
  if(!item) return;
  const p = item.p;
  const root = document.getElementById('batchLocFields');
  if(!root) return;
  fillBatchFormFromPlan(root, p);   // 계획의 사용 목적(세대단축 · 인공교배 · 고온검정 · 기타)에 맞는 양식으로 바뀌고, 계획 내용이 채워진다
  // 방금 채운 카드는 강조하고 '✓ 채워짐'으로 바꾼다 (다른 카드를 누르면 그쪽으로 옮겨 간다)
  document.querySelectorAll('#batchLocPlanRef .bp-card').forEach((card, i)=>{
    card.classList.toggle('loaded', i===idx);
    card.querySelector('.bp-go').textContent = i===idx ? '✓ 채워짐' : '이 계획으로 채우기';
  });
  if(p.line_no){
    showToast(`${lineNoLabel(p.use_purpose)} ${p.line_no} · 계획 내용을 채웠어요`);
  } else if(lineNoHidden(p.use_purpose)){
    showToast('계획 내용을 채웠어요');
  } else {
    showToast('계획 내용을 불러왔어요 · 계통번호를 입력해주세요');
    const lineEl = root.querySelector('[data-bf="line_no"]');
    if(lineEl && lineEl.style.display!=='none') lineEl.focus();
  }
}

// '집단 추가 · 복사' 입력칸은 팝업이 아니라 계통작성 오른쪽 작성 패널(#workRoomDetail) 안에 바로 열린다.
// (함수 이름의 'Modal'은 예전 팝업 시절 이름을 그대로 쓴 것이다)
function openBatchLocationModal(roomId, prefill, defaultChecked, opts){
  batchLocModalRoomId = roomId;
  const room = rooms.find(r=>r.id===roomId);
  const panel = document.getElementById('workRoomDetail');
  if(!room || !panel) return;
  const cfg = DEFAULT_ROOM_CONFIG[room.name];
  const bedCount = cfg ? cfg.bed_count : (room.structure_count||0);
  const bedFloors = cfg ? cfg.bed_floors : (room.bed_floors||2);

  // 여러 자리를 한꺼번에 등록할 때는 defaultChecked = { multi: [{bedNo, floor}, ...] }
  const multiTargets = (!prefill && defaultChecked && defaultChecked.multi) ? defaultChecked.multi : null;
  const roomLabel = ROOM_DISPLAY_LABELS[room.name] || room.name;
  // 수확 완료 목록의 [세대진전] · [다시 심기]로 열었는지: 같은 입력칸이고, 제목 · 위치 안내만 다르다
  const replant = !!(opts && opts.replant);
  const advance = replant && !!opts.advance;
  const replantName = replant ? (prefill.line_no || prefill.cross_combo || prefill.name || '계통') : '';
  const locLabel = replant ? '심을 위치' : '복사할 위치';
  const title = advance ? '세대진전' : replant ? '다시 심기' : prefill ? '이 정보를 다른 위치에 복사' : (multiTargets ? `집단 추가 · ${multiTargets.length}곳` : '집단 추가');
  const subtitle = replant ? `${roomLabel} · 수확 완료한 ${replantName}` : (!prefill && !multiTargets && defaultChecked) ? `${roomLabel} · ${workSpotLabel(room, defaultChecked)}` : roomLabel;
  panel.innerHTML = `
    <div class="batch-compose">
      <div class="panel-box-head"><div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(subtitle)}</p></div></div>
      ${advance ? '<div id="batchLocNotice"></div>' : ''}
      <div id="batchLocLocation" style="margin-bottom:11px;"></div>
      <div id="batchLocPlanRef"></div>
      <div id="batchLocFields"></div>
      <div class="batch-compose-actions">
        <button class="btn primary" onclick="submitBatchLocModal()">등록</button>
        <button class="btn" onclick="closeBatchLocModal()">취소</button>
      </div>
    </div>
  `;
  batchCompose = { sig: workSelectionSig(), replant, advance };
  const defaultCropName = prefill?.name || null;

  if(multiTargets){
    document.getElementById('batchLocLocation').innerHTML = `
      <input type="hidden" id="locTargets" value="${multiTargets.map(t=> `${t.bedNo}|${t.floor}`).join(',')}" />
      <div style="font-size:11px; color:var(--ink-faint); font-weight:700; margin-bottom:6px;">등록할 자리 ${multiTargets.length}곳 · 아래 내용이 모두에 똑같이 들어가요</div>
      <div class="wm-chips">${multiTargets.map(t=> `<span class="wm-chip">${workSpotLabel(room, t)}</span>`).join('')}</div>
    `;
  } else if(defaultChecked){
    document.getElementById('batchLocLocation').innerHTML = `
      <input type="hidden" id="locTarget" value="${defaultChecked.bedNo}|${defaultChecked.floor}" />
    `;
  } else if(bedCount > 0){
    let bedOptions = '';
    for(let i=1;i<=bedCount;i++){ bedOptions += `<option value="${i}">베드 ${i}</option>`; }
    if(AISLE_ROOMS.has(room.name)) bedOptions += `<option value="${AISLE_BED_NO}">통로</option>`;   // 인공교배실은 통로로도 복사할 수 있다
    const floorOptions = locFloorOptionsHtml(1, bedFloors);
    document.getElementById('batchLocLocation').innerHTML = `
      <label style="font-size:11px; color:var(--ink-faint); font-weight:700; display:block; margin-bottom:4px;">${locLabel}</label>
      <div style="display:flex; gap:7px; margin-bottom:11px;">
        <select id="locBedNo" style="flex:1; min-width:0; margin-bottom:0;" onchange="syncLocFloorOptions(${bedFloors})">${bedOptions}</select>
        <select id="locFloorSel" style="flex:1; min-width:0; margin-bottom:0;">${floorOptions}</select>
      </div>
    `;
    // [세대진전] · [다시 심기]: 미리 골라 둔 자리로 맞춘다 (층 칸은 베드를 고른 뒤에 채워진다)
    if(replant && opts.spot){
      const bedSel = document.getElementById('locBedNo'), floorSel = document.getElementById('locFloorSel');
      if([...bedSel.options].some(o=> o.value === String(opts.spot.bedNo))){
        bedSel.value = String(opts.spot.bedNo);
        syncLocFloorOptions(bedFloors);
        if([...floorSel.options].some(o=> o.value === opts.spot.floor)) floorSel.value = opts.spot.floor;
      }
    }
  } else {
    document.getElementById('batchLocLocation').innerHTML = `
      <label style="font-size:11px; color:var(--ink-faint); font-weight:700; display:block; margin-bottom:4px;">${locLabel}</label>
      <div style="font-size:12.5px; color:var(--ink-faint); padding:8px 0;">이 방엔 베드가 없어요</div>
    `;
  }

  // 사용 목적별 양식 (수요조사와 같은 구성). 복사할 때는 원래 계통의 목적 그대로, 새로 등록할 때는 세대단축으로 시작하고 분기별 계획을 누르면 그 계획의 목적으로 바뀐다
  const fieldsRoot = document.getElementById('batchLocFields');
  fieldsRoot.setAttribute('data-bf-root', '');
  fieldsRoot.dataset.bfMode = 'create';
  fieldsRoot.innerHTML = batchFormHtml(prefill ? batchFormValues(prefill) : { use_purpose:'세대단축', name: defaultCropName }, 'create');
  if(advance){
    // 입력칸 맨 위(제목 · 수정 필요 안내)가 보이도록 올리고, 고쳐야 하는 칸(세대 · 파종일)을 강조한다
    panel.scrollIntoView({ behavior:'smooth', block:'start' });
    markFieldsForEdit(fieldsRoot, prefill);
  }

  // 새로 추가할 때만 그 베드·층의 분기별 계획을 보여준다 (다른 위치로 복사할 때는 보여주지 않는다)
  renderBatchPlanRef(room, (!prefill && defaultChecked && !multiTargets) ? { bedNo: Number(defaultChecked.bedNo), floor: defaultChecked.floor } : null);
  // 화면이 좁아 작성 패널이 아래로 내려가 있으면 입력칸이 보이도록 스크롤해 준다
  if(window.matchMedia('(max-width: 1150px)').matches) panel.scrollIntoView({ behavior:'smooth', block:'start' });
}

// 복사할 위치의 층 칸: 통로를 고르면 '통로' 하나, 베드를 고르면 그 방의 층들
function locFloorOptionsHtml(bedNo, bedFloors){
  if(isAisleSpot(bedNo)) return `<option value="${AISLE_FLOOR}">${AISLE_FLOOR}</option>`;
  return bedFloors===2 ? `<option value="1층">1층</option><option value="2층">2층</option>` : `<option value="1층">1층</option>`;
}
function syncLocFloorOptions(bedFloors){
  const bedSel = document.getElementById('locBedNo'), floorSel = document.getElementById('locFloorSel');
  if(!bedSel || !floorSel) return;
  const keep = floorSel.value;
  floorSel.innerHTML = locFloorOptionsHtml(parseInt(bedSel.value), bedFloors);
  if([...floorSel.options].some(o=> o.value===keep)) floorSel.value = keep;
}
// ── 계통작성 입력 양식: 수요조사처럼 사용 목적(세대단축 · 인공교배 · 고온검정 · 기타)마다 받는 칸이 다르다 ─────────
// 집단 추가 · 복사 입력칸과 계통 카드의 편집 칸이 같은 양식(batchFormHtml)을 쓰고, 읽는 곳도 하나(readBatchForm)다.
//  · 세대단축: 계통번호 · 교배조합 · 세대 · 교배목적 · 규모 · 파종일 · 예상기간 · 온도 · 일장
//  · 인공교배: 계통번호 없음 · 교배조합 · 세대 · 교배목적 · 규모 · 사용 시작일 · 사용기간 · 온도 · 일장
//  · 고온검정: 계통/품종 · 검정 목적 · 처리 조건 · 규모
//  · 기타: 계통/품종 · 실험 내용 · 처리 조건 · 규모 · 시작일 · 기간
// 저장 칸: 사용 목적은 record_type(고온검정만) + use_purpose(인공교배 · 기타, 새 컬럼)에, 온도 · 일장 · 처리 조건은 test_condition에 담는다.
const BATCH_PURPOSES = ['세대단축','인공교배','고온검정','기타'];
const BATCH_PURPOSE_LABELS = { '세대단축':'세대단축용', '인공교배':'인공교배용', '고온검정':'고온검정용', '기타':'기타(실험)용' };
const MATERIAL_PURPOSE_SQL = 'alter table materials add column if not exists use_purpose text;';
// 저장된 계통의 사용 목적 (use_purpose 컬럼이 없던 예전 계통은 record_type으로 알아낸다)
function batchPurposeOf(b){
  if(b && b.record_type === 'heat_test') return '고온검정';
  const u = b && b.use_purpose;
  if(BATCH_PURPOSES.includes(u)) return u;
  // 사용 목적이 저장돼 있지 않은 계통(use_purpose 컬럼을 아직 안 만들었거나 예전에 등록한 것): 인공교배실에 있고
  // 세대도 계통번호도 없으면 인공교배로 본다 (인공교배는 계통번호 없이 교배조합으로 등록하는 목적이다)
  const room = b && typeof rooms !== 'undefined' ? rooms.find(r=> r.id===b.room_id) : null;
  if(room && AISLE_ROOMS.has(room.name) && !b.generation && !b.line_no) return '인공교배';
  return '세대단축';
}
// 분기별 계획의 사용 목적 → 계통 양식 (세대단축 · 인공교배 · 고온검정 · 직접 적은 실험 내용은 기타). 알 수 없으면 null
function planPurposeKind(p){
  const u = String(p.use_purpose || '').trim();
  if(['세대단축','인공교배','고온검정'].includes(u)) return u;
  if(u) return '기타';
  return p.generation ? '세대단축' : null;
}
// 수요조사의 '처리 조건'(온도 · 일장 · 구간별 조건)은 계획으로 옮겨질 때 요청사항 글에 합쳐져 있다. 그 줄에서 꺼낸다
function planCondText(p){ const m = /처리 조건:\s*([^\n]*)/.exec(p.notes || ''); return m ? m[1].trim() : ''; }
// '온도 25℃, 일장 10시간' ↔ { temp:'25℃', day:'10시간' }
function parseEnvCond(s){
  const t = /온도\s*([^,]+)/.exec(s || ''), d = /일장\s*([^,]+)/.exec(s || '');
  return { temp: t ? t[1].trim() : '', day: d ? d[1].trim() : '' };
}
function joinEnvCond(temp, day){ return [temp && `온도 ${temp}`, day && `일장 ${day}`].filter(Boolean).join(', '); }
function withUnit(v, unit){ return v && !String(v).endsWith(unit) ? v + unit : (v || ''); }

// 목적에 따라 달라지는 글자 (mode: 'create' 새로 등록 · 'edit' 계통 카드 편집)
function batchTexts(purpose, mode){
  const sow = { '세대단축':'파종일', '인공교배':'사용 시작일', '기타':'시작일' }[purpose] || '시작일';
  const days = purpose==='세대단축' ? (mode==='edit' ? '예상기간(일)' : '다음 세대까지 예상기간(일)') : '사용기간(일)';
  const harvest = { '세대단축':'수확예정일', '인공교배':'사용 종료일', '기타':'종료일' }[purpose] || '종료일';
  const cond = purpose==='고온검정' ? '처리 조건 (예: 45℃ 3일)' : '처리 조건 (예: 온도 25℃, 일장 10시간)';
  return { line: lineNoLabel(purpose), linePh: lineNoPlaceholder(purpose), sow, days, harvest, cond };
}
const BATCH_LBL_STYLE = 'font-size:11px; color:var(--ink-faint); font-weight:700; display:block; margin-bottom:4px;';
// v: { use_purpose, name, line_no, cross_combo, generation, purpose, quantity, sowing_date, expected_days, harvest_date, test_condition }
function batchFormHtml(v, mode, extra = {}){
  const e = escapeHtml;
  const purpose = BATCH_PURPOSES.includes(v.use_purpose) ? v.use_purpose : '세대단축';
  const t = batchTexts(purpose, mode);
  // sa: 목적이 바뀔 때 보이고 숨길 칸 표시 · sh: 지금 목적에서 안 쓰는 칸은 처음부터 숨긴다
  const sa = (list)=> `data-sec data-for="${list}"`;
  const sh = (list)=> list.split(' ').includes(purpose) ? '' : 'display:none;';
  const crops = [...CROP_OPTIONS]; if(v.name && !crops.includes(v.name)) crops.push(v.name);
  const env = (purpose==='세대단축' || purpose==='인공교배') ? parseEnvCond(v.test_condition) : { temp:'', day:'' };
  const unitAttrs = (u)=> `onfocus="unitFocus(this,'${u}')" oninput="unitInput(this,'${u}')" onblur="unitBlur(this,'${u}')"`;
  const nameSel = `<select data-bf="name"><option value="">작물 선택</option>${crops.map(c=>`<option value="${e(c)}" ${v.name===c?'selected':''}>${e(c)}</option>`).join('')}</select>`;
  const lineIn = `<input data-bf="line_no" placeholder="${e(t.linePh)}" value="${e(v.line_no||'')}" ${lineNoHidden(purpose) ? 'style="display:none;"' : ''} />`;
  const purposeSel = `<select data-bf="use_purpose" onchange="onBatchPurposeChange(this)" style="margin-bottom:11px;${mode==='edit' ? ' margin-top:8px;' : ''}">
      ${BATCH_PURPOSES.map(p=> `<option value="${p}" ${purpose===p?'selected':''}>${BATCH_PURPOSE_LABELS[p]}</option>`).join('')}
    </select>`;
  // 새로 등록할 때는 무엇을 위한 계통인지(사용 목적)를 가장 먼저 고른다. 계통 카드 편집은 예전처럼 작물 · 계통번호가 위에 있다
  const top = mode==='edit' ? `<div class="row2">${nameSel}${lineIn}</div>${purposeSel}` : `${purposeSel}${nameSel}${lineIn}`;
  const breed = '세대단축 인공교배', anyDate = '세대단축 인공교배 기타', condFor = '고온검정 기타';
  return `
    ${top}
    <div class="${mode==='edit' ? 'card-extra' : ''}">
      <div ${sa(breed)} class="row2" style="margin-bottom:11px;${sh(breed)}">
        <input data-bf="cross_combo" placeholder="교배조합 (예: 선풍/남천)" value="${e(v.cross_combo||'')}" style="margin-bottom:0;" />
        <input data-bf="generation" placeholder="세대 (예: F3)" value="${e(v.generation||'')}" style="margin-bottom:0;" />
      </div>
      <input data-bf="purpose_breed" ${sa(breed)} style="${sh(breed)}" placeholder="교배목적" value="${e(v.purpose||'')}" />
      <input data-bf="purpose_heat" ${sa('고온검정')} style="${sh('고온검정')}" placeholder="검정 목적 (예: 개화기 고온내성 평가)" value="${e(v.purpose||'')}" />
      <input data-bf="purpose_etc" ${sa('기타')} style="${sh('기타')}" placeholder="실험 내용 (예: 일장 반응 실험)" value="${e(v.purpose||'')}" />
      <div ${sa(breed)} class="row2" style="margin-bottom:11px;${sh(breed)}">
        <label style="${BATCH_LBL_STYLE}">온도<input data-bf="env_temp" placeholder="예: 25℃" value="${e(withUnit(env.temp,'℃'))}" ${unitAttrs('℃')} /></label>
        <label style="${BATCH_LBL_STYLE}">일장<input data-bf="env_day" placeholder="예: 10시간" value="${e(withUnit(env.day,'시간'))}" ${unitAttrs('시간')} /></label>
      </div>
      <input data-bf="test_condition" ${sa(condFor)} style="${sh(condFor)}" placeholder="${e(t.cond)}" value="${e((purpose==='고온검정'||purpose==='기타') ? (v.test_condition||'') : '')}" />
      <label style="${BATCH_LBL_STYLE}">규모
        <input data-bf="quantity" type="number" placeholder="개체수" value="${v.quantity ?? ''}" />
      </label>
      <div ${sa(anyDate)} class="row2" style="margin-bottom:11px;${sh(anyDate)}">
        <label style="${BATCH_LBL_STYLE}"><span data-lbl="sow">${t.sow}</span>
          <input data-bf="sowing_date" type="date" value="${v.sowing_date||''}" />
        </label>
        <label style="${BATCH_LBL_STYLE}"><span data-lbl="days">${t.days}</span>
          <input data-bf="expected_days" type="number" placeholder="예: 45" value="${v.expected_days ?? ''}" />
        </label>
      </div>
      ${mode==='edit' ? `
      <div ${sa(anyDate)} class="row2" style="${sh(anyDate)}">
        <label style="${BATCH_LBL_STYLE}"><span data-lbl="harvest">${t.harvest}</span>
          <input data-bf="harvest_date" type="date" value="${v.harvest_date||''}" />
        </label>
        <div style="flex:1; display:flex; align-items:flex-end; padding-bottom:2px;">${extra.progressHtml||''}</div>
      </div>
      <div ${sa('세대단축')} style="${sh('세대단축')}">${extra.histHtml||''}</div>` : ''}
    </div>`;
}
// 계통(materials 한 줄) → 양식 값
function batchFormValues(b){
  return { use_purpose: batchPurposeOf(b), name: b.name, line_no: b.line_no, cross_combo: b.cross_combo, generation: b.generation, purpose: b.purpose,
    quantity: b.quantity, sowing_date: b.sowing_date, expected_days: b.expected_days, harvest_date: b.harvest_date, test_condition: b.test_condition };
}
// 사용 목적을 바꿨을 때: 그 목적의 칸만 보이고, 계통번호 · 날짜 · 처리 조건 칸의 글자가 목적에 맞게 바뀐다
function onBatchPurposeChange(sel){
  const root = sel.closest('[data-bf-root]');
  if(!root) return;
  const purpose = sel.value, t = batchTexts(purpose, root.dataset.bfMode || 'create');
  root.querySelectorAll('[data-sec]').forEach(el=>{ el.style.display = el.dataset.for.split(' ').includes(purpose) ? '' : 'none'; });
  const lineEl = root.querySelector('[data-bf="line_no"]');
  if(lineEl){ lineEl.style.display = lineNoHidden(purpose) ? 'none' : ''; lineEl.placeholder = t.linePh; }
  const txt = (k, s)=>{ const el = root.querySelector(`[data-lbl="${k}"]`); if(el) el.textContent = s; };
  txt('sow', t.sow); txt('days', t.days); txt('harvest', t.harvest);
  const condEl = root.querySelector('[data-bf="test_condition"]'); if(condEl) condEl.placeholder = t.cond;
  // 목적을 바꿔도 이미 적은 처리 조건이 사라지지 않게, 온도 · 일장 ↔ 처리 조건 글을 서로 옮겨 준다
  const v = (f)=> (root.querySelector(`[data-bf="${f}"]`) || {}).value || '';
  const tempEl = root.querySelector('[data-bf="env_temp"]'), dayEl = root.querySelector('[data-bf="env_day"]');
  if(purpose==='세대단축' || purpose==='인공교배'){
    if(tempEl && dayEl && !v('env_temp') && !v('env_day') && v('test_condition')){
      const env = parseEnvCond(v('test_condition'));
      tempEl.value = withUnit(env.temp, '℃'); dayEl.value = withUnit(env.day, '시간');
    }
  } else if(condEl && !condEl.value){
    condEl.value = joinEnvCond(v('env_temp') === '℃' ? '' : v('env_temp'), v('env_day') === '시간' ? '' : v('env_day'));
  }
}
// 양식 읽기: 선택한 사용 목적에 맞는 칸만 읽어 materials에 저장할 값으로 만든다
function readBatchForm(root){
  const val = (f)=> { const el = root.querySelector(`[data-bf="${f}"]`); return el ? el.value.trim() : ''; };
  const unitVal = (f, u)=> { const x = val(f); return x === u ? '' : x; };
  const purpose = BATCH_PURPOSES.includes(val('use_purpose')) ? val('use_purpose') : '세대단축';
  const qty = val('quantity');
  const base = {
    name: val('name'), line_no: lineNoHidden(purpose) ? null : (val('line_no') || null),
    quantity: qty === '' ? null : Number(qty),
    record_type: purpose==='고온검정' ? 'heat_test' : 'breeding',
    updated_at: new Date().toISOString()
  };
  if(purpose==='고온검정'){
    return { purpose, rememberDays:false, payload: { ...base,
      purpose: val('purpose_heat') || null, test_condition: val('test_condition') || null,
      cross_combo: null, generation: null, sowing_date: null, expected_days: null, harvest_date: null } };
  }
  const etc = purpose==='기타';
  const sowing_date = val('sowing_date') || null;
  let expected_days = val('expected_days') === '' ? null : parseInt(val('expected_days'));
  let harvest_date = val('harvest_date') || null;
  // 세대단축만 '작물별 기본 기간'(crop_profiles)을 쓰고 기억한다. 사용기간(인공교배 · 기타)은 작물의 생육일수가 아니다
  const growth = purpose==='세대단축';
  if(growth && expected_days == null && base.name && cropProfiles[base.name] != null) expected_days = cropProfiles[base.name];
  if(!harvest_date && sowing_date && expected_days != null) harvest_date = addDays(sowing_date, expected_days);
  const daysEl = root.querySelector('[data-bf="expected_days"]');
  const daysFromPlan = !!daysEl && daysEl.dataset.fromPlan!==undefined && daysEl.dataset.fromPlan===daysEl.value;
  return { purpose, rememberDays: growth && expected_days != null && !!base.name && !daysFromPlan, payload: { ...base,
    cross_combo: etc ? null : (val('cross_combo') || null), generation: etc ? null : (val('generation') || null),
    purpose: (etc ? val('purpose_etc') : val('purpose_breed')) || null,
    test_condition: etc ? (val('test_condition') || null) : (joinEnvCond(unitVal('env_temp','℃'), unitVal('env_day','시간')) || null),
    sowing_date, expected_days, harvest_date } };
}
// 분기별 계획 한 건 → 양식 칸 채우기. 계획의 사용 목적에 맞는 양식으로 바뀌고, 계획에 적힌 만큼 채워진다
function fillBatchFormFromPlan(root, p){
  const el = (f)=> root.querySelector(`[data-bf="${f}"]`);
  const set = (f, v)=>{ const x = el(f); if(x) x.value = v ?? ''; };
  const sel = el('use_purpose');
  const kind = planPurposeKind(p);
  if(kind){ sel.value = kind; onBatchPurposeChange(sel); }
  const purpose = sel.value;
  const nameSel = el('name');
  if(p.crop_name && ![...nameSel.options].some(o=> o.value===p.crop_name)) nameSel.add(new Option(p.crop_name, p.crop_name));
  nameSel.value = p.crop_name || '';
  if(p.line_no) set('line_no', p.line_no);   // 계획에 계통번호가 없으면 이미 입력해 둔 값을 그대로 둔다
  const scale = p.expected_scale!=null ? String(p.expected_scale) : '';
  const cond = planCondText(p);
  set('quantity', scale);
  if(purpose==='고온검정'){
    set('purpose_heat', p.purpose);   // 수요조사에서 적은 검정 목적이 그대로 들어온다
    set('test_condition', [p.heat_temp, p.heat_stage].filter(Boolean).join(' · ') || cond);
    return;
  }
  const days = p.planned_days!=null && p.planned_days!=='' ? p.planned_days : daysBetween(p.planned_start, p.planned_end || p.planned_start);
  set('sowing_date', p.planned_start); set('expected_days', days);
  // 계획에서 가져온 기간은 '작물별 기본 기간'(crop_profiles)으로 기억하지 않는다 (직접 입력/수정한 값만 기억)
  el('expected_days').dataset.fromPlan = String(days);
  if(purpose==='기타'){
    set('purpose_etc', kind==='기타' ? String(p.use_purpose).trim() : '');
    set('test_condition', cond);
  } else {
    set('cross_combo', p.cross_combo); set('generation', p.generation); set('purpose_breed', p.purpose);
    const env = parseEnvCond(cond);
    set('env_temp', withUnit(env.temp, '℃')); set('env_day', withUnit(env.day, '시간'));
  }
}

// 입력칸을 닫고 작성 패널을 원래 내용(선택한 자리의 계통 카드 · 여러 자리 목록)으로 되돌린다

}

async function submitBatchLocModal(){
  if(tourPreview){ closeBatchLocModal(); showToast('이렇게 등록돼요! 투어 중이라 실제로 저장되진 않았어요'); return; }
  const wasReplant = !!(batchCompose && batchCompose.replant);   // 수확 완료 목록의 [세대진전] · [다시 심기]로 연 입력칸인지
  const wasAdvance = !!(batchCompose && batchCompose.advance);
  // 등록할 자리들: 여러 자리(locTargets) · 한 자리(locTarget) · 복사할 위치를 고른 한 자리
  const multiEl = document.getElementById('locTargets');
  const hiddenTargetEl = document.getElementById('locTarget');
  let targets;
  if(multiEl){
    targets = multiEl.value.split(',').filter(Boolean).map(k=>{ const [b, f] = k.split('|'); return { bedNo: parseInt(b), floor: f }; });
    if(!targets.length){ alert('위치를 선택해주세요.'); return; }
  } else if(hiddenTargetEl){
    if(!hiddenTargetEl.value){ alert('위치를 선택해주세요.'); return; }
    const [b, f] = hiddenTargetEl.value.split('|');
    targets = [{ bedNo: parseInt(b), floor: f }];
  } else {
    const bedSel = document.getElementById('locBedNo');
    const floorSel = document.getElementById('locFloorSel');
    if(!bedSel || !bedSel.value || !floorSel || !floorSel.value){ alert('위치를 선택해주세요.'); return; }
    targets = [{ bedNo: parseInt(bedSel.value), floor: floorSel.value }];
  }

  // 선택한 사용 목적(세대단축 · 인공교배 · 고온검정 · 기타)의 칸만 읽는다
  const form = readBatchForm(document.getElementById('batchLocFields'));
  const payload = form.payload, name = payload.name;
  if(!name){ alert('작물을 선택해주세요.'); return; }

  const occupied = targets.filter(t=> materials.some(m=> m.room_id===batchLocModalRoomId && m.structure_no===t.bedNo && m.floor===t.floor && !m.harvest_confirmed_at));
  if(occupied.length){
    const where = occupied.map(t=> spotText(t.bedNo, t.floor)).join(', ');
    if(!confirm(`${where}에는 이미 등록된 작물이 있어요.\n그래도 ${targets.length>1 ? '모두 ' : ''}새로 추가할까요?`)) return;
  }

  // 사용 목적(인공교배 · 기타)은 새 컬럼 use_purpose에 담는다. 세대단축 · 고온검정은 예전 그대로(컬럼 없이도 저장된다)
  const needsPurposeCol = form.purpose==='인공교배' || form.purpose==='기타';
  if(needsPurposeCol) payload.use_purpose = form.purpose;

  // 고른 자리마다 같은 내용으로 한 줄씩 (여러 자리여도 한 번에 저장한다)
  let rows = targets.map(t=> ({ room_id: batchLocModalRoomId, structure_no: t.bedNo, floor: t.floor, ...payload }));
  // 저장되는 동안 입력칸이 화면에 남아 있으니, 버튼을 한 번 더 눌러 같은 내용이 두 번 등록되지 않게 막아 둔다
  const submitBtn = document.querySelector('#workRoomDetail .batch-compose-actions .primary');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '등록 중…'; }
  let { error } = await sb.from('materials').insert(rows);
  let purposeDropped = false;
  if(error && needsPurposeCol && /use_purpose/.test(error.message||'')){
    // materials에 use_purpose 컬럼이 아직 없으면, 그 항목만 빼고 다시 저장해서 계통 자체는 잃지 않게 한다
    rows = rows.map(r=>{ const c = { ...r }; delete c.use_purpose; return c; });
    ({ error } = await sb.from('materials').insert(rows));
    purposeDropped = !error;
  }
  if(error){
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '등록'; }
    alert('등록 실패!\n\n' + (error.message||JSON.stringify(error)));
    return;
  }
  batchCompose = null;   // 저장됐으니 입력칸은 이제 닫아도 된다 (아래 loadAll이 최신 내용으로 패널을 다시 그린다)
  // 세대단축의 예상기간만 작물별 기본 기간으로 기억한다 (계획에서 불러온 기간을 그대로 등록한 경우 · 인공교배 · 기타의 사용기간은 제외)
  if(form.rememberDays){
    await sb.from('crop_profiles').upsert({ name, typical_days: payload.expected_days, updated_at: new Date().toISOString() });
  }
  if(purposeDropped) alert('등록은 됐지만, 사용 목적(' + form.purpose + ')은 materials 테이블에 해당 컬럼이 없어 저장되지 않았어요.\n\n(관리자 확인 필요) Supabase SQL Editor에서 아래를 한 번 실행해주세요:\n\n' + MATERIAL_PURPOSE_SQL);
  showToast(wasAdvance ? `세대진전으로 심었어요 · ${spotText(targets[0].bedNo, targets[0].floor)}${payload.generation ? ` · ${payload.generation}` : ''}` : wasReplant ? `다시 심었어요 · ${spotText(targets[0].bedNo, targets[0].floor)}` : targets.length>1 ? `${targets.length}곳에 등록됐어요` : '등록됐어요');
  if(multiEl){
    // 여러 자리 등록을 마쳤으면 모드를 끝내고, 첫 번째 자리를 열어서 방금 등록한 결과를 보여준다
    workMultiMode = false;
    workMultiSpots = new Set();
    workSelectedSpot = { bedNo: targets[0].bedNo, floor: targets[0].floor };
  } else if(wasReplant){
    workSelectedSpot = { bedNo: targets[0].bedNo, floor: targets[0].floor };   // 다시 심은 자리를 열어서 방금 심은 계통을 바로 보여준다
  }
  await loadAll();
  // 데이터를 못 불러와 패널이 다시 그려지지 않았다면 입력칸만이라도 닫는다
  if(document.querySelector('#workRoomDetail .batch-compose')) closeBatchLocModal();
}

// 지금 고른 방. DB에 아직 없는 방이라도 베드 맵을 그릴 수 있게 이름만 있는 방을 돌려준다 (심긴 계통 · 계획은 없음으로 나온다)

function toggleSurveyDemandDetail(roomName){

  renderSurveyView();

function surveyDateToDays(d){ return Math.floor(d.getTime()/86400000); }
function surveyRangesOverlap(ranges){
  const sorted = [...ranges].sort((a,b)=> a.start-b.start);
  for(let i=1;i<sorted.length;i++){
    if(sorted[i].start <= sorted[i-1].end) return true;
  }
  return false;
}

function roomHasBedOverlap(roomName){
  const items = demandSurveys.filter(s=> s.room_name===roomName && s.desired_start);
  const groups = {};
  items.forEach(s=>{
    const key = s.bed_no!=null ? `${s.bed_no}|||${s.floor||''}` : '__미지정__';
    if(!groups[key]) groups[key] = [];
    groups[key].push(s);
  });
  return Object.values(groups).some(g=>{
    if(g.length<2) return false;
    const ranges = g.map(s=>({
      start: new Date(s.desired_start+'T00:00:00'),
      end: s.desired_end ? new Date(s.desired_end+'T00:00:00') : new Date(s.desired_start+'T00:00:00')
    }));
    return surveyRangesOverlap(ranges);
  });
}
function renderSurveyRoomTimelineHtml(roomName){
  const items = demandSurveys.filter(s=> s.room_name===roomName && s.desired_start);
  if(!items.length){
    return `<div class="empty-materials" style="padding:14px 0;">이 방은 희망 기간이 입력된 응답이 없어요.</div>`;
  }

  let minStart = null, maxEnd = null;
  items.forEach(s=>{
    const st = new Date(s.desired_start+'T00:00:00');
    const en = s.desired_end ? new Date(s.desired_end+'T00:00:00') : st;
    if(!minStart || st<minStart) minStart = st;
    if(!maxEnd || en>maxEnd) maxEnd = en;
  });
  const rangeStart = new Date(minStart.getFullYear(), minStart.getMonth(), 1);
  const rangeEnd = new Date(maxEnd.getFullYear(), maxEnd.getMonth()+1, 1);
  const totalDays = Math.max(1, surveyDateToDays(rangeEnd) - surveyDateToDays(rangeStart));

  let monthTicks = '';
  let cursor = new Date(rangeStart);
  while(cursor < rangeEnd){
    const offsetDays = surveyDateToDays(cursor) - surveyDateToDays(rangeStart);
    const leftPct = (offsetDays/totalDays*100).toFixed(2);
    monthTicks += `<div style="position:absolute; left:${leftPct}%; top:0; bottom:0; border-left:1px dashed var(--line); font-size:10px; font-weight:700; color:var(--ink-faint); padding-left:4px;">${cursor.getMonth()+1}월</div>`;
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }

  const CROP_RESPONDENT_SHADES = [1, 0.72, 1.3, 0.58, 1.5, 0.85];
  const cropRespondents = {};
  items.forEach(s=>{
    const crop = (s.crops&&s.crops[0]) || '';
    const resp = s.respondent_name || '익명';
    if(!cropRespondents[crop]) cropRespondents[crop] = [];
    if(!cropRespondents[crop].includes(resp)) cropRespondents[crop].push(resp);
  });
  const shadeFor = (crop, resp)=>{
    const list = cropRespondents[crop] || [];
    const i = list.indexOf(resp);
    return CROP_RESPONDENT_SHADES[i % CROP_RESPONDENT_SHADES.length];
  };

  const groups = {};
  items.forEach(s=>{
    const key = s.bed_no!=null ? `${s.bed_no}|||${s.floor||''}` : '__미지정__';
    if(!groups[key]) groups[key] = { bedNo: s.bed_no, floor: s.floor, items: [] };
    groups[key].items.push(s);
  });
  const groupList = Object.values(groups).map(g=>{
    const ranges = g.items.map(s=>({
      start: new Date(s.desired_start+'T00:00:00'),
      end: s.desired_end ? new Date(s.desired_end+'T00:00:00') : new Date(s.desired_start+'T00:00:00')
    }));
    g.hasOverlap = g.items.length>1 && surveyRangesOverlap(ranges);
    return g;
  }).sort((a,b)=>{
    if(a.hasOverlap !== b.hasOverlap) return a.hasOverlap ? -1 : 1;
    if(b.items.length !== a.items.length) return b.items.length - a.items.length;
    return (a.bedNo||0)-(b.bedNo||0) || (a.floor||'').localeCompare(b.floor||'');
  });

  const groupsHtml = groupList.map(g=>{
    const bedLabel = isAisleSpot(g.bedNo) ? '통로' : g.bedNo!=null ? `베드${g.bedNo}${g.floor?`·${escapeHtml(g.floor)}`:''}` : '베드 미지정';
    const sortedItems = [...g.items].sort((a,b)=> a.desired_start.localeCompare(b.desired_start));
    const barsHtml = sortedItems.map(s=>{
      const cropLabel = (s.crops||[]).join(', ') || '작물 미정';
      const crop0 = (s.crops&&s.crops[0])||'';
      const color = cropColor(crop0);
      const brightness = shadeFor(crop0, s.respondent_name || '익명');
      const st = new Date(s.desired_start+'T00:00:00');
      const en = s.desired_end ? new Date(s.desired_end+'T00:00:00') : st;
      const left = surveyDateToDays(st) - surveyDateToDays(rangeStart);
      const width = Math.max(1, surveyDateToDays(en) - surveyDateToDays(st));
      const leftPct = (left/totalDays*100).toFixed(2);
      const widthPct = Math.max(1.2, (width/totalDays*100)).toFixed(2);
      const tooltip = [s.generation, cropLabel, `${s.desired_start} ~ ${s.desired_end||'?'}`, s.line_no?`${lineNoLabel((s.purposes||[])[0])}: ${s.line_no}`:'', s.cross_combo?`교배조합: ${s.cross_combo}`:'', s.breeding_purpose?`${purposeFieldLabel((s.purposes||[])[0])}: ${s.breeding_purpose}`:'', s.respondent_name?`담당: ${s.respondent_name}`:''].filter(Boolean).join(' · ');
      const genLabel = s.generation ? `${s.generation} · ` : '';
      return `<div title="${escapeHtml(tooltip)}" style="position:absolute; left:${leftPct}%; width:${widthPct}%; top:0; bottom:0; background:${color}; filter:brightness(${brightness}); border-radius:999px; display:flex; align-items:center; padding:0 8px; overflow:hidden; white-space:nowrap; font-size:9px; font-weight:700; color:#fff;">${genLabel}${escapeHtml(cropLabel)} · ${escapeHtml(s.respondent_name||'익명')}</div>`;
    }).join('');
    return `
      <div style="margin-bottom:8px; ${g.hasOverlap ? 'background:#FBEBE9; border-radius:9px; padding:9px 9px 6px;' : ''}">
        <div style="font-size:11.5px; font-weight:800; color:${g.hasOverlap?'var(--danger)':'var(--ink)'}; margin-bottom:5px; display:flex; align-items:center; gap:5px;">
          ${g.hasOverlap?'⚠️ ':''}${escapeHtml(bedLabel)} <span style="font-weight:600; color:${g.hasOverlap?'var(--danger)':'var(--ink-faint)'};">· 요청 ${g.items.length}건${g.hasOverlap?' 겹침':''}</span>
        </div>
        <div style="position:relative; height:16px;">${barsHtml}</div>
      </div>
    `;
  }).join('');

  return `
    <div style="margin-top:10px; padding-top:12px; border-top:1.6px dashed var(--line-soft);">
      <div style="position:relative; height:20px; border-bottom:1.6px solid var(--line); margin-bottom:10px;">${monthTicks}</div>
      ${groupsHtml}
    </div>
  `;
}

function surveyIsHeatTest(){ return surveySelectedPurposes.has('고온검정'); }
// 기타 = 온도·일장 등 다양한 실험. 교배조합·교배목적·세대별 기간 대신 처리 요인·구간별 조건과 희망 사용기간을 받는다
function surveyIsEtc(){ return surveySelectedPurposes.has('기타'); }
// 온도·일장 조건을 받는 목적:
//  · 'pick': 기타 — 처리 요인(온도·일장)을 골라서 고른 것만, 처리 구간 카드로 받는다 (중간에 조건이 바뀔 수 있다)
//  · 'all' : 세대단축·인공교배 — 기간 내내 조건이 같아서, 구간 없이 온도·일장 칸 하나씩만 받는다
//  · ''    : 그 밖(고온검정 등)은 받지 않는다
function surveyExpMode(){
  if(surveyIsEtc()) return 'pick';
  return (surveySelectedPurposes.has('세대단축') || surveySelectedPurposes.has('인공교배')) ? 'all' : '';
}
function surveyExpFactorOn(f){ return surveyExpMode() === 'pick' && surveySelectedFactors.has(f); }
// 칸에 적힌 조건을 '온도 25℃' 꼴로 (비었거나 단위만 남아 있으면 '')
function surveyExpValue(input, f){
  const v = input.value.trim();
  return v && v !== SURVEY_EXP_FACTORS[f].unit ? `${f} ${v}` : '';
}
// 지금 고른 목적에 맞게 온도·일장 영역을 보이고 숨긴다 (영역 전체 · 단순 칸 · 요인 칩 · 처리 구간 · 구간마다의 조건 칸)
function surveyExpApply(){
  const mode = surveyExpMode();
  const show = (id, on, display = '')=>{ const el = document.getElementById(id); if(el) el.style.display = on ? display : 'none'; };
  show('surveyEtcWrap', mode, 'flex');
  show('surveyExpSimple', mode === 'all', 'flex');
  show('surveyExpFactorRow', mode === 'pick');
  show('surveyExpPhaseBox', mode === 'pick');
  show('surveyExpHint', mode === 'pick' && !surveySelectedFactors.size);
  document.querySelectorAll('#surveyExpPhases .sexp-cond').forEach(l=>{ l.style.display = surveyExpFactorOn(l.dataset.f) ? 'flex' : 'none'; });
}
// 계통번호 칸이 한 줄을 다 쓰는 목적 (옆에 교배조합 칸이 없는 고온검정·기타)
function surveyLineWide(){ return surveyIsHeatTest() || surveyIsEtc(); }
// 기타(실험) 응답에 적힌 처리 요인·조건을 한 줄로 (목록·계획 반영 화면용)
const SURVEY_EXP_LABELS = { exp_factors:'처리 요인', exp_condition:'처리 조건' };
function surveyExpText(s){
  return Object.entries(SURVEY_EXP_LABELS).filter(([k])=> s[k]).map(([k, label])=> `${label}: ${s[k]}`).join(' · ');
}
// 계통번호 칸은 사용 목적에 따라 달라진다 (값은 모두 같은 line_no 칸에 저장된다)
//  · 인공교배: 계통번호를 받지 않는다 (칸을 숨기고, 적혀 있어도 저장하지 않는다)
//  · 고온검정·기타(실험): '계통/품종'으로 받는다 (예: YPL277, 대원)
//  · 그 밖: 계통번호 (예: YPL277)
// 저장된 응답·계획에서는 기타 목적이 '기타'가 아니라 직접 적은 실험 내용으로 들어 있어서, 세 가지 목적이 아닌 글도 기타로 본다
function lineNoHidden(purpose){ return purpose === '인공교배'; }
function lineNoIsVariety(purpose){ return purpose === '고온검정' || purpose === '기타' || (!!purpose && !SURVEY_PURPOSE_OPTIONS.includes(purpose)); }
function lineNoLabel(purpose){ return lineNoIsVariety(purpose) ? '계통/품종' : '계통번호'; }
function lineNoPlaceholder(purpose){ return lineNoIsVariety(purpose) ? '예: YPL277, 대원' : '예: YPL277'; }
// 교배목적 칸은 사용 목적이 고온검정이면 '검정 목적'이다 (수요조사 breeding_purpose · 분기별 계획 purpose · 계통작성 검정 목적이 같은 값으로 이어진다)
function purposeFieldLabel(purpose){ return purpose === '고온검정' ? '검정 목적' : '교배목적'; }
// 수요조사 폼의 계통번호 칸을 지금 고른 사용 목적에 맞춘다
function surveyApplyLineNoField(){
  const wrap = document.getElementById('surveyLineWrap');
  if(!wrap) return;
  const p = [...surveySelectedPurposes][0] || '';
  wrap.style.display = lineNoHidden(p) ? 'none' : 'flex';
  wrap.style.width = surveyLineWide() ? '100%' : '50%';
  document.getElementById('surveyLineLabel').textContent = `${lineNoLabel(p)} (선택)`;
  document.getElementById('surveyLineNo').placeholder = lineNoPlaceholder(p);
}
// 세대별 희망 기간을 받지 않는 목적 (고온검정, 인공교배, 기타)
function surveyHidesGenPeriod(){ return surveySelectedPurposes.has('고온검정') || surveySelectedPurposes.has('인공교배') || surveyIsEtc(); }
// 칩 하나만 선택되게 한다: 다른 칩을 누르면 기존 선택이 바뀌고, 선택된 칩을 다시 누르면 해제된다
function surveyPickSingle(set, val, el){
  const wasSelected = set.has(val);
  set.clear();
  el.parentElement.querySelectorAll('.task-bed-chip').forEach(c=> c.classList.remove('active'));
  if(!wasSelected){ set.add(val); el.classList.add('active'); }
}
function toggleSurveyPurpose(val, el){
  surveyPickSingle(surveySelectedPurposes, val, el);
  const otherWrap = document.getElementById('surveyPurposeOtherWrap');
  if(otherWrap) otherWrap.style.display = surveySelectedPurposes.has('기타') ? '' : 'none';
  const heatPurposeWrap = document.getElementById('surveyHeatPurpose');   // 고온검정의 '검정 목적' 글쓰기 칸
  if(heatPurposeWrap) heatPurposeWrap.style.display = surveySelectedPurposes.has('고온검정') ? '' : 'none';
  const heat = surveyIsHeatTest();
  const crossWrap = document.getElementById('surveyCrossWrap');
  if(crossWrap) crossWrap.style.display = (heat || surveyIsEtc()) ? 'none' : 'flex';
  surveyExpApply();
  const genWrap = document.getElementById('surveyGenWrap');
  if(genWrap) genWrap.style.display = surveyHidesGenPeriod() ? 'none' : '';
  const useWrap = document.getElementById('surveyUsePeriodWrap');
  if(useWrap) useWrap.style.display = surveyHidesGenPeriod() ? '' : 'none';
  const heatWrap = document.getElementById('surveyHeatWrap');
  if(heatWrap) heatWrap.style.display = heat ? 'flex' : 'none';
  surveyApplyLineNoField();
}
// 기타(실험)의 처리 구간 카드 한 장: [적용 시기] + 고른 요인(온도·일장)의 조건 칸. 구간은 [+ 구간 추가]로 늘린다.
function surveyExpPhaseHtml(){
  const conds = Object.entries(SURVEY_EXP_FACTORS).map(([f, { unit, ph }])=>`
        <label class="sexp-cond" data-f="${f}" style="display:${surveyExpFactorOn(f)?'flex':'none'};">
          ${f} 조건
          <input class="sexp-val" data-f="${f}" placeholder="${ph}" onfocus="unitFocus(this,'${unit}')" oninput="unitInput(this,'${unit}')" onblur="unitBlur(this,'${unit}')" />
        </label>`).join('');
  return `
    <div class="sgen-card sexp-card">
      <div class="sgen-head"><span class="sexp-title">구간 1</span><button type="button" class="sexp-del" title="이 구간 삭제" style="display:none;" onclick="removeSurveyExpPhase(this)">✕</button></div>
      <label>적용 시기
        <input class="sexp-when" placeholder="예: 발아 후 ~14일, 개화기(R1) 이후" />
      </label>
      <div class="sexp-conds">${conds}
      </div>
    </div>`;
}
// 구간 번호를 다시 매기고, 구간이 둘 이상일 때만 삭제(✕) 버튼을 보인다
function surveyExpRenumber(){
  const cards = document.querySelectorAll('#surveyExpPhases .sexp-card');
  cards.forEach((c, i)=>{
    c.querySelector('.sexp-title').textContent = `구간 ${i+1}`;
    c.querySelector('.sexp-del').style.display = cards.length > 1 ? '' : 'none';
  });
}
function addSurveyExpPhase(){
  const list = document.getElementById('surveyExpPhases');
  if(!list) return;
  list.insertAdjacentHTML('beforeend', surveyExpPhaseHtml());
  surveyExpRenumber();
  list.lastElementChild.querySelector('.sexp-when').focus();
}
function removeSurveyExpPhase(btn){
  btn.closest('.sexp-card').remove();
  surveyExpRenumber();
}
function toggleSurveyFactor(val, el){
  if(surveySelectedFactors.has(val)){ surveySelectedFactors.delete(val); el.classList.remove('active'); }
  else{ surveySelectedFactors.add(val); el.classList.add('active'); }

  const first = surveySelectedFactors.has(val) && document.querySelector(`#surveyExpPhases .sexp-cond[data-f="${val}"] input`);
  if(first) first.focus();
}
function toggleSurveyCrop(val, el){
  surveyPickSingle(surveySelectedCrops, val, el);
  surveyApplyDefaultDays();   // 작물이 바뀌면 생육일수 기본값도 그 작물 것으로 바뀐다
}
function toggleSurveyGeneration(val, el){
  if(surveySelectedGenerations.has(val)){ surveySelectedGenerations.delete(val); el.classList.remove('active'); }
  else{ surveySelectedGenerations.add(val); el.classList.add('active'); }
  const row = document.getElementById(`surveyGenRow-${val}`);
  if(row) row.style.display = surveySelectedGenerations.has(val) ? 'block' : 'none';
  surveyGenSync();
}

// ── 세대별 희망 기간: 생육일수는 한 번만 쓰고, 세대마다 시작일만 고르면 종료일이 자동으로 채워진다 ───────────
// 생육일수 칸은 하나다 (세대 간격은 모든 세대가 같다고 본다). 세대마다 [시작일] ~ [종료일]은 달력으로 고른다.
//  · 시작일을 고르면 시작일 + 생육일수로 그 세대의 종료일이 자동으로 채워진다 (계통작성의 수확예정일과 같은 계산)
//  · 생육일수는 고른 작물의 기본 생육일수(SURVEY_DEFAULT_DAYS, 없으면 crop_profiles — 계통작성에서 쓰던 값)가 미리 들어가고, 사용자가 고칠 수 있다
//  · 생육일수를 고치면 시작일이 있는 세대의 종료일이 모두 다시 계산된다 (달력에서 종료일을 직접 고른 세대는 그대로 둔다)
//  · 다음 세대 시작일은 앞 세대 종료일 다음 날부터 고를 수 있다 (선택한 세대만 F1 → F2 → … 순서로 본다)
function surveyGenEl(kind, g){ return document.getElementById(`surveyGen${kind}-${g}`); }   // kind: Start · End · Note
function surveyDaysEl(){ return document.getElementById('surveyGenDays'); }                      // 모든 세대 공통 생육일수
// 지금 쓰여 있는 생육일수 (비었거나 숫자가 아니면 null)
function surveyGrowDays(){
  const el = surveyDaysEl();
  const n = el && el.value !== '' ? Math.floor(Number(el.value)) : NaN;
  return n >= 0 ? n : null;
}
// 선택한 작물의 기본 생육일수 (없으면 null)
function surveyDefaultDays(){
  const crop = [...surveySelectedCrops][0];
  const n = crop ? Number(SURVEY_DEFAULT_DAYS[crop] ?? cropProfiles[crop]) : NaN;
  return n > 0 ? Math.floor(n) : null;
}
// 시작일이 있는 세대의 종료일을 시작일 + 생육일수로 다시 계산한다. keepManual이면 종료일을 달력에서 직접 고른 세대는 건드리지 않는다.
function surveyRecalcEnds(keepManual){
  const n = surveyGrowDays();
  if(n === null) return;
  SURVEY_GEN_STAGES.forEach(g=>{
    const s = surveyGenEl('Start', g), e = surveyGenEl('End', g);
    if(!s || !e || !s.value || (keepManual && e.dataset.manual === '1')) return;
    e.value = addDays(s.value, n);
    e.dataset.manual = '';
  });
}
// 생육일수 칸을 작물의 기본값으로 채운다. 사용자가 직접 쓴 값은 그대로 둔다.
function surveyApplyDefaultDays(){
  const d = surveyDaysEl();
  if(!d) return;
  const def = surveyDefaultDays();
  if(d.value === '' || d.dataset.auto === '1'){
    d.value = def==null ? '' : String(def);
    d.dataset.auto = def==null ? '' : '1';
    surveyRecalcEnds(true);
  }
  const hint = document.getElementById('surveyGenDefaultHint');
  if(hint){
    const crop = [...surveySelectedCrops][0];
    hint.textContent = !crop ? '' : def!=null ? '다르면 수정해주세요.'
      : '이 작물은 기본 생육일수가 없어요. 생육일수를 직접 쓰거나 종료일을 달력에서 골라주세요.';
  }
  surveyGenSync();
}
// 사용자가 생육일수를 직접 고쳤을 때
function surveyDaysChanged(){
  const d = surveyDaysEl();
  if(d) d.dataset.auto = '';   // 직접 쓴 값은 작물이 바뀌어도 덮어쓰지 않는다
  surveyRecalcEnds(true);
  surveyGenSync();
}
// 세대의 시작일 또는 종료일(field: 'start' | 'end')을 달력에서 고쳤을 때
function surveyGenFlow(g, field){
  const s = surveyGenEl('Start', g), e = surveyGenEl('End', g);
  if(!s || !e) return;
  const notes = [];
  if(field==='start'){
    e.dataset.manual = '';
    const n = surveyGrowDays();
    if(s.value && n !== null) e.value = addDays(s.value, n);
  } else {
    e.dataset.manual = e.value ? '1' : '';   // 직접 고른 종료일: 생육일수를 바꿔도 그대로 둔다
    if(s.value && e.value && daysBetween(s.value, e.value) < 0){
      e.value = ''; e.dataset.manual = '';
      notes.push(`${g} 종료일이 시작일보다 빠를 수 없어서 비웠어요`);
    }
  }
  surveyGenSync(notes);
}
// 달력의 선택 범위를 맞춘다: 앞 세대 종료일 다음 날부터 (종료일이 없으면 시작일 기준). 범위를 벗어난 값은 비우고 알려 준다.
// 종료일이 접수 기간의 마지막 날을 넘으면(시작일 + 생육일수가 넘는 경우 포함) 마지막 날로 맞춘다. (예: 접수 기간이 6/30까지인데 7/10이 되면 6/30)
function surveyGenSync(notes = []){
  const planStart = (planPeriod && planPeriod.period_start) || '', planEnd = (planPeriod && planPeriod.period_end) || '';
  const setMin = (el, v)=>{ if(v) el.min = v; else el.removeAttribute('min'); };
  let prevEnd = '';
  const cleared = [], clamped = [];
  SURVEY_GEN_STAGES.filter(g=> surveySelectedGenerations.has(g)).forEach(g=>{
    const s = surveyGenEl('Start', g), e = surveyGenEl('End', g), note = surveyGenEl('Note', g);
    if(!s || !e) return;
    const afterPrev = prevEnd ? addDays(prevEnd, 1) : '';
    const minStart = afterPrev > planStart ? afterPrev : planStart;   // 날짜 문자열(YYYY-MM-DD)은 그대로 크기 비교가 된다
    setMin(s, minStart);
    if(s.value && s.value < minStart){ s.value = ''; e.value = ''; cleared.push(g); }
    else if(e.value && e.value < minStart){ e.value = ''; cleared.push(g); }
    // 시작일이 접수 기간 안일 때만 맞춘다 (시작일부터 벗어났으면 아래 안내가 뜨고, 종료일이 시작일보다 앞서 버리지 않게)
    if(planEnd && e.value > planEnd && (!s.value || s.value <= planEnd)){ e.value = planEnd; clamped.push(g); }
    setMin(e, s.value > minStart ? s.value : minStart);
    if(note){
      const out = planStart && planEnd && ((s.value && s.value < planStart) || ((e.value || s.value) > planEnd));
      note.textContent = out ? `접수 기간(${planStart} ~ ${planEnd})을 벗어났어요. 시작일이나 생육일수를 조정해주세요.` : '';
    }
    const myEnd = e.value || s.value;
    if(myEnd) prevEnd = myEnd;
  });
  if(cleared.length) notes.push(`${cleared.join(', ')} 기간이 앞 세대 종료일 이전이라 비웠어요`);
  if(clamped.length) notes.push(`${clamped.join(', ')} 종료일이 접수 기간 마지막 날(${planEnd})로 맞춰졌어요`);
  if(notes.length) showToast(notes.join(' · '));
}

// ── 고온검정 '처리 온도' 입력: ℃를 자동으로 붙인다 ───────────────────────────
// 칸을 누르면 '℃'가 미리 들어가 있고(커서는 ℃ 앞), 숫자만 치면 '45℃'가 된다. 아무것도 안 쓰고 나가면 다시 비워진다.
// (예전에 저장된 값이나 '40~45' 같은 범위도 그대로 두고, 저장할 때 숫자만 있으면 ℃를 붙인다)
// 단위는 ℃ 말고도 쓸 수 있다 (기타 실험의 일장은 '시간'). 단위별 동작은 같고 단위 글자만 다르다.
function unitFocus(el, unit){
  if(el.value) return;
  el.value = unit;
  setTimeout(()=>{ if(document.activeElement===el && el.value===unit) el.setSelectionRange(0, 0); }, 0);   // 클릭으로 들어올 때 브라우저가 커서를 옮기므로 한 박자 뒤에 맞춘다
}
// 입력할 때마다 단위가 한 번만, 맨 뒤에 오도록 정리한다. 돌려주는 값은 실제 입력 내용(단위만 있으면 '')
function unitInput(el, unit){
  const pos = el.selectionStart ?? 0;
  const body = el.value.split(unit).join('');
  el.value = body + unit;
  el.setSelectionRange(Math.min(pos, body.length), Math.min(pos, body.length));
  return body ? el.value : '';
}
function unitBlur(el, unit){ if(el.value===unit) el.value = ''; }
function tempFocus(el){ unitFocus(el, '℃'); }
function tempInput(el){ return unitInput(el, '℃'); }
function tempBlur(el){ unitBlur(el, '℃'); }
// 저장하기 전에: 비었거나 '℃'뿐이면 빈 값, 숫자(범위)만 적었으면 ℃를 붙인다
function normalizeTemp(v){
  const t = String(v || '').trim();
  if(!t || t==='℃') return '';
  return /^[\d.\s~\-–,]+$/.test(t) ? t + '℃' : t;
}
const TEMP_INPUT_ATTRS = `onfocus="tempFocus(this)" oninput="tempInput(this)" onblur="tempBlur(this)"`;

function renderSurveyView(){

  ` : !surveySelectedBeds.size ? `
    <div class="empty-materials" style="padding:60px 20px;">가운데에서 베드와 층을 선택해주세요 (여러 개 선택 가능)</div>
  ` : `
    <div style="display:flex; flex-direction:column; gap:16px;">
      <input id="surveyName" placeholder="담당자(이름) *" style="width:50%; box-sizing:border-box; ${dateFieldStyle}" />

      <div>
        <div style="font-size:11px; font-weight:700; color:var(--ink-faint); margin-bottom:6px;">사용 목적 <span style="color:var(--danger);">*</span></div>
        <div class="task-bed-chips">
          ${SURVEY_PURPOSE_OPTIONS.map(p=>`<button type="button" class="task-bed-chip ${surveySelectedPurposes.has(p)?'active':''}" onclick="toggleSurveyPurpose('${p}', this)">${p}</button>`).join('')}
        </div>
        <input id="surveyPurposeOtherWrap" placeholder="실험 내용을 적어주세요 (예: 일장 반응 실험)" style="display:${surveySelectedPurposes.has('기타')?'':'none'}; margin-top:8px; width:100%; box-sizing:border-box; ${dateFieldStyle}" />
        <input id="surveyHeatPurpose" placeholder="검정 목적을 적어주세요 (예: 고온검정 조건 확립)" style="display:${surveySelectedPurposes.has('고온검정')?'':'none'}; margin-top:8px; width:100%; box-sizing:border-box; ${dateFieldStyle}" />
      </div>

      <div>
        <div style="font-size:11px; font-weight:700; color:var(--ink-faint); margin-bottom:6px;">작물 <span style="color:var(--danger);">*</span></div>
        <div class="task-bed-chips">

  let resultsHtml = '';
  if(isAdmin){
    const st = computeDemandState();   // 응답이 계획에 들어갔는지 (분기별 계획과 같은 기준)

    const fullRoomCounts = {};

    demandSurveys.forEach(s=>{ if(s.room_name) fullRoomCounts[s.room_name] = (fullRoomCounts[s.room_name]||0)+1; });
    const roomEntries = Object.entries(fullRoomCounts).sort((a,b)=> b[1]-a[1]);
    const maxRoomCount = Math.max(1, ...roomEntries.map(e=>e[1]));
    const demandSummaryHtml = roomEntries.map(([name, count], idx)=>{

      </div>
      <div class="panel-box" style="margin-top:20px;">
        <div class="panel-box-head">
          <div>
            <h3>응답 결과 (관리자 전용)</h3>
            <p>총 ${demandSurveys.length}건의 응답이 접수됐어요.</p>
          </div>
          <button class="btn small danger-text" onclick="deleteAllSurveys()">전체 삭제</button>
        </div>
        <div style="display:flex; gap:24px; flex-wrap:wrap; margin-bottom:18px;">
          <div><div style="font-size:11px; color:var(--ink-faint); font-weight:700; margin-bottom:6px;">목적별</div>${countRow(purposeCounts) || '<span class="empty-chip">데이터 없음</span>'}</div>
          <div><div style="font-size:11px; color:var(--ink-faint); font-weight:700; margin-bottom:6px;">작물별</div>${countRow(cropCounts) || '<span class="empty-chip">데이터 없음</span>'}</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${demandSurveys.length ? demandSurveys.map(s=>`
            <div class="task-row-wrap">
              <div class="task-row" style="flex:1; cursor:default; align-items:flex-start;">
                <div class="task-row-body">
                  <span class="task-row-loc">${s.room_name?`<b style="color:var(--teal-deep);">${escapeHtml(ROOM_DISPLAY_LABELS[s.room_name]||s.room_name)}${isAisleSpot(s.bed_no) ? ' · 통로' : `${s.bed_no?` 베드${s.bed_no}`:''}${s.floor?` · ${escapeHtml(s.floor)}`:''}`}</b> · `:''}${escapeHtml(s.respondent_name||'(이름 없음)')}</span>
                  <span class="task-row-note">${(s.purposes||[]).map(x=>escapeHtml(x)).join(', ')||'-'} · ${(s.crops||[]).map(x=>escapeHtml(x)).join(', ')||'-'} · ${s.expected_scale!=null?`${s.expected_scale}${escapeHtml(s.scale_unit||'')}`:'-'}</span>

              <button class="task-cancel-btn" onclick="deleteSurvey('${s.id}')" title="삭제">✕</button>

  wrap.innerHTML = `<div class="survey-user-area">${topHtml}</div>` + resultsHtml;

async function submitDemandSurvey(){
  if(tourBlockWrite()) return;   // 사용법 체험 중에는 실제로 제출하지 않는다
  if(!surveySelectedRoomName){ alert('방을 먼저 선택해주세요.'); return; }
  if(!surveySelectedBeds.size){ alert('베드와 층을 먼저 선택해주세요.'); return; }
  // 필수 항목: 담당자 · 사용 목적 · 작물 · 교배조합 · 교배목적(세대단축 · 인공교배) · 희망 기간(선택한 세대마다, 또는 희망 사용기간) · 베드별 예상 개체수. 하나라도 비어 있으면 제출하지 않는다.
  const nameEl = document.getElementById('surveyName');
  const name = nameEl.value.trim() || null;
  if(!name){ alert('담당자(이름)를 입력해주세요.'); nameEl.focus(); return; }

  const purposes = [...surveySelectedPurposes].filter(p=>p!=='기타');
  const purposeOtherEl = document.getElementById('surveyPurposeOtherWrap');
  if(surveySelectedPurposes.has('기타') && purposeOtherEl.value.trim()) purposes.push(purposeOtherEl.value.trim());
  if(!surveySelectedPurposes.size){ alert('사용 목적을 선택해주세요.'); return; }
  if(!purposes.length){ alert('실험 내용을 적어주세요.'); purposeOtherEl.focus(); return; }

  const crops = [...surveySelectedCrops];
  if(!crops.length){ alert('작물을 선택해주세요.'); return; }

  // 고온검정·기타는 교배조합·교배목적·세대별 희망기간 입력칸이 숨겨지므로, 이전에 입력된 값이 남아 있어도 제출하지 않는다
  // 고온검정은 대신 '검정 목적' 칸을 받아서 같은 breeding_purpose 칸에 담는다 (분기별 계획 → 계통작성의 검정 목적으로 이어진다)
  const isHeatTest = surveyIsHeatTest();
  const isEtc = surveyIsEtc();
  const hideCross = isHeatTest || isEtc;
  const breedingPurpose = isHeatTest ? (document.getElementById('surveyHeatPurpose').value.trim() || null)
    : hideCross ? null : (document.getElementById('surveyBreedingPurpose').value.trim() || null);
  const crossCombo = hideCross ? null : (document.getElementById('surveyCrossCombo').value.trim() || null);
  // 교배조합 · 교배목적 칸이 보이는 목적(세대단축 · 인공교배)에서는 둘 다 꼭 적어야 한다
  if(!hideCross && !crossCombo){ alert('교배조합을 입력해주세요.'); document.getElementById('surveyCrossCombo').focus(); return; }
  if(!hideCross && !breedingPurpose){ alert('교배목적을 입력해주세요.'); document.getElementById('surveyBreedingPurpose').focus(); return; }
  // 계통번호(고온검정은 계통/품종)는 적었을 때만 line_no로 보내서, DB에 컬럼이 아직 없어도 없는 제출은 영향받지 않게 한다.
  // 인공교배는 이 칸을 숨기므로, 이전에 적어 둔 값이 남아 있어도 보내지 않는다.
  const lineNo = lineNoHidden([...surveySelectedPurposes][0]) ? null : (document.getElementById('surveyLineNo').value.trim() || null);

  // 고온검정일 때만 처리 온도·단계를 보낸다 (DB 컬럼이 없어도 다른 목적의 제출은 영향받지 않도록)
  const heatFields = isHeatTest ? {
    heat_temp: normalizeTemp(document.getElementById('surveyHeatTemp').value) || null,
    heat_stage: document.getElementById('surveyHeatStage').value.trim() || null
  } : {};

  // 온도·일장 조건을 받는 목적일 때만 처리 조건을 보낸다. 적은 것만 보내서, DB 컬럼이 아직 없어도 이 칸을 안 쓴 제출은 영향받지 않게 한다.
  //  · 세대단축·인공교배: 기간 내내 조건이 같아서 온도·일장 칸 하나씩만 받는다 (예: '온도 25℃, 일장 10시간')
  //  · 기타: 고른 처리 요인과, 구간을 화살표로 이어 한 줄로 (예: '발아 후 ~14일: 온도 25℃, 일장 10시간 → 개화기 이후: 온도 30℃, 일장 8시간')
  // 받지 않는 요인의 칸에 남은 글이나 단위만 남은 칸은 보내지 않고, 아무것도 안 적은 구간은 건너뛴다.
  const expFields = {};
  const expMode = surveyExpMode();
  if(expMode === 'all'){
    const condition = [...document.querySelectorAll('#surveyExpSimple .sexp-simple-val')].map(inp=> surveyExpValue(inp, inp.dataset.f)).filter(Boolean).join(', ');
    if(condition) expFields.exp_condition = condition;
  } else if(expMode === 'pick'){
    const picked = Object.keys(SURVEY_EXP_FACTORS).filter(surveyExpFactorOn);
    const phases = [...document.querySelectorAll('#surveyExpPhases .sexp-card')].map((card, i)=>({
      i, card,
      when: card.querySelector('.sexp-when').value.trim(),
      conds: picked.map(f=> surveyExpValue(card.querySelector(`.sexp-val[data-f="${f}"]`), f)).filter(Boolean).join(', ')
    })).filter(p=> p.when || p.conds);
    // 구간이 둘 이상이면 언제 바뀌는지 알 수 있어야 해서, 구간마다 적용 시기를 받는다
    const noWhen = phases.length > 1 && phases.find(p=> !p.when);
    if(noWhen){ alert(`구간 ${noWhen.i + 1}의 적용 시기를 적어주세요.\n(예: 발아 후 ~14일, 개화기 이후)`); noWhen.card.querySelector('.sexp-when').focus(); return; }
    const condition = phases.map(p=> p.when && p.conds ? `${p.when}: ${p.conds}` : (p.when || p.conds)).join(' → ');
    if(picked.length) expFields.exp_factors = picked.join(', ');
    if(condition) expFields.exp_condition = condition;
  } else if(isHeatTest){
    // 고온검정은 온도를 '처리 온도' 칸(heat_temp)으로 받으므로, 일장만 같은 처리 조건 칸(exp_condition)에 담는다 (예: '일장 10시간')
    const daylen = surveyExpValue(document.getElementById('surveyHeatDaylen'), '일장');
    if(daylen) expFields.exp_condition = daylen;
  }

  // 인공교배·고온검정·기타는 세대별 희망 기간 대신 '희망 사용기간' 하나만 받는다 (세대 없이 desired_start/desired_end에 저장 → 분기별 계획 연계에 그대로 쓰인다).
  // 반대로 세대별 칸이 보이는 목적은 숨겨진 사용기간 값이 남아 있어도 제출하지 않는다.
  // 기간은 시작일과 종료일이 모두 있어야 한다. 세대를 고른 만큼(F1·F2·F3…) 그 세대의 기간이 다 채워져야 하고, 세대를 하나도 안 골랐어도 제출되지 않는다.
  let genEntries;
  if(surveyHidesGenPeriod()){
    const startEl = document.getElementById('surveyUseStart'), endEl = document.getElementById('surveyUseEnd');
    const s = startEl.value || null, e = endEl.value || null;
    if(!s || !e){ alert('희망 사용기간의 시작일과 종료일을 모두 입력해주세요.'); (s ? endEl : startEl).focus(); return; }
    genEntries = [{ generation: null, desired_start: s, desired_end: e }];
  } else {
    const picked = SURVEY_GEN_STAGES.filter(g=>surveySelectedGenerations.has(g));
    if(!picked.length){ alert('세대(F1~F6)를 선택하고 세대별 희망 기간을 입력해주세요.'); return; }
    genEntries = picked.map(g=>({
      generation: g,
      desired_start: document.getElementById(`surveyGenStart-${g}`).value || null,
      desired_end: document.getElementById(`surveyGenEnd-${g}`).value || null
    }));
    const incomplete = genEntries.filter(g=> !g.desired_start || !g.desired_end);
    if(incomplete.length){
      const first = incomplete[0];
      alert(`${incomplete.map(g=>g.generation).join(', ')}의 시작일과 종료일을 입력해주세요.\n(시작일을 고르면 생육일수만큼 종료일이 자동으로 채워져요)`);
      document.getElementById(first.desired_start ? `surveyGenEnd-${first.generation}` : `surveyGenStart-${first.generation}`).focus();
      return;
    }
  }

  let prevGen = null, prevEnd = null;
  for(const g of genEntries){
    const label = g.generation ? `${g.generation} 희망 기간` : '희망 사용기간';
    if(g.desired_start && g.desired_end && g.desired_end < g.desired_start){
      alert(`${label}의 종료일이 시작일보다 빠를 수 없어요.`);
      return;
    }
    // 세대별 기간은 앞 세대 종료일 다음 날부터 (달력에서 막아도 직접 입력한 날짜는 여기서 걸러낸다)
    if(g.generation){
      const first = g.desired_start || g.desired_end;
      if(prevEnd && first && first <= prevEnd){
        alert(`${label}은 ${prevGen} 종료일(${prevEnd}) 다음 날부터 선택할 수 있어요.`);
        return;
      }
      const last = g.desired_end || g.desired_start;
      if(last){ prevGen = g.generation; prevEnd = last; }
    }
    if(planPeriod && planPeriod.period_start && planPeriod.period_end){
      const s = g.desired_start || planPeriod.period_start;
      const e = g.desired_end || g.desired_start;
      if(s < planPeriod.period_start || e > planPeriod.period_end){
        alert(`${label}은 ${planPeriod.period_start} ~ ${planPeriod.period_end} 사이여야 해요.`);
        return;
      }
    }
  }

  // 고른 베드마다 예상 개체수가 있어야 한다 (0 이하는 안 된다)
  for(const key of [...surveySelectedBeds].sort((a, b)=> parseInt(a) - parseInt(b) || a.localeCompare(b))){
    const [bedNo, floor] = key.split('|');
    const scaleEl = document.getElementById(`surveyScale-${bedNo}-${floor}`);
    if(!scaleEl || scaleEl.value === '' || !(Number(scaleEl.value) > 0)){
      alert(`${spotText(bedNo, floor, true)}의 예상 개체수를 입력해주세요.`);
      if(scaleEl) scaleEl.focus();
      return;
    }
  }

  const scale_unit = '개체수';
  const notes = document.getElementById('surveyNotes').value.trim() || null;

  let rows = [...surveySelectedBeds].flatMap(key=>{
    const [bedNo, floor] = key.split('|');
    const scaleEl = document.getElementById(`surveyScale-${bedNo}-${floor}`);
    const scaleVal = scaleEl ? scaleEl.value : '';
    const expected_scale = scaleVal === '' ? null : Number(scaleVal);
    return genEntries.map(g=>({
      room_name: surveySelectedRoomName, bed_no: parseInt(bedNo), floor,
      respondent_name: name, purposes, crops, cross_combo: crossCombo, breeding_purpose: breedingPurpose,
      generation: g.generation, desired_start: g.desired_start, desired_end: g.desired_end,
      expected_scale, scale_unit, notes, ...heatFields, ...expFields, ...(lineNo ? { line_no: lineNo } : {})
    }));
  });

  const bedCount = surveySelectedBeds.size;
  let { error } = await sb.from('demand_survey').insert(rows);
  let lineNoDropped = false, expFolded = false;
  // 새 컬럼이 DB에 아직 없을 수 있어서, 없는 컬럼 하나씩 빼고 다시 보내 응답 자체는 잃지 않게 한다 (컬럼마다 최대 한 번)
  for(let i = 0; i < 2 && error; i++){
    if(Object.keys(expFields).length && !expFolded && /exp_(factors|condition)/.test(error.message||'')){
      // 처리 요인·조건 컬럼이 없으면, 내용을 요청사항 앞에 합쳐서 보낸다
      const expText = surveyExpText(expFields);
      rows = rows.map(r=>{ const c = { ...r }; delete c.exp_factors; delete c.exp_condition; c.notes = [expText, r.notes].filter(Boolean).join('\n'); return c; });
      expFolded = true;
    } else if(lineNo && !lineNoDropped && (error.code==='PGRST204' || /line_no/.test(error.message||''))){
      // demand_survey에 line_no 컬럼이 아직 없으면, 계통번호만 빼고 다시 보낸다
      rows = rows.map(r=>{ const c = { ...r }; delete c.line_no; return c; });
      lineNoDropped = true;
    } else break;
    ({ error } = await sb.from('demand_survey').insert(rows));
  }
  if(error){
    const missingHeatCol = isHeatTest && /heat_(temp|stage)/.test(error.message||'');
    alert('제출 실패!\n\n' + (error.message||JSON.stringify(error)) + (missingHeatCol ? '\n\n(관리자 확인 필요: demand_survey 테이블에 heat_temp, heat_stage 컬럼을 추가해야 해요)' : ''));
    return;
  }
  if(lineNoDropped) alert('응답은 제출됐지만, 계통번호는 demand_survey 테이블에 해당 컬럼이 없어 저장되지 않았어요.\n\n(관리자 확인 필요) Supabase SQL Editor에서 아래를 한 번 실행해주세요:\n\n' + LINE_NO_SQL);
  if(expFolded) alert('응답은 제출됐지만, 처리 요인·조건은 demand_survey 테이블에 해당 컬럼이 없어 요청사항에 합쳐서 저장됐어요.\n\n(관리자 확인 필요) Supabase SQL Editor에서 아래를 한 번 실행해주세요:\n\n' + EXP_SQL);
  surveySelectedPurposes = new Set();
  surveySelectedCrops = new Set();
  surveySelectedGenerations = new Set();
  surveySelectedFactors = new Set();
  surveySelectedRoomName = null;
  surveySelectedBeds = new Set();
  showToast(`응답이 제출됐어요${bedCount>1?` (베드 ${bedCount}곳)`:''}. 감사합니다!`);
  await loadAll();
}

async function deleteSurvey(id){
  if(!confirm('이 응답을 삭제할까요?')) return;
  const { error } = await sb.from('demand_survey').delete().eq('id', id);
  if(error){ alert('삭제 실패!\n\n'+error.message); return; }
  await loadAll();
}

async function deleteAllSurveys(){
  if(!isAdmin){ alert('전체 관리자만 할 수 있어요.'); return; }
  if(!confirm('정말로 모든 수요조사 응답을 삭제할까요? (되돌릴 수 없어요)')) return;

  planEntries = existingGroup ? planRowsToEntries(existingGroup.items) : [newPlanEntry()];

  const periodHintHtml = (planPeriod && planPeriod.period_start && planPeriod.period_end)
    ? `<div style="font-size:11px; color:var(--amber); font-weight:700;">※ ${planPeriod.period_start} ~ ${planPeriod.period_end} 사이 날짜만 등록돼요</div>`
    : '';
  document.getElementById('planModalBody').innerHTML = `

    <div id="planEntryRows"></div>
    <button type="button" class="add-batch-btn" onclick="addPlanEntry()">+ 항목 추가</button>

  renderPlanEntries();

function closePlanModal(){
  document.getElementById('planModalOverlay').classList.remove('open');
