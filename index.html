<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스피드브리딩 시설 통합 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://webfontworld.github.io/gmarket/GmarketSans.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #F0F4F1;
    --panel: #FFFFFF;
    --ink: #14201A;
    --ink-soft: #6B7A72;
    --ink-faint: #97A39C;
    --line: #E1E7E2;
    --line-soft: #EBEFEC;
    --teal: #1E8A73;
    --teal-deep: #0F5B4B;
    --teal-soft: #E6F3EF;
    --amber: #C97A2B;
    --danger: #B5453B;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-sm: 0 2px 6px rgba(20,32,26,0.06), 0 1px 2px rgba(20,32,26,0.04);
    --shadow-md: 0 10px 28px rgba(15,60,48,0.10), 0 2px 6px rgba(15,60,48,0.06);
    --shadow-lg: 0 24px 56px rgba(15,60,48,0.16), 0 6px 16px rgba(15,60,48,0.08);
    --shadow-float: 0 14px 32px -8px rgba(20,32,26,0.16), 0 4px 10px -2px rgba(20,32,26,0.08);
    font-family: 'GmarketSansMedium', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; zoom:1.10; }

  header{
    background:#fff; border-bottom:1.8px solid var(--line); padding:0 36px;
    position:sticky; top:0; z-index:10; height:66px; display:flex; align-items:center;
  }
  .header-v2{ display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; }
  .hv2-left{ display:flex; align-items:center; gap:11px; min-width:0; }
  .hv2-icon{
    width:38px; height:38px; border-radius:11px; background:var(--teal-soft); color:var(--teal-deep);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  }
  .hv2-left h1{
    margin:0; font-size:15px; font-weight:800; letter-spacing:-0.01em; color:var(--ink);
    display:flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .hv2-left p{ margin:1px 0 0; font-size:11px; color:var(--ink-faint); white-space:nowrap; }
  .hv2-live-badge{
    font-size:10px; font-weight:800; background:var(--teal-soft); color:var(--teal-deep);
    padding:2px 9px; border-radius:999px; border:1px solid rgba(30,138,115,0.15); white-space:nowrap;
  }
  .hv2-right{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .hv2-stats{
    display:none; align-items:center; gap:10px; font-size:11.5px; font-weight:600; color:var(--ink-soft);
    background:#F5F8F6; border:1.4px solid var(--line-soft); padding:7px 13px; border-radius:9px; white-space:nowrap;
  }
  .hv2-stats b{ color:var(--ink); font-weight:800; }
  .hv2-stats b.accent{ color:var(--teal-deep); }
  .hv2-divider{ width:1px; height:12px; background:var(--line); }
  .hv2-reset, .hv2-admin{
    font-size:11.5px; font-weight:700; color:var(--ink-soft); background:#fff; border:1.8px solid var(--line);
    border-radius:9px; padding:7px 12px; cursor:pointer; white-space:nowrap;
  }
  .hv2-reset:hover, .hv2-admin:hover{ border-color:var(--teal); color:var(--teal-deep); }
  .hv2-reset.active{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .hv2-reset.active:hover{ color:#fff; }
  @media (min-width: 1100px){ .hv2-stats{ display:flex; } }

  main{ padding:22px 0 80px; max-width:none; margin:0; }

  .status-pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; }
  .status-pill.overdue{ background:#FBEBE9; color:var(--danger); }
  .status-pill.soon{ background:#FBEEDD; color:var(--amber); }
  .status-pill.ok{ background:var(--teal-soft); color:var(--teal-deep); }
  .status-pill.none{ background:var(--line-soft); color:var(--ink-faint); }

  @media (max-width: 1080px){
  }

  .page-shell{ display:flex; align-items:flex-start; padding:0 36px 0 36px; gap:20px; }
  .space-two-col{ display:flex; gap:24px; align-items:flex-start; }
  .space-facility-col{ flex:5; min-width:0; position:sticky; top:82px; }
  .space-detail-col{ flex:7; min-width:0; }
  @media (max-width: 1100px){
    .space-two-col{ flex-direction:column; }
    .space-facility-col{ width:100%; position:static; }
  }
  .top-bar-wrap{ padding:12px 36px 0; }
  .room-sidebar{
    width:206px; flex-shrink:0; background:linear-gradient(180deg, #16241C 0%, #0F5B4B 140%);
    border-right:none; padding:18px 14px 20px 14px; align-self:stretch;
    border-radius:20px; margin:22px 0 20px 0;
  }
  .sidebar-nav{ display:flex; flex-direction:column; gap:5px; margin-bottom:18px; }
  .sidebar-group-title{
    font-size:10.5px; font-weight:900; color:rgba(255,255,255,0.4); letter-spacing:0.08em;
    text-transform:uppercase; padding:0 13px; margin-bottom:7px;
  }
  .sidebar-item{
    display:flex; align-items:center; gap:10px; padding:12px 13px; border-radius:11px; font-size:14px;
    font-weight:700; color:rgba(255,255,255,0.62); cursor:pointer; transition:all 0.14s ease;
    border:1.8px solid transparent; border-left:4px solid transparent;
  }
  .sidebar-item:hover{ background:rgba(255,255,255,0.08); color:#fff; }
  .sidebar-item.active{
    background:#fff; color:var(--teal-deep); box-shadow:0 4px 14px rgba(0,0,0,0.25);
    border-left:4px solid var(--amber); font-weight:900; font-size:14.5px;
  }
  main{ flex:1; min-width:0; }
  @media (max-width: 900px){
    .page-shell{ flex-direction:column; }
    .room-sidebar{
      width:100%; height:auto; position:static; border-right:none; border-bottom:1.8px solid var(--line);
      padding:14px 12px; display:flex; overflow-x:auto; gap:10px;
    }
    .sidebar-nav{ flex-direction:row; flex-wrap:nowrap; flex-shrink:0; }
    .sidebar-item{ white-space:nowrap; }
  }

  .work-list-box{
    background:var(--panel); border:1.8px solid var(--line); border-radius:var(--radius-lg);
    overflow:hidden; box-shadow:var(--shadow-sm);
  }
  .room-divider{
    display:flex; justify-content:space-between; align-items:center; padding:10px 16px;
    background:#FAFBFA; border-top:1.8px solid var(--line-soft);
  }
  .room-divider:first-of-type{ border-top:none; }
  .wg-name{ font-size:13px; font-weight:900; color:var(--teal-deep); display:flex; align-items:center; gap:6px; }
  .wg-alert{ font-size:12px; }
  .wg-count{ font-size:11px; font-weight:700; color:var(--ink-faint); background:#fff; padding:3px 9px; border-radius:999px; }
  .wg-col-grid{ display:grid; grid-template-columns: 1.6fr 1fr 1fr 100px 130px; gap:10px; align-items:center; }
  .wg-header-row{
    padding:10px 16px; font-size:12.5px; font-weight:900; color:var(--ink); text-transform:none;
    letter-spacing:0; background:#F0F3F1; border-bottom:1.8px solid var(--line);
  }
  .wg-row{
    padding:7px 16px; cursor:pointer; border-bottom:1px solid #E2E8F0; transition:background 0.12s ease;
  }
  .wg-row:last-child{ border-bottom:none; }
  .wg-row:hover{ background:var(--teal-soft); }
  .wg-row-crop{ min-width:0; font-size:12.5px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wg-row-loc{ min-width:0; font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wg-row-date{ min-width:0; font-size:12px; color:#4A5568; font-weight:700; white-space:nowrap; }

  .work-filter-bar select{
    padding:9px 12px; border:1.8px solid var(--line); border-radius:9px; font-size:12.5px; font-family:inherit;
    background:#fff; color:var(--ink);
  }
  .work-filter-bar select:focus{ outline:none; border-color:var(--teal); }
  .work-filter-bar select.filter-active{ background:var(--teal-soft); border-color:var(--teal); color:var(--teal-deep); font-weight:800; }
  .section-head{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; margin-bottom:12px; }
  .section-head h2{ display:flex; align-items:center; gap:8px; font-size:16.5px; font-weight:800; margin:0 0 4px; letter-spacing:-0.01em; }
  .section-head p{ margin:0; font-size:12.5px; color:var(--ink-soft); }

  .facility{
    background:var(--panel); border:2px solid var(--line); border-radius:var(--radius-lg);
    padding:22px; margin-bottom:38px; box-shadow:var(--shadow-sm);
  }
  .facility-vertical{ display:flex; gap:14px; align-items:stretch; }
  .facility-col{ display:flex; flex-direction:column; gap:12px; flex:1; min-width:0; }
  .corridor-bar-vertical{
    width:38px; flex-shrink:0; background:#FAFBFA; border:1px solid var(--line);
    border-radius:10px; display:flex; align-items:center; justify-content:center;
    writing-mode:vertical-rl; font-weight:800; letter-spacing:0.3em; color:var(--ink-faint); font-size:12px;
  }
  .facility-col .room-card{ flex:none; width:100%; }
  .room-card{
    flex:1; background:var(--panel); border:1.4px solid var(--line-soft); border-radius:16px;
    padding:17px; cursor:pointer; transition: box-shadow 0.18s ease, transform 0.16s ease, border-color 0.16s ease;
    display:flex; flex-direction:column; min-height:112px; box-shadow:var(--shadow-float);
  }
  .room-card:hover{ border-color:var(--teal); box-shadow:0 20px 40px -8px rgba(15,60,48,0.20), 0 6px 14px -2px rgba(15,60,48,0.10); transform:translateY(-3px); }
  .room-card.active{ border-color:var(--teal); background:var(--teal-soft); box-shadow:0 0 0 3px rgba(30,138,115,0.14), var(--shadow-float); }
  .room-card.empty-room{ background:#FAFBFA; }
  .room-card.muted-room{ opacity:0.6; filter:saturate(0.5); }
  .room-card.muted-room:hover{ opacity:0.85; }
  .room-card.placeholder{
    background:transparent; border-style:dashed; border-color:#C9D4CC; align-items:center; justify-content:center;
    text-align:center; color:var(--ink-faint); box-shadow:none;
  }
  .room-card.placeholder:hover{ border-color:var(--teal); color:var(--teal); box-shadow:none; transform:none; }
  .room-card.info-card{ background:#FAFBFA; cursor:default; align-items:center; justify-content:center; text-align:center; color:var(--ink-faint); box-shadow:none; }
  .room-card.info-card:hover{ transform:none; box-shadow:none; border-color:var(--line); }

  .top-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:11px; }
  .room-icon{ width:30px; height:30px; border-radius:9px; background:var(--teal-soft); color:var(--teal-deep); display:flex; align-items:center; justify-content:center; font-size:14px; }
  .room-env-meta{
    display:flex; align-items:center; gap:7px; font-size:11px; font-weight:600; color:var(--ink-faint);
    margin-top:5px;
  }
  .room-env-meta span{ display:inline-flex; align-items:center; gap:4px; }
  .room-env-meta svg{ color:inherit; flex-shrink:0; }
  .room-env-sep{ width:3px; height:3px; border-radius:50%; background:var(--line); flex-shrink:0; }
  .room-env-badge{
    display:flex; flex-direction:row; gap:10px; font-size:10.5px; font-weight:700; color:var(--ink-soft);
    background:#F5F6F4; border:1px solid var(--line-soft); border-radius:9px; padding:6px 10px; white-space:nowrap;
  }
  .room-env-badge span{ display:inline-flex; align-items:center; gap:4px; }
  .room-env-badge svg{ color:var(--ink-faint); flex-shrink:0; }
  .item-count-tag{ font-size:10px; font-weight:700; color:var(--ink-soft); background:var(--line-soft); padding:3px 8px; border-radius:999px; }
  .rname{ font-size:15.5px; font-weight:900; margin-bottom:7px; letter-spacing:-0.01em; }
  .room-summary{ font-size:13px; color:var(--teal-deep); line-height:1.35; font-weight:700; margin-top:10px; }
  .room-summary > div{ margin-bottom:2px; }
  .room-summary .more{ color:var(--ink-faint); font-weight:500; }
  .placeholder-label{ font-size:12.5px; font-weight:700; margin-bottom:4px; }
  .placeholder-hint{ font-size:10.5px; }

  .corridor-bar{
    background:#FAFBFA; border:2px solid var(--line); border-radius:var(--radius-sm);
    padding:13px; text-align:center; font-weight:800; letter-spacing:0.35em; color:var(--ink-faint); font-size:12px;
    margin-bottom:12px;
  }

  .extra-head{ font-size:11.5px; font-weight:800; color:var(--ink-soft); margin:24px 0 10px; padding-top:16px; border-top:2px solid var(--line-soft); letter-spacing:0.02em; }
  .extra-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:12px; }

  #detail{ display:block; }
  .detail-card{ background:var(--panel); border:2px solid var(--line); border-radius:var(--radius-lg); padding:26px 28px; box-shadow:var(--shadow-sm); }
  .detail-head{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:20px; padding-bottom:18px; border-bottom:2px solid var(--line-soft); }
  .detail-head h3{ margin:0 0 6px; font-size:20px; font-weight:800; letter-spacing:-0.01em; }
  .detail-meta{ font-size:12.5px; color:var(--ink-soft); display:flex; gap:14px; flex-wrap:wrap; }

  .env-config{
    display:flex; gap:12px; flex-wrap:wrap; align-items:end; background:#F5F8F6;
    border:2px solid var(--line-soft); border-radius:10px; padding:12px 14px; margin-bottom:6px;
  }
  .env-config label{ font-size:10.5px; color:var(--ink-faint); font-weight:700; display:flex; flex-direction:column; gap:4px; }
  .env-config input, .env-config select{ border:2px solid var(--line); border-radius:8px; padding:8px 9px; font-size:13px; font-family:inherit; }
  .env-config input:focus, .env-config select:focus{ outline:none; border-color:var(--teal); }
  button{ font-family:inherit; }
  .btn{ padding:11px 18px; border-radius:9px; border:2px solid var(--line); background:#fff; color:var(--ink); font-size:13px; font-weight:700; cursor:pointer; transition:all 0.14s ease; }
  .btn:hover{ border-color:var(--teal); color:var(--teal-deep); background:var(--teal-soft); }
  .btn.primary{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .btn.primary:hover{ background:var(--teal-deep); border-color:var(--teal-deep); color:#fff; }
  .btn.danger-text{ color:var(--danger); border-color:transparent; background:transparent; padding:6px 10px; }
  .btn.danger-text:hover{ background:#FBEBE9; color:var(--danger); }
  .btn.small{ padding:6px 10px; font-size:11.5px; white-space:nowrap; }
  .btn.close-x{ border:none; background:transparent; font-size:17px; color:var(--ink-faint); padding:4px 8px; }
  .btn.close-x:hover{ background:var(--line-soft); color:var(--ink); }

  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); padding:10px 12px; border-bottom:2px solid var(--line); font-weight:800; }
  tbody td{ padding:10px 12px; border-bottom:2px solid var(--line-soft); font-size:13.5px; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover td{ background:#FAFBFA; }
  .editable{ border:2px solid transparent; background:transparent; font-size:13.5px; font-family:inherit; padding:5px 7px; border-radius:6px; width:100%; color:var(--ink); }
  .editable:hover{ background:var(--line-soft); }
  .editable:focus{ outline:none; border-color:var(--teal); background:#fff; box-shadow:0 0 0 3px rgba(30,138,115,0.1); }
  .qty-cell{ display:flex; align-items:center; gap:6px; }
  .qty-cell input{ width:56px; text-align:center; }
  .step-btn{ width:30px;height:30px; border-radius:8px; border:2px solid var(--line); background:#fff; cursor:pointer; font-size:15px; line-height:1; color:var(--ink-soft); }
  .step-btn:hover{ border-color:var(--teal); color:var(--teal); }
  .expiry-warn{ color:var(--amber); font-weight:700; }
  .expiry-over{ color:var(--danger); font-weight:700; }
  .empty-materials{ text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13px; }
  .add-row-btn{ margin-top:14px; padding:13px 16px; border-radius:9px; border:1.5px dashed var(--line); background:transparent; color:var(--ink-soft); font-size:13px; font-weight:700; cursor:pointer; width:100%; transition:all 0.14s ease; }
  .add-row-btn:hover{ border-color:var(--teal); color:var(--teal); background:var(--teal-soft); }

  .floor-band{ margin-bottom:20px; }
  .floor-band-label{
    font-size:11.5px; font-weight:800; color:var(--teal-deep); letter-spacing:0.06em;
    margin-bottom:9px; display:flex; align-items:center; gap:6px;
  }
  .floor-band-label::before{ content:''; width:7px; height:7px; border-radius:2px; background:var(--teal); display:inline-block; }
  .struct-cols{ display:grid; gap:12px; }
  .struct-cols.scrollable{
    grid-auto-flow:column; grid-auto-columns:300px; overflow-x:auto; padding:2px 4px 10px 2px; scroll-snap-type:x proximity;
  }
  .struct-cols.scrollable::-webkit-scrollbar{ height:7px; }
  .struct-cols.scrollable::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; }
  .struct-cols.scrollable .struct-col{ scroll-snap-align:start; }
  .struct-col{
    background:#FAFBFA; border:1.4px solid var(--line-soft); border-radius:14px; padding:9px; min-width:0;
    transition:border-color 0.14s ease;
  }
  .struct-col:hover{ border-color:var(--line); }
  .bed-col-title{ font-size:14px; font-weight:800; margin-bottom:6px; text-align:center; color:var(--ink); letter-spacing:-0.01em; }
  .bed-floor-section{ margin-bottom:0; padding:5px; border-radius:8px; }
  .bed-floor-section + .bed-floor-section{ margin-top:4px; border-top:1.8px solid var(--line); padding-top:6px; }
  .bed-floor-label{
    font-size:12.5px; font-weight:900; color:var(--ink); letter-spacing:0.06em;
    margin-bottom:3px; display:flex; align-items:center; gap:5px; text-transform:uppercase;
  }

  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  .batch-card{
    background:#fff; border:1.4px solid var(--line-soft); border-radius:12px; padding:11px; margin-bottom:8px;
    display:flex; flex-direction:column; gap:6px; position:relative; box-shadow:var(--shadow-float);
    transition:box-shadow 0.16s ease;
  }
  .batch-card:hover{ box-shadow:0 18px 36px -8px rgba(15,60,48,0.16), 0 4px 10px -2px rgba(15,60,48,0.08); }
  .batch-card.pending-harvest{ background:#F5F6F3; opacity:0.85; }
  .batch-card input, .batch-card select{
    border:2px solid var(--line); background:#fff; font-size:13px; font-family:inherit;
    padding:9px 10px; border-radius:8px; width:100%; color:var(--ink);
  }
  .batch-card input:focus, .batch-card select:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(30,138,115,0.1); }
  .batch-card .row2{ display:flex; gap:7px; }
  .batch-card .row2 > *{ flex:1; min-width:0; }
  .batch-card label{ font-size:11px; color:var(--ink-faint); display:flex; flex-direction:column; gap:4px; font-weight:600; }
  .batch-actions{ display:flex; gap:8px; margin-top:2px; }
  .batch-save-btn{
    flex:1; padding:10px; border-radius:9px; border:none; background:var(--teal); color:#fff;
    font-size:12.5px; font-weight:800; cursor:pointer; transition:background 0.14s ease;
  }
  .batch-save-btn:hover{ background:var(--teal-deep); }
  .batch-save-btn  .batch-del-btn{
    padding:10px 14px; border-radius:9px; border:2px solid var(--line); background:#fff; color:var(--danger);
    font-size:12.5px; font-weight:700; cursor:pointer; transition:all 0.14s ease;
  }
  .batch-del-btn:hover{ background:#FBEBE9; border-color:#FBEBE9; }
  .add-batch-btn{
    width:100%; padding:12px; border-radius:9px; border:1.5px dashed var(--line); background:transparent;
    color:var(--ink-faint); font-size:12px; font-weight:700; cursor:pointer; transition:all 0.14s ease;
  }
  .add-batch-btn:hover{ border-color:var(--teal); color:var(--teal); background:var(--teal-soft); }

  .work-section{
    background:#FAFBFA; border:1.8px solid var(--line-soft); border-radius:var(--radius-lg);
    padding:18px 20px; margin-bottom:18px;
  }
  .visual-two-col{ display:flex; gap:18px; align-items:flex-start; }

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

const CROP_PALETTE = ['#1F8A76','#C97A2B','#3B6FB6','#8A4FB0','#B5453B','#4C8C3C','#A6763B','#5D6B7A','#5A4FCF','#C0587A'];
function cropColor(name){
  if(!name) return '#9AA6A0';
  if(CROP_COLORS[name]) return CROP_COLORS[name];
  let h = 0;
  for(let i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) % 997; }
  return CROP_PALETTE[h % CROP_PALETTE.length];
}
function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + Number(days));
  return d.toISOString().slice(0,10);
}
function growthProgress(sowing, harvest){
  if(!sowing || !harvest) return null;
  const start = new Date(sowing + 'T00:00:00').getTime();
  const end = new Date(harvest + 'T00:00:00').getTime();
  const now = Date.now();
  if(end <= start) return null;
  return Math.max(0, Math.min(100, (now - start) / (end - start) * 100));
}
function daysLeftLabel(harvest){
  if(!harvest) return '';
  const end = new Date(harvest + 'T00:00:00').getTime();
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((end - now.getTime()) / 86400000);
  if(diff > 0) return `수확까지 ${diff}일`;
  if(diff === 0) return '수확 예정일';
  return `수확일 ${Math.abs(diff)}일 지남`;
}

    ['고온검정실','2','2층','들깨','GG-102','','F2','고온검정 예비실험','50구 트레이','4','','','120','2026-08-01','',''],
  ];

function normalizeExcelDate(v){
  if(!v) return null;
  if(v instanceof Date){
    const y=v.getFullYear(), m=String(v.getMonth()+1).padStart(2,'0'), d=String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v).trim();
  if(!s) return null;
  const m = s.match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if(m){ return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`; }
  return null;
}

async function handleExcelUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const btn = document.getElementById('excelUploadBtn');
  const originalText = btn.textContent;
  btn.textContent = '처리 중...';
  btn.disabled = true;

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

    if(!rows.length){ alert('엑셀에 데이터가 없어요.'); return; }

    let updated=0, inserted=0;
    const errors=[];

    for(let i=0;i<rows.length;i++){
      const r = rows[i];
      const rowNum = i+2;
      const roomName = String(r['방이름']||'').trim();
      if(!roomName) continue;

      const room = rooms.find(x=>x.name===roomName);
      if(!room){ errors.push(`${rowNum}행: "${roomName}" 방을 찾을 수 없어요`); continue; }

      const structure_no = r['베드번호']===''? null : parseInt(r['베드번호']);
      const floor = String(r['층']||'').trim() || null;
      const name = String(r['작물']||'').trim() || null;
      const line_no = String(r['계통번호']||'').trim() || null;
      const cross_combo = String(r['교배조합']||'').trim() || null;
      const generation = String(r['세대']||'').trim() || null;
      const purpose = String(r['교배목적']||'').trim() || null;
      const quantity = r['개체수']===''? null : Number(r['개체수']);

      const trays = [];
      const t1type = String(r['트레이1종류']||'').trim();
      if(t1type) trays.push({ type:t1type, count: r['트레이1개수']===''?null:Number(r['트레이1개수']) });
      const t2type = String(r['트레이2종류']||'').trim();
      if(t2type) trays.push({ type:t2type, count: r['트레이2개수']===''?null:Number(r['트레이2개수']) });

      let sowing_date = normalizeExcelDate(r['파종일']);
      let expected_days = r['예상재배기간(일)']===''? null : parseInt(r['예상재배기간(일)']);
      let harvest_date = normalizeExcelDate(r['수확예정일']);

      if(expected_days == null && name && cropProfiles[name] != null){ expected_days = cropProfiles[name]; }
      if(!harvest_date && sowing_date && expected_days != null){ harvest_date = addDays(sowing_date, expected_days); }

      const payload = {
        room_id: room.id, structure_no, floor, name, line_no, cross_combo, generation, purpose, quantity,
        trays, container_type: trays[0]?.type || null, container_count: trays[0]?.count ?? null,
        sowing_date, expected_days, harvest_date, updated_at: new Date().toISOString()
      };

      const existing = materials.find(m =>
        m.room_id===room.id && m.structure_no===structure_no && m.floor===floor &&
        (line_no ? m.line_no===line_no : m.name===name)
      );

      if(existing){
        const { error } = await sb.from('materials').update(payload).eq('id', existing.id);
        if(error) errors.push(`${rowNum}행: ${error.message}`); else updated++;
      } else {
        const { error } = await sb.from('materials').insert(payload);
        if(error) errors.push(`${rowNum}행: ${error.message}`); else inserted++;
      }
      if(expected_days!=null && name){
        await sb.from('crop_profiles').upsert({ name, typical_days: expected_days, updated_at: new Date().toISOString() });
      }
    }

    await loadAll();
    let msg = `엑셀 처리 완료!\n\n수정 ${updated}건 · 추가 ${inserted}건`;
    if(errors.length){
      msg += `\n\n⚠️ 처리 못한 행 ${errors.length}건:\n` + errors.slice(0,15).join('\n');
      if(errors.length>15) msg += `\n... 외 ${errors.length-15}건`;
    }
    alert(msg);
  } catch(err){
    console.error(err);
    alert('엑셀 처리 중 오류가 발생했어요!\n\n' + err.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
    e.target.value = '';
  }
}

  } else {

    const purpose = document.getElementById('locPurpose').value || null;
    const qEl = document.getElementById('locQty').value;

function renderTasksView(){
  const wrap = document.getElementById('tasksViewWrap');
  if(!wrap) return;

  const tasksForDate = dailyTasks.filter(t=> t.task_date===taskViewDate);

  const ROOM_ORDER = [...new Set([...ROW1, ...ROW2])];
  const sortByRoomBed = (a,b)=>{
    const ra = ROOM_ORDER.indexOf(a.room_name), rb = ROOM_ORDER.indexOf(b.room_name);
    if(ra!==rb) return (ra<0?999:ra) - (rb<0?999:rb);
    return (a.bed_no ?? 999) - (b.bed_no ?? 999);
  };
  const requestItemsAll = tasksForDate.filter(t=> t.source!=='worker').sort(sortByRoomBed);
  const requestItems = taskFilterRoom ? requestItemsAll.filter(t=> t.room_name===taskFilterRoom) : requestItemsAll;

function taskCalendarHtml(){
  if(!taskCalendarMonth) taskCalendarMonth = new Date();
  const year = taskCalendarMonth.getFullYear();
  const month = taskCalendarMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  const taskDateSet = new Set(dailyTasks.filter(t=>t.completed_at || t.task_type!=='물주기').map(t=>t.task_date));

  let cells = '';
  for(let i=0;i<startWeekday;i++){ cells += `<div class="tcal-cell empty"></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr===todayStr;
    const isSelected = dateStr===taskViewDate;
    const hasTask = taskDateSet.has(dateStr);
    cells += `
      <div class="tcal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="setTaskViewDate('${dateStr}')">
        <span class="tcal-daynum">${d}</span>
        <div class="tcal-dots">
          ${hasTask ? `<span class="tcal-dot task"></span>` : ''}
        </div>
      </div>
    `;
  }

  return `
    <div class="task-calendar">
      <div class="tcal-header">
        <button type="button" onclick="shiftTaskCalendarMonth(-1)">‹</button>
        <span>${year}년 ${month+1}월</span>
        <button type="button" onclick="shiftTaskCalendarMonth(1)">›</button>
      </div>
      <div class="tcal-weekdays">${['일','월','화','수','목','금','토'].map(w=>`<div>${w}</div>`).join('')}</div>
      <div class="tcal-grid">${cells}</div>
      <div class="tcal-legend">
        <span><span class="tcal-dot task"></span> 등록된 작업</span>
      </div>
    </div>
  `;
}

function shiftTaskCalendarMonth(delta){
  taskCalendarMonth = new Date(taskCalendarMonth.getFullYear(), taskCalendarMonth.getMonth()+delta, 1);
  renderTasksView();
}

      <div class="task-section-title" style="display:flex; justify-content:space-between; align-items:center;">

let selectedTaskBeds = new Set();
function renderTaskBedChips(){
  selectedTaskBeds = new Set();
  const wrap = document.getElementById('taskBedChipWrap');
  if(!wrap) return;
  const roomName = document.getElementById('taskRoomInput').value;
  const cfg = DEFAULT_ROOM_CONFIG[roomName];
  if(!roomName || !cfg){
    wrap.innerHTML = `<div style="font-size:11.5px; color:var(--ink-faint); padding:4px 0;">시설 전체 요청이에요 (베드 지정 없음)</div>`;
    return;
  }
  const beds = Array.from({length: cfg.bed_count}, (_,i)=> i+1);
  wrap.innerHTML = `
    <div style="font-size:11px; font-weight:700; color:var(--ink-faint); margin-bottom:6px;">베드 선택 (여러 개 가능, 안 고르면 방 전체)</div>
    <div class="task-bed-chips">
      ${beds.map(b=>`<button type="button" class="task-bed-chip" data-bed="${b}" onclick="toggleTaskBedChip(${b}, this)">베드 ${b}</button>`).join('')}
      <button type="button" class="task-bed-chip all" onclick="selectAllTaskBedChips(${cfg.bed_count})">전체</button>
    </div>
  `;
}
function toggleTaskBedChip(bed, el){
  if(selectedTaskBeds.has(bed)){ selectedTaskBeds.delete(bed); el.classList.remove('active'); }
  else{ selectedTaskBeds.add(bed); el.classList.add('active'); }
}
function selectAllTaskBedChips(bedCount){
  const wrap = document.getElementById('taskBedChipWrap');
  const allSelected = selectedTaskBeds.size === bedCount;
  selectedTaskBeds = new Set();
  wrap.querySelectorAll('.task-bed-chip[data-bed]').forEach(el=>{
    if(!allSelected){ selectedTaskBeds.add(parseInt(el.dataset.bed)); el.classList.add('active'); }
    else{ el.classList.remove('active'); }
  });
}

}

function workRowStatus(harvestDate){
  if(!harvestDate) return { cls:'none', label:'-', diff:null, style:'background:var(--line-soft); color:var(--ink-faint);' };
  const diff = Math.round((new Date(harvestDate+'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
  let cls, label, style;
  if(diff < 0){
    cls = 'overdue';
    label = `${Math.abs(diff)}일 지남`;
    if(Math.abs(diff) >= 7) style = 'background:#B5453B; color:#fff;';
    else if(Math.abs(diff) >= 3) style = 'background:#D9756A; color:#fff;';
    else style = 'background:#F5D4CF; color:#8A342B;';
  } else if(diff <= 7){
    cls = 'soon';
    label = `D-${diff}`;
    style = diff <= 2 ? 'background:#F0AE7A; color:#fff;' : 'background:#FBEEDD; color:var(--amber);';
  } else {
    cls = 'ok';
    label = `D-${diff}`;
    style = 'background:var(--teal-soft); color:var(--teal-deep);';
  }
  return { cls, label, diff, style };
}

async function markHarvested(materialId){

  if(!m) return;
  if(!confirm(`"${m.line_no || m.name}" 수확완료 처리할까요?\n작업일지에 자동으로 기록돼요.`)) return;

  const { error: e1 } = await sb.from('materials').update({ harvested_at: new Date().toISOString() }).eq('id', materialId);
  if(e1){ alert('처리 실패!\n\n' + (e1.message||JSON.stringify(e1))); return; }

  const today = new Date().toISOString().slice(0,10);
  const bedNo = m.structure_no || 0;
  const floor = m.floor || '전체';
  const existing = roomNotes.find(n=> n.room_id===m.room_id && n.note_date===today && (n.bed_no??0)===bedNo && (n.floor||'전체')===floor);
  const qtyText = m.quantity!=null ? ` (${m.quantity}개)` : '';
  const newLine = `✅ ${m.line_no || m.name} 수확완료${qtyText}`;
  const combined = existing?.note ? existing.note + '\n' + newLine : newLine;

  const { error: e2 } = await sb.from('room_notes').upsert(
    { room_id: m.room_id, note_date: today, bed_no: bedNo, floor, note: combined, updated_at: new Date().toISOString() },
    { onConflict: 'room_id,note_date,bed_no,floor' }
  );
  if(e2){ alert('작업일지 기록 실패!\n\n' + (e2.message||JSON.stringify(e2))); return; }

  showToast('수확완료 처리 & 작업일지에 기록됐어요');
  const sp3 = captureScrollPositions();
  await loadAll();
  restoreScrollPositions(sp3);
}

function roomCalendarHtml(room, bedCount){
  if(!calendarViewMonth) calendarViewMonth = new Date();
  if(!selectedNoteDate) selectedNoteDate = new Date().toISOString().slice(0,10);
  const year = calendarViewMonth.getFullYear();
  const month = calendarViewMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const noteDateSet = new Set(roomNotes.filter(n=> n.room_id===room.id && n.note).map(n=>n.note_date));
  const todayStr = new Date().toISOString().slice(0,10);

  let cells = '';
  for(let i=0;i<startWeekday;i++){ cells += `<div class="cal-cell empty"></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasNote = noteDateSet.has(dateStr);
    const isToday = dateStr===todayStr;
    const isSelected = dateStr===selectedNoteDate;
    cells += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectRoomNoteDate('${room.id}', '${dateStr}')">${d}${hasNote?'<span class="cal-dot"></span>':''}</div>`;
  }

  return `
    <div class="room-box-title">📅 달력</div>
    <div class="cal-header">
      <button type="button" onclick="shiftRoomCalendarMonth('${room.id}', -1)">‹</button>
      <span>${year}년 ${month+1}월</span>
      <button type="button" onclick="shiftRoomCalendarMonth('${room.id}', 1)">›</button>
    </div>
    <div class="cal-weekdays">${['일','월','화','수','목','금','토'].map(w=>`<div>${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  `;
}

function extractGenStage(genStr){
  if(!genStr) return null;
  if(genStr.includes('포장')) return '포장';
  const m = genStr.match(/F\s*(\d+)/i);
  if(m){
    const num = parseInt(m[1]);
    if(num>=1 && num<=6) return 'F'+num;
  }
  return null;
}

function spaceBedGroupedGrid(room, roomMaterials, bedCount, colsPerRow){

  if(layout){

  } else {
    topOrder = []; bottomOrder = [];
    for(let i=1;i<=bedCount;i++){ (i<=colsPerRow ? topOrder : bottomOrder).push(i); }
  }
  return `
    ${structColsWrapper(topOrder, spaceBedColumnsHtml(room, roomMaterials, topOrder))}
    ${innerCorridorHtml(topOrder, bottomOrder)}
    ${structColsWrapper(bottomOrder, spaceBedColumnsHtml(room, roomMaterials, bottomOrder))}
  `;
}

  const cls = many ? 'struct-cols scrollable' : 'struct-cols';
  const style = many ? '' : ` style="grid-template-columns:repeat(${colsPerRow}, 1fr);"`;

  let cols = '';
  for(let i=1;i<=bedCount;i++){
    if(bedFloors===2){
      const floor1 = roomMaterials.filter(m=> m.structure_no===i && m.floor==='1층' && !m.harvest_confirmed_at);
      const floor2 = roomMaterials.filter(m=> m.structure_no===i && m.floor==='2층' && !m.harvest_confirmed_at);
      cols += `
        <div class="struct-col expanded">
          <div class="bed-col-title">베드 ${i}</div>
          <div class="bed-floor-section">
            <div class="bed-floor-label">2층</div>
            ${floor2.length ? floor2.map(b=>batchCardHtml(b, true)).join('') : `<div class="empty-chip">등록된 작물이 없어요</div>`}
          </div>
          <div class="bed-floor-section">
            <div class="bed-floor-label">1층</div>
            ${floor1.length ? floor1.map(b=>batchCardHtml(b, true)).join('') : `<div class="empty-chip">등록된 작물이 없어요</div>`}
          </div>
        </div>
      `;
    } else {
      const batches = roomMaterials.filter(m=> m.structure_no===i && !m.harvest_confirmed_at);
      cols += `
        <div class="struct-col expanded">
          <div class="bed-col-title">베드 ${i}</div>
          ${batches.length ? batches.map(b=>batchCardHtml(b, true)).join('') : `<div class="empty-chip">등록된 작물이 없어요</div>`}
        </div>
      `;
    }
  }
  return `<div class="${cls}"${style}>${cols}</div>`;

function lightDurationLabel(start, end){
  if(!start || !end) return '';
  const toMin = (t)=>{ const [h,m] = t.split(':').map(Number); return h*60+m; };
  let diff = toMin(end) - toMin(start);
  if(diff < 0) diff += 24*60;
  const h = Math.floor(diff/60), m = diff%60;
  return `${h}시간${m ? m+'분':''}`;
}

function envSettingsHtml(room){
  const t = room.temperature, ls = room.light_start, le = room.light_end;

    return '';
  }

function hourSelectHtml(field, currentTime){
  const currentHour = currentTime ? currentTime.slice(0,2) : '';
  let opts = '<option value="">-</option>';
  for(let h=0; h<=24; h++){
    const hh = String(h).padStart(2,'0');
    opts += `<option value="${hh}:00" ${currentHour===hh?'selected':''}>${hh}시</option>`;
  }
  return `<select data-env-field="${field}" style="width:80px; box-sizing:border-box;">${opts}</select>`;
}

async function saveEnvSettings(roomId, btnEl){
  const wrap = btnEl.closest('.env-config');
  const get = (f)=> wrap.querySelector(`[data-env-field="${f}"]`).value;
  const payload = {
    temperature: get('temperature')===''? null : Number(get('temperature')),
    light_start: get('light_start') || null,
    light_end: get('light_end') || null,
    updated_at: new Date().toISOString()
  };
  const { error } = await sb.from('rooms').update(payload).eq('id', roomId);
  if(error){ alert('저장 실패!\n\n' + (error.message||JSON.stringify(error))); return; }
  showToast('저장됐어요');
  await loadAll();
}

function bedColumnsHtml(room, roomMaterials, order){
  return order.map(i=>{
    const floor1 = roomMaterials.filter(m=> m.structure_no===i && m.floor==='1층' && !m.harvest_confirmed_at);
    const floor2 = roomMaterials.filter(m=> m.structure_no===i && m.floor==='2층' && !m.harvest_confirmed_at);
    const addBtn = (fl) => canWriteMaterials() ? `<button class="add-batch-btn" onclick="confirmAddBatch('${room.id}', ${i}, '${fl}', true)">+ 집단 추가</button>` : '';

    const floor1Content = floor1.length ? floor1.map(b=>batchCardHtml(b)).join('') + addBtn('1층') : emptyBedSlotHtml(room.id, i, '1층');
    return `

function miniCalendarHtml(roomId, bedNo, floor){
  if(!calendarViewMonth) calendarViewMonth = new Date();
  const year = calendarViewMonth.getFullYear();
  const month = calendarViewMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const noteDateSet = new Set(
    bedNotes.filter(n=> n.room_id===roomId && n.structure_no===bedNo && n.floor===floor && n.note).map(n=>n.note_date)
  );
  const todayStr = new Date().toISOString().slice(0,10);

  let cells = '';
  for(let i=0;i<startWeekday;i++){ cells += `<div class="cal-cell empty"></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasNote = noteDateSet.has(dateStr);
    const isToday = dateStr===todayStr;
    const isSelected = dateStr===selectedNoteDate;
    cells += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectNoteDate('${dateStr}')">${d}${hasNote?'<span class="cal-dot"></span>':''}</div>`;
  }

  return `
    <div class="mini-calendar">
      <div class="cal-header">
        <button type="button" onclick="shiftCalendarMonth(-1)">‹</button>
        <span>${year}년 ${month+1}월</span>
        <button type="button" onclick="shiftCalendarMonth(1)">›</button>
      </div>
      <div class="cal-weekdays">${['일','월','화','수','목','금','토'].map(w=>`<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>
  `;
}

function shiftCalendarMonth(delta){
  calendarViewMonth = new Date(calendarViewMonth.getFullYear(), calendarViewMonth.getMonth()+delta, 1);
  renderDetail();
}

function selectNoteDate(dateStr){
  selectedNoteDate = dateStr;
  renderDetail();
}

        </div>
      </td>
      <td><input class="editable" data-field="location_detail" value="${escapeHtml(m.location_detail||'')}" /></td>
      <td><input class="editable ${expClass}" data-field="expiry_date" type="date" value="${m.expiry_date||''}" /></td>
      <td><input class="editable" data-field="manager" value="${escapeHtml(m.manager||'')}" /></td>
      <td style="white-space:nowrap;">
        <button class="btn small primary" onclick="saveMaterialRow('${m.id}', this)">저장</button>
        <button class="btn danger-text small" onclick="deleteMaterial('${m.id}')">삭제</button>
      </td>
    </tr>
  `;
}

async function saveMaterialRow(id, btnEl){
  const row = btnEl.closest('tr');
  const get = (f)=> row.querySelector(`[data-field="${f}"]`).value;
  const payload = {
    name: get('name').trim(),
    quantity: get('quantity')===''? null : get('quantity'),
    unit: get('unit') || null,
    location_detail: get('location_detail') || null,
    expiry_date: get('expiry_date') || null,
    manager: get('manager') || null,
    updated_at: new Date().toISOString()
  };
  const { error } = await sb.from('materials').update(payload).eq('id', id);
  if(error){ alert('저장 실패!\n\n' + (error.message||JSON.stringify(error))); return; }
  showToast('저장됐어요');
  await loadAll();
}

async function saveBatchCard(id, btnEl){
  const card = btnEl.closest('.batch-card');
  const get = (f)=> card.querySelector(`[data-field="${f}"]`).value;

  const name = get('name').trim();
  const line_no = get('line_no') || null;
  const quantity = get('quantity')===''? null : get('quantity');
  const purpose = get('purpose') || null;
  const record_type = card.querySelector('[data-field="record_type"]')?.value || 'breeding';

  let payload;
  if(record_type==='heat_test'){
    const test_condition = get('test_condition') || null;
    const test_result = get('test_result') || null;
    payload = {
      name, line_no, purpose, quantity, record_type, test_condition, test_result,
      cross_combo: null, generation: null, sowing_date: null, expected_days: null, harvest_date: null,
      updated_at: new Date().toISOString()
    };
    btnEl.textContent = '저장 중...';
    const { error } = await sb.from('materials').update(payload).eq('id', id);
    if(error){
      alert('저장 실패!\n\n' + (error.message||JSON.stringify(error)));
      btnEl.textContent = '💾 저장';
      return;
    }
    expandedBatchIds.delete(id);
    showToast('저장됐어요');
    const scrollPositionsHT = captureScrollPositions();
    await loadAll();
    restoreScrollPositions(scrollPositionsHT);
    return;
  }

  const cross_combo = get('cross_combo') || null;
  const generation = get('generation') || null;
  const sowing_date = get('sowing_date') || null;
  let expected_days = get('expected_days')===''? null : parseInt(get('expected_days'));
  let harvest_date = get('harvest_date') || null;

  const trays = [...card.querySelectorAll('.tray-row')].map(row=>({
    type: row.querySelector('.tray-type').value || null,
    count: row.querySelector('.tray-count').value === '' ? null : Number(row.querySelector('.tray-count').value)
  })).filter(t => t.type || t.count!=null);

  // 예상기간을 비워뒀는데 예전에 등록해둔 작물이면 자동 적용
  if(expected_days == null && name && cropProfiles[name] != null){
    expected_days = cropProfiles[name];
  }
  // 수확예정일을 직접 안 넣었으면 파종일+예상기간으로 자동 계산
  if(!harvest_date && sowing_date && expected_days != null){
    harvest_date = addDays(sowing_date, expected_days);
  }

  payload = {
    name, line_no, cross_combo, generation, purpose, quantity, record_type: 'breeding', test_condition: null, test_result: null,
    trays, container_type: trays[0]?.type || null, container_count: trays[0]?.count ?? null,
    sowing_date, expected_days, harvest_date, updated_at: new Date().toISOString()
  };

  btnEl.textContent = '저장 중...';
  const { error } = await sb.from('materials').update(payload).eq('id', id);
  if(error){
    alert('저장 실패!\n\n' + (error.message||JSON.stringify(error)));
    btnEl.textContent = '💾 저장';
    return;
  }
  if(expected_days != null && name){
    await sb.from('crop_profiles').upsert({ name, typical_days: expected_days, updated_at: new Date().toISOString() });
  }
  expandedBatchIds.delete(id);
  showToast('저장됐어요');
  const scrollPositions = captureScrollPositions();
  await loadAll();
  restoreScrollPositions(scrollPositions);
}
function openHistoryModal(materialId){
  const hist = generationHistory.filter(h=>h.material_id===materialId)
    .sort((a,b)=> (b.end_date||'').localeCompare(a.end_date||''));
  document.getElementById('historyModalList').innerHTML = hist.length ? hist.map((h,i)=>`
    <div style="border:2px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px;">
      <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:3px;">교배목적: ${h.purpose ? escapeHtml(h.purpose) : '-'}</div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:3px;">교배조합: ${h.cross_combo ? escapeHtml(h.cross_combo) : '-'}</div>
      <div style="font-size:12.5px; color:var(--ink-soft);">세대: ${h.generation ? escapeHtml(h.generation) : '-'}</div>
      <div style="display:flex; gap:6px; margin-top:6px;">
        ${(i===0 && canWriteMaterials()) ? `<button class="btn small" onclick="undoGenerationCompletion('${h.id}', '${materialId}')" style="padding:6px 10px;">↩️ 되돌리기</button>` : ''}
        ${isAdmin ? `<button class="btn danger-text small" onclick="deleteHistoryEntry('${h.id}', '${materialId}')" style="padding:6px 10px;">취소(삭제)</button>` : ''}
      </div>
    </div>
  `).join('') : `<div class="empty-chip">이력이 없어요</div>`;
  document.getElementById('historyModalOverlay').classList.add('open');
}

async function undoGenerationCompletion(historyId, materialId){
  const h = generationHistory.find(x=>x.id===historyId);
  if(!h){ alert('이력을 찾을 수 없어요.'); return; }
  const m = materials.find(x=>x.id===materialId);
  if(!confirm(`"${h.generation||'-'}" 세대완료 처리를 되돌릴까요?\n현재 입력된 세대 정보(${m&&m.generation? m.generation : '없음'})는 덮어씌워져요.`)) return;

  const { error: e1 } = await sb.from('materials').update({
    generation: h.generation, sowing_date: h.start_date, expected_days: h.expected_days, harvest_date: h.harvest_date,
    updated_at: new Date().toISOString()
  }).eq('id', materialId);
  if(e1){ alert('되돌리기 실패!\n\n' + (e1.message||JSON.stringify(e1))); return; }

  const { error: e2 } = await sb.from('generation_history').delete().eq('id', historyId);
  if(e2){ alert('이력 삭제 실패!\n\n' + (e2.message||JSON.stringify(e2))); return; }

  closeHistoryModal();
  showToast('세대완료가 되돌려졌어요');
  await loadAll();
}

function openHarvestStatusView(){
  workActiveRoomId = null;
  showingHarvestStatus = true;
  document.getElementById('workListMode').style.display = 'none';
  document.getElementById('workRoomDetail').style.display = 'none';
  renderRoomSidebar();

  const wrap = document.getElementById('workHarvestStatus');
  const list = materials.filter(m=> m.harvested_at).sort((a,b)=> b.harvested_at.localeCompare(a.harvested_at));

  const headerRowHtml = `
    <div class="wg-header-row wg-col-grid">
      <span>계통/조합명</span><span>설치 위치</span><span>승인신청일</span><span>승인여부</span><span></span>
    </div>
  `;
  const rowsHtml = list.length ? list.map(m=>{
    const room = rooms.find(r=>r.id===m.room_id);
    const confirmed = !!m.harvest_confirmed_at;
    const color = cropColor(m.name);
    return `
      <div class="wg-row wg-col-grid" onclick="jumpToLocation('${m.room_id}', ${m.structure_no}, '${m.floor}')">
        <span class="wg-row-crop"><span class="crop-dot" style="background:${color};"></span>${escapeHtml(m.line_no || m.name || '-')}</span>
        <span class="wg-row-loc">${room? escapeHtml(room.name):'-'} · 베드${m.structure_no??'-'} · ${escapeHtml(m.floor||'-')}</span>
        <span class="wg-row-date">${m.harvested_at.slice(0,10)}</span>
        <span class="status-pill" style="${confirmed? 'background:var(--teal-soft); color:var(--teal-deep);' : 'background:#FBEEDD; color:var(--amber);'}">${confirmed? '✅ 승인됨' : '⏳ 대기중'}</span>
        <span></span>
      </div>
    `;
  }).join('') : `<div class="empty-materials" style="padding:20px;">완료 보고된 항목이 없어요</div>`;

  wrap.innerHTML = `
    <div class="detail-card">
      <div class="detail-head">
        <div><h3>✅ 완료 보고 현황</h3></div>
        <button class="btn close-x" onclick="showFullWorkList()">✕</button>
      </div>
      <div class="work-list-box">${headerRowHtml}${rowsHtml}</div>
    </div>
  `;
  wrap.style.display = '';
}

function closeHistoryModal(){
  document.getElementById('historyModalOverlay').classList.remove('open');
}

async function deleteHistoryEntry(historyId, materialId){
  if(!confirm('이 세대 이력을 삭제할까요?')) return;
  const { error } = await sb.from('generation_history').delete().eq('id', historyId);
  if(error){ alert('삭제 실패!\n\n' + (error.message||JSON.stringify(error))); return; }
  showToast('이력이 삭제됐어요');
  await loadAll();
  openHistoryModal(materialId);
}

function historySummary(materialId){
  const hist = generationHistory.filter(h=>h.material_id===materialId)
    .sort((a,b)=> (b.end_date||'').localeCompare(a.end_date||''));
  if(!hist.length) return '';
  const fmt = (d)=> d ? d.slice(5).replace('-','/') : '?';
  return hist.map(h=> `${escapeHtml(h.generation||'-')}(${fmt(h.start_date)}~${fmt(h.end_date)})`).join(' · ');
}

async function completeGeneration(materialId){
  const m = materials.find(x=>x.id===materialId);
  if(!m || !m.generation){ alert('완료 처리할 세대 정보가 없어요. 먼저 세대를 입력하고 저장해주세요.'); return; }
  if(!confirm(`"${m.generation}" 세대를 완료 처리하고 다음 세대 입력을 위해 비울까요?\n(지금까지 기록은 이력에 남아요)`)) return;

  const endDate = new Date().toISOString().slice(0,10);
  const { error: e1 } = await sb.from('generation_history').insert({
    material_id: materialId, generation: m.generation, cross_combo: m.cross_combo, purpose: m.purpose,
    start_date: m.sowing_date || null, end_date: endDate,
    expected_days: m.expected_days ?? null, harvest_date: m.harvest_date || null
  });
  if(e1){ alert('세대 완료 기록 실패!\n\n' + (e1.message||JSON.stringify(e1))); return; }

  const { error: e2 } = await sb.from('materials').update({
    generation: null, sowing_date: null, expected_days: null, harvest_date: null,
    updated_at: new Date().toISOString()
  }).eq('id', materialId);
  if(e2){ alert('갱신 실패!\n\n' + (e2.message||JSON.stringify(e2))); return; }

  showToast('세대 완료! 다음 세대를 입력해주세요');
  await loadAll();
}
async function updateMaterial(id, field, value){
  const payload = { [field]: value === '' ? null : value, updated_at: new Date().toISOString() };
  const { error } = await sb.from('materials').update(payload).eq('id', id);
  if(error){ console.error(error); showToast('저장 실패'); }
  else { showToast('저장됨'); await loadAll(); }
}
async function stepQty(id, delta){
  const m = materials.find(x=>x.id===id);
  if(!m) return;
  const newQty = (Number(m.quantity)||0) + delta;
  await updateMaterial(id, 'quantity', newQty < 0 ? 0 : newQty);
}
async function addMaterial(roomId){
  const { error } = await sb.from('materials').insert({ room_id: roomId, name: '새 재료', quantity: 0 });
  if(error){ console.error(error); showToast('추가 실패'); }
  else await loadAll();
}
async function deleteMaterial(id){
  if(!confirm('이 재료를 삭제할까요?')) return;
  const { error } = await sb.from('materials').delete().eq('id', id);
  if(error) showToast('삭제 실패');
  else await loadAll();
}
async function deleteRoom(id){
  if(!confirm('이 방과 안의 모든 재료가 삭제됩니다. 계속할까요?')) return;
  const { error } = await sb.from('rooms').delete().eq('id', id);
  if(error) showToast('삭제 실패');
  else { activeRoomId = null; await loadAll(); }
}
function openRoomModal(){
  document.getElementById('roomModalOverlay').classList.add('open');
  document.getElementById('newRoomName').value='';
  document.getElementById('newRoomLocation').value='';
  document.getElementById('newRoomManager').value='';
  document.getElementById('newRoomName').focus();
}
function closeRoomModal(){ document.getElementById('roomModalOverlay').classList.remove('open'); }
async function createRoom(){
  const name = document.getElementById('newRoomName').value.trim();
  if(!name){ showToast('방 이름을 입력해주세요'); return; }
  const location = document.getElementById('newRoomLocation').value.trim();
  const manager = document.getElementById('newRoomManager').value.trim();
  const { data, error } = await sb.from('rooms').insert({ name, location, manager }).select().single();
  if(error){
    console.error(error);
    alert('방 추가 실패!\n\n에러 메시지: ' + (error.message || JSON.stringify(error)) + '\n\n코드: ' + (error.code || '없음') + '\n힌트: ' + (error.hint || '없음'));
    return;
  }
  closeRoomModal();
  activeRoomId = data.id;
  showToast('방이 추가되었어요');
  await loadAll();
}

sb.channel('facility-changes')
  .on('postgres_changes', { event:'*', schema:'public', table:'rooms' }, loadAll)
  .on('postgres_changes', { event:'*', schema:'public', table:'materials' }, loadAll)
  .subscribe((status)=>{ if(status === 'SUBSCRIBED') setStatus(true); });

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  const batchModal = document.getElementById('batchLocModalOverlay');
  const roomModal = document.getElementById('roomModalOverlay');
  const historyModal = document.getElementById('historyModalOverlay');
  const harvestModal = document.getElementById('harvestStatusModalOverlay');
  const moreTargetsModal = document.getElementById('moreTargetsModalOverlay');
  const roomDetailModal = document.getElementById('roomDetailModalOverlay');
  const addTaskModal = document.getElementById('addTaskModalOverlay');
  const editTaskModal = document.getElementById('editTaskModalOverlay');
  const searchResults = document.getElementById('searchResults');
  if(batchModal.classList.contains('open')) closeBatchLocModal();
  else if(roomModal.classList.contains('open')) closeRoomModal();
  else if(historyModal.classList.contains('open')) closeHistoryModal();
  else if(harvestModal.classList.contains('open')) closeHarvestStatusModal();
  else if(moreTargetsModal.classList.contains('open')) closeMoreTargetsModal();
  else if(roomDetailModal.classList.contains('open')) closeRoomDetailModal();
  else if(addTaskModal.classList.contains('open')) closeAddTaskModal();
  else if(editTaskModal.classList.contains('open')) closeEditTaskModal();
  else if(searchResults && searchResults.classList.contains('open')) searchResults.classList.remove('open');
});

updateAdminUI();
setTimeout(()=>{
  const st = document.getElementById('statusText');
  if(st && st.textContent === '연결 중...'){
    alert('8초가 지나도 연결이 안 되고 있어요.\n\n혹시 지금 이 화면을 Claude 채팅창 안의 "미리보기"로 보고 계신가요?\n그렇다면 파일을 다운로드 받은 뒤, 실제 브라우저 탭(Chrome/Edge 등)에서 다시 열어주세요.\n채팅 안 미리보기는 보안 제한 때문에 외부 서버와 통신할 수 없어요.');
  }
}, 8000);
loadAll();
