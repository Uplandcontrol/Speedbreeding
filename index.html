function cropSummaryCardHtml(cropName){
  const allMaterialsForCrop = materials.filter(m=> m.name===cropName && !m.harvest_confirmed_at);
  // 세대단축이 있는 작물: 위쪽 흐름(F1~포장)에는 세대단축 내용만 올리고, 인공교배 · 고온검정 · 기타 실험은
  //   카드 아랫줄에 "실험 진행 중: 인공교배 N집단 · 고온검정 N집단"처럼 개수만 작게 보여준다.
  // 세대단축이 없는 작물: 인공교배는 흐름으로 보여주고(F1 앞에 'C'(Cross, 인공교배) 단계가 붙는다), 고온검정 · 기타 실험은 목록으로 보여준다.
  const isCross = (m)=> batchPurposeOf(m)==='인공교배';
  const breedBatches = allMaterialsForCrop.filter(m=> batchPurposeOf(m)==='세대단축');
  const crossBatches = allMaterialsForCrop.filter(isCross);
  const otherBatches = allMaterialsForCrop.filter(m=> !isCross(m) && batchPurposeOf(m)!=='세대단축');   // 고온검정 · 기타 실험
  const hasBreed = breedBatches.length > 0;
  const batches = hasBreed ? breedBatches : crossBatches;                      // 흐름 줄에 올리는 계통
  const expBatches = hasBreed ? [] : otherBatches;                             // 목록으로 보여주는 실험
  const footerBatches = hasBreed ? [...crossBatches, ...otherBatches] : [];    // 아랫줄에 개수로만 보여주는 계통
  // 흐름 줄의 이름: 계통번호. 인공교배는 계통번호가 없어서 교배조합이 이름이다
  const lineKeyOf = (b)=> b.line_no || (isCross(b) ? crossComboLabel(b) : '') || '(계통번호 없음)';   // 인공교배는 '선풍/남천 외 3조합'
  // 인공교배 조합 수: 교배조합이 같은 계통은 한 번만 세고(외 N은 그중 큰 값), 조합마다 1 + 외 N
  const crossComboCount = (list)=>{
    const byCombo = new Map();
    list.filter(isCross).forEach(b=>{ const k = b.cross_combo || '(교배조합 없음)'; byCombo.set(k, Math.max(byCombo.get(k) || 0, crossExtraOf(b))); });
    return [...byCombo.values()].reduce((s, n)=> s + 1 + n, 0);
  };
  const purposeOf = (b)=> b.purpose || '목표 미설정';   // 계통번호가 없는 세대단축 계통은 같은 목표끼리 한 집단 (아래 groupCount)
  const hasCross = !hasBreed && crossBatches.length > 0;   // 세대단축이 없어서 인공교배가 흐름에 오를 때만 C 단계를 둔다 (세대단축 흐름은 예전 그대로 F1부터)
  const qtyOf = (list)=> list.reduce((s,b)=> s + (Number(b.quantity)||0), 0);
  const totalQty = qtyOf(batches) + qtyOf(expBatches);
  const color = cropColor(cropName);
  const GEN_STAGES = [...(hasCross ? ['C'] : []), 'F1','F2','F3','F4','F5','F6','포장'];
  // '진행중만 보기': 세대가 적혀 있는 계통과 인공교배(교배 단계)를 진행 중으로 본다
  const isActiveBatch = (b)=> !!extractGenStage(b.generation) || isCross(b);

  const byPurpose = {};
  batches.forEach(b=>{
    const pKey = b.purpose || '목표 미설정';
    const lKey = lineKeyOf(b);
    if(!byPurpose[pKey]) byPurpose[pKey] = {};
    if(!byPurpose[pKey][lKey]) byPurpose[pKey][lKey] = [];
    byPurpose[pKey][lKey].push(b);
  });
  let purposeKeys = Object.keys(byPurpose).sort((a,b)=> a==='목표 미설정' ? 1 : b==='목표 미설정' ? -1 : 0);
  // 집단 수: 세대단축만 센다. 계통번호가 같으면 한 집단(베드가 달라도), 계통번호가 없으면 같은 목표끼리 한 집단. '진행중만 보기'로 걸러지기 전 전체
  //   인공교배 · 고온검정 · 기타 실험은 집단으로 세지 않고 각자의 단위(조합 · 품종 · 건)로 보여 준다 (아래 expUnitText)
  const groupCount = new Set(breedBatches.map(b=>{ const line = String(b.line_no ?? '').trim(); return line ? `L|${line}` : `P|${purposeOf(b)}`; })).size;
  if(showActiveOnlyCrops){
    purposeKeys = purposeKeys.filter(purpose=>
      Object.values(byPurpose[purpose]).some(lBatches=> lBatches.some(isActiveBatch))
    );
  }

  const renderLineSubRow = (lineKey, lBatches)=>{
    const genCounts = {};
    lBatches.forEach(b=>{
      const stage = extractGenStage(b.generation);
      if(stage){ genCounts[stage] = (genCounts[stage]||0) + 1; }
      if(isCross(b)){ genCounts['C'] = (genCounts['C']||0) + 1; }   // 인공교배(C) 단계에 색이 찬다
    });
    const lQty = lBatches.reduce((s,b)=> s + (Number(b.quantity)||0), 0);
    return `
      <div class="csc-line-subrow">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
          <span style="font-size:11.5px; font-weight:800; color:${color};">${lineKey==='(계통번호 없음)' ? '<span style="color:var(--ink-faint); font-weight:700;">계통번호 없음</span>' : escapeHtml(lineKey)}</span>
          <span style="font-size:11px; font-weight:700; color:var(--ink-faint);">${lQty.toLocaleString()}개체</span>
        </div>
        <div class="gen-timeline${hasCross ? ' compact' : ''}">
          ${GEN_STAGES.map((g,i)=>{
            const count = genCounts[g] || 0;
            const active = count > 0;
            return `
            <div class="gen-step ${active?'active':'inactive'}" style="${active?`--dot-glow:${color};`:''}"${g==='C' ? ' title="인공교배"' : ''}>
              <div class="gen-dot" style="${active ? `background:${color}; border-color:${color}; color:#fff;` : `border-color:var(--line); color:var(--ink-faint);`} ${g.length>2?'font-size:7.5px; line-height:1; white-space:normal;':''}">${g.length>2 ? escapeHtml(g.slice(0,2))+'<br>'+escapeHtml(g.slice(2)) : escapeHtml(g)}</div>
            </div>
            ${i<GEN_STAGES.length-1 ? `<div class="gen-line" style="background:${active?color:'var(--line)'};"></div>` : ''}
          `;}).join('')}
        </div>
      </div>
    `;
  };

  const renderTargetRow = (purpose)=>{
    const lineGroups = byPurpose[purpose];
    let lineKeysInPurpose = Object.keys(lineGroups).sort((a,b)=> a==='(계통번호 없음)' ? 1 : b==='(계통번호 없음)' ? -1 : a.localeCompare(b));
    if(showActiveOnlyCrops){
      lineKeysInPurpose = lineKeysInPurpose.filter(lineKey=> lineGroups[lineKey].some(isActiveBatch));
    }
    const purposeQty = lineKeysInPurpose.reduce((s,lineKey)=> s + lineGroups[lineKey].reduce((s2,b)=> s2 + (Number(b.quantity)||0), 0), 0);
    // 인공교배가 흐름으로 오를 때: 목적 줄에 조합 수를 함께 적는다 (예: 내병성 [인공교배] 7조합)
    const comboN = hasCross ? crossComboCount(lineKeysInPurpose.flatMap(k=> lineGroups[k])) : 0;
    return `
      <div class="csc-target-row">
        <div class="csc-target-label" style="display:flex; justify-content:space-between; align-items:baseline;">
          <span style="font-size:13px; font-weight:900; color:var(--ink);">${purpose==='목표 미설정' ? '<span style="color:var(--ink-faint); font-weight:700;">목표 미설정</span>' : `${escapeHtml(purpose)}`}${hasCross ? ` ${expKindBadge('인공교배')}` : ''}${comboN ? ` <span style="font-size:11px; font-weight:800; color:#2F5DA8;">${comboN}조합</span>` : ''}</span>
          <span style="font-weight:800; color:var(--ink);">${purposeQty.toLocaleString()}개체</span>
        </div>
        <div class="csc-line-sublist">
          ${lineKeysInPurpose.map(lineKey=> renderLineSubRow(lineKey, lineGroups[lineKey])).join('')}
        </div>
      </div>
    `;
  };

  // 실험 목록(고온검정 · 기타 실험): 종류 · 목적 · 처리 조건(온도 · 처리시기 · 일장)이 모두 같으면 베드가 달라도 한 줄로 합친다.
  //   한 줄 = 목적 + 종류 뱃지 · 총 개체수 / 처리 조건 (베드별 계통 이름은 보여 주지 않는다)
  const EXP_KIND_ORDER = ['고온검정','기타'];
  const EXP_EMPTY_LABEL = { '고온검정':'검정 목적 미기재', '기타':'실험 내용 미기재' };
  const expKindBadge = (kind)=> {
    const st = { '인공교배':'background:#E7EEF9; color:#2F5DA8;', '고온검정':'background:#FBEEDD; color:#C2410C;', '기타':'background:#EFE8F7; color:#6A3FA0;' }[kind];
    return `<span class="task-worker-badge" style="${st}">${kind==='기타' ? '기타 실험' : kind}</span>`;
  };
  // 고온검정 한 줄의 재료 요약: 품종 이름을 늘어놓지 않고 '품종 10종 · 3반복'만 보여 준다 (이름은 마우스를 올리면 나온다)
  //   같은 품종 묶음(계통/품종 칸의 글자가 같은 것)이 몇 줄 등록돼 있는지가 반복 수다.
  //   칸에 '(3반복)'처럼 적어 둔 글자는 떼고 같은 묶음으로 센다. 묶음마다 반복 수가 다르면 '2~3반복'
  const heatSetsSummary = (list)=>{
    const sets = new Map();
    list.forEach(b=>{
      const key = stripRepeatSuffix(b.line_no);
      if(key) sets.set(key, (sets.get(key) || 0) + 1);
    });
    const varieties = new Set();
    sets.forEach((_, key)=> key.split(VARIETY_SPLIT).map(s=> s.trim()).filter(Boolean).forEach(v=> varieties.add(v)));
    const reps = [...sets.values()], lo = Math.min(...reps), hi = Math.max(...reps);
    const text = [varieties.size ? `품종 ${varieties.size}개` : '', hi > 1 ? (lo === hi ? `${hi}반복` : `${lo}~${hi}반복`) : ''].filter(Boolean).join(' · ');
    return text ? `<div title="${escapeHtml([...sets.keys()].join('\n'))}" style="font-size:11.5px; font-weight:700; color:${color}; margin-top:2px;">${text}</div>` : '';
  };
  const renderExperiments = ()=>{
    const groups = new Map();
    expBatches.forEach(b=>{
      const kind = batchPurposeOf(b), label = b.purpose || EXP_EMPTY_LABEL[kind];
      const cond = String(b.test_condition ?? '').trim();
      const key = kind + '|' + label + '|' + cond;
      if(!groups.has(key)) groups.set(key, { kind, label, cond, list: [] });
      groups.get(key).list.push(b);
    });
    return [...groups.values()]
      .sort((a, b)=> EXP_KIND_ORDER.indexOf(a.kind) - EXP_KIND_ORDER.indexOf(b.kind) || a.label.localeCompare(b.label) || a.cond.localeCompare(b.cond))
      .map(g=> `
          <div class="csc-target-row">
            <div class="csc-target-label" style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
              <span style="font-size:13px; font-weight:900; color:var(--ink); min-width:0;">${escapeHtml(g.label)} ${expKindBadge(g.kind)}</span>
              <span style="font-weight:800; color:var(--ink); flex-shrink:0;">${qtyOf(g.list).toLocaleString()}개체</span>
            </div>
            ${g.kind === '고온검정' ? heatSetsSummary(g.list) : (()=>{
              // 재료: 계통번호(없으면 교배조합) — 베드가 달라도 같은 재료는 한 번만
              const names = [...new Set(g.list.map(b=> b.line_no || crossComboLabel(b)).filter(Boolean))];
              return names.length ? `<div style="font-size:11.5px; font-weight:700; color:${color}; margin-top:2px; word-break:break-word;">${names.map(escapeHtml).join(', ')}</div>` : '';
            })()}
            ${g.cond ? `<div style="font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-top:2px; word-break:break-word;">${escapeHtml(g.cond)}</div>` : ''}
          </div>`).join('');
  };
  // 인공교배 · 고온검정 · 기타 실험은 집단 대신 각자의 단위로 센다: 인공교배 8조합 · 고온검정 품종 10개 · 기타 실험 1건
  //   (고온검정은 품종 이름이 없으면 건수. 건수는 같은 목적이면 한 건)
  const expUnitText = (kind, list)=>{
    if(kind==='인공교배') return `${crossComboCount(list)}조합`;
    const varieties = kind==='고온검정' ? new Set(list.flatMap(b=> heatVarietiesOf(b))).size : 0;
    return varieties ? `품종 ${varieties}개` : `${new Set(list.map(purposeOf)).size}건`;
  };
  const KIND_LABEL = { '인공교배':'인공교배', '고온검정':'고온검정', '기타':'기타 실험' };
  // 종류마다 { kind, text:'인공교배 8조합', qty } (없는 종류는 뺀다)
  const unitParts = (list)=> ['인공교배','고온검정','기타'].map(kind=>{
    const l = list.filter(b=> batchPurposeOf(b)===kind);
    return l.length ? { kind, text:`${KIND_LABEL[kind]} ${expUnitText(kind, l)}`, qty: qtyOf(l) } : null;
  }).filter(Boolean);
  // 세대단축이 있는 작물의 아랫줄: 인공교배 · 고온검정 · 기타 실험을 각자의 단위로
  const expFooter = (()=>{
    // 예: 인공교배 8조합(28개체) · 고온검정 품종 10개(30개체)
    //     종류마다 글자색을 뱃지 색과 맞춘다 (인공교배 파랑 · 고온검정 주황 · 기타 실험 보라)
    const KIND_COLOR = { '인공교배':'#2F5DA8', '고온검정':'#B8763F', '기타':'#6A3FA0' };
    const parts = unitParts(footerBatches).map(p=> `<span style="color:${KIND_COLOR[p.kind]};">${p.text}(${p.qty.toLocaleString()}개체)</span>`);
    return parts.length ? `<div class="csc-heattest-row">${parts.join(' · ')}</div>` : '';
  })();
  // 카드 이름 아래 작은 글씨: 세대단축이 있으면 '3집단'(나머지는 아랫줄에), 없으면 인공교배 · 실험의 단위들 (아무것도 없으면 0집단)
  const headInfo = hasBreed ? `${groupCount}집단` : (unitParts(otherBatches.concat(crossBatches)).map(p=> p.text).join(' · ') || '0집단');
  const flowRowsHtml = purposeKeys.map(renderTargetRow).join('');
  const expRowsHtml = expBatches.length ? renderExperiments() : '';
  const timelineRowsHtml = (flowRowsHtml || expRowsHtml) ? flowRowsHtml + expRowsHtml : `<div class="empty-chip">등록된 목표 없음</div>`;

  return `
    <div class="crop-summary-card">
      <div class="csc-head" style="align-items:flex-start;">
        <span class="crop-dot" style="background:${color}; margin-top:5px;"></span>
        <div style="flex:1; min-width:0;">
          <h4 style="margin-bottom:2px; color:${color};">${escapeHtml(cropName)}</h4>
          <div style="font-size:10.5px; color:var(--ink-faint); font-weight:700;">${headInfo}</div>
        </div>
        <span style="font-weight:900; font-size:15px; color:var(--ink); flex-shrink:0;">${totalQty.toLocaleString()}개체</span>
      </div>
      <div class="csc-target-list">${timelineRowsHtml}</div>
      ${expFooter}
    </div>
  `;
}

function spaceOverviewHtml(){
  return `
    <div class="detail-card space-overview">
      <div class="panel-box">
        <div class="panel-box-head">
          <div>
            <h3>작물별 세대 육종(실험) 현황</h3>
            <p>주요 작물별 세대 진행 단계(F1~포장)를 한눈에 대조 관찰합니다.</p>
          </div>
          <div style="display:flex; align-items:center; gap:12px; flex-shrink:0;">
            <button class="btn small" onclick="openLineHistoryModal()">계통 이력 조회</button>
            <label style="display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--ink-faint); cursor:pointer;">
              진행중만
              <input type="checkbox" ${showActiveOnlyCrops?'checked':''} onchange="toggleActiveOnlyCrops(this.checked)" />
            </label>
          </div>
        </div>
        <div class="crop-summary-grid">
          ${(()=>{
            // '진행중만'을 켜면 지금 심겨 있는 작물만, 끄면 모든 작물 카드를 보여 준다 (심긴 게 없는 작물은 '등록된 목표 없음'으로 나온다)
            const visible = showActiveOnlyCrops ? CROP_OPTIONS.filter(name=> materials.some(m=>m.name===name && !m.harvest_confirmed_at)) : CROP_OPTIONS;
            return visible.length ? visible.map(cropSummaryCardHtml).join('') : `<div class="empty-materials">표시할 작물이 없어요</div>`;
          })()}
        </div>
      </div>
    </div>
  `;
}
let showActiveOnlyCrops = true;
function toggleActiveOnlyCrops(checked){
  showActiveOnlyCrops = checked;
  renderDetail();   // 작물 카드를 다시 그린다
}

function renderDetail(context){
  context = context || 'space';
  if(context==='work'){ renderWorkView(); return; }   // 계통작성은 3열 화면(renderWorkView)이 따로 그린다
  const wrap = document.getElementById(context==='modal' ? 'roomDetailModalBody' : 'detail');
  const roomId = context==='modal' ? modalRoomId : activeRoomId;
  const room = rooms.find(r=>r.id===roomId);
  if(!room){
    wrap.innerHTML = (context==='space') ? spaceOverviewHtml() : '';
    return;
  }
  const roomMaterials = materials.filter(m=>m.room_id===room.id);

  const fixedCfg = DEFAULT_ROOM_CONFIG[room.name];
  const bedCount = fixedCfg ? fixedCfg.bed_count : (room.structure_count || 0);
  const bedFloors = fixedCfg ? fixedCfg.bed_floors : (room.bed_floors || 2);

  let bodyHtml;
  if(bedCount > 0){
    const colsPerRow = ROOM_COLS_PER_ROW[room.name] || bedCount;

    // 공간뷰: 최소 정보만(계통명/교배조합/목적/규모), 편집·달력·일지 없음
    const spaceGrid = (bedFloors === 2)
      ? spaceBedGroupedGrid(room, roomMaterials, bedCount, colsPerRow)
      : minimalBedGrid(room, roomMaterials, bedCount, bedFloors, colsPerRow);
    bodyHtml = (bedCount > 4) ? spaceGrid : `<div class="space-bed-wrap">${spaceGrid}</div>`;
  } else {
    bodyHtml = roomMaterials.length ? `
      <div class="mini-chip-list">
        ${roomMaterials.map(m=>`<div class="mini-chip"><span class="crop-dot" style="background:${cropColor(m.name)};"></span><div class="mini-chip-text"><div class="mc-line">${escapeHtml(m.name||'-')}</div><div class="mc-sub">${m.quantity!=null? escapeHtml(String(m.quantity))+'개' : '-'}</div></div></div>`).join('')}
      </div>
    ` : `<div class="empty-materials">등록된 재료가 없어요.</div>`;
  }

  const closeAction = context==='modal' ? `closeRoomDetailModal()` : `exitFocusMode()`;
  wrap.innerHTML = `
    <div class="detail-card">
      <div class="detail-head">
        <div>
          <h3 style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            ${escapeHtml(roomLabel(room.name))}
            ${roomStateBadgesHtml(room)}
            ${(room.temperature!=null || (room.light_start && room.light_end)) ? `
              <span style="font-size:12.5px; font-weight:600; color:var(--teal-deep); background:var(--teal-soft); border-radius:7px; padding:4px 12px; display:inline-flex; gap:8px;">
                ${room.temperature!=null ? `${room.temperature}°C` : ''}
                ${room.light_start && room.light_end ? `${lightDurationLabel(room.light_start, room.light_end)}` : ''}
              </span>
            ` : ''}
          </h3>
          <div class="detail-meta">
            ${room.location? `<span>${escapeHtml(room.location)}</span>`:''}
            ${room.manager? `<span>담당자 ${escapeHtml(room.manager)}</span>`:''}
          </div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="btn close-x" onclick="${closeAction}">✕</button>
        </div>
      </div>
      ${roomStateNoticeHtml(room)}
      ${bodyHtml}
      ${roomStateSettingsHtml(room)}
    </div>
  `;
  // 가로로 미는 베드 줄이 있는 방(인공교배실 1)은 팝업을 넓히고 카드 폭을 줄여서 한 화면에 더 많은 베드를 보여 준다
  const wide = !!wrap.querySelector('.struct-cols.scrollable');
  wrap.firstElementChild.classList.toggle('wide-room', wide);
  if(context==='modal'){
    const modalBox = wrap.parentElement;
    // 화면 전체(body)에 zoom:1.10이 걸려 있어 vw도 1.1배로 계산되므로, 팝업이 화면 폭의 92%를 넘지 않게 1.1로 나눈다
    // (폰 화면은 예전 크기를 그대로 둔다)
    const wideBox = wide && window.innerWidth > 640;
    modalBox.style.width = wideBox ? '1100px' : '920px';
    modalBox.style.maxWidth = wideBox ? 'calc(92vw / 1.1)' : '94vw';
    modalBox.style.padding = wideBox ? '12px' : '';
    modalBox.style.maxHeight = wideBox ? 'calc(97vh / 1.1)' : '86vh';   // 위 · 아래 줄을 모두 펼쳐도 한눈에 보이도록 화면 높이를 더 쓴다
  }
}

function spaceBedColumnsHtml(room, roomMaterials, order){
  return order.map(i=>{
    const floor1 = roomMaterials.filter(m=> m.structure_no===i && m.floor==='1층' && !m.harvest_confirmed_at);
    const floor2 = roomMaterials.filter(m=> m.structure_no===i && m.floor==='2층' && !m.harvest_confirmed_at);
    return `
      <div class="struct-col expanded">
        <div class="bed-col-title">베드 ${i}</div>
        <div class="bed-floor-section">
          <div class="bed-floor-label">2층</div>
          ${floor2.length ? floor2.map(b=>spaceBatchCardHtml(b)).join('') : `<div class="empty-chip">등록된 작물이 없어요</div>`}
        </div>
        <div class="bed-floor-section">
          <div class="bed-floor-label">1층</div>
          ${floor1.length ? floor1.map(b=>spaceBatchCardHtml(b)).join('') : `<div class="empty-chip">등록된 작물이 없어요</div>`}
        </div>
      </div>
    `;
  }).join('');
}

function spaceBedGroupedGrid(room, roomMaterials, bedCount, colsPerRow){
  const layout = ROOM_BED_LAYOUT[room.name];
  let topOrder, bottomOrder;
  if(layout){
    topOrder = layout.top; bottomOrder = layout.bottom;
  } else {
    topOrder = []; bottomOrder = [];
    for(let i=1;i<=bedCount;i++){ (i<=colsPerRow ? topOrder : bottomOrder).push(i); }
  }
  return `
    ${structColsWrapper(topOrder, spaceBedColumnsHtml(room, roomMaterials, topOrder))}
    ${innerCorridorHtml(topOrder, bottomOrder, spaceAisleList(room, roomMaterials))}
    ${structColsWrapper(bottomOrder, spaceBedColumnsHtml(room, roomMaterials, bottomOrder))}
  `;
}
// 인공교배실의 통로에 심긴 계통들 (통로가 아닌 방이거나 비어 있으면 빈 목록)
function spaceAisleList(room, roomMaterials){
  if(!AISLE_ROOMS.has(room.name)) return [];
  return roomMaterials.filter(m=> isAisleSpot(m.structure_no) && !m.harvest_confirmed_at);
}

function minimalBedGrid(room, roomMaterials, bedCount, bedFloors, colsPerRow){
  // 베드 하나(한 열)
  const colHtml = (i)=>{
    if(bedFloors===2){
      const floor1 = roomMaterials.filter(m=> m.structure_no===i && m.floor==='1층' && !m.harvest_confirmed_at);
      const floor2 = roomMaterials.filter(m=> m.structure_no===i && m.floor==='2층' && !m.harvest_confirmed_at);
      return `
        <div class="struct-col expanded">
          <div class="bed-col-title">베드 ${i}</div>
          <div class="bed-floor-section">
            <div class="bed-floor-label">2층</div>
            ${floor2.length ? floor2.map(b=>spaceBatchCardHtml(b)).join('') : `<div class="empty-chip">등록된 작물이 없어요</div>`}
          </div>
          <div class="bed-floor-section">
            <div class="bed-floor-label">1층</div>
            ${floor1.length ? floor1.map(b=>spaceBatchCardHtml(b)).join('') : `<div class="empty-chip">등록된 작물이 없어요</div>`}
          </div>
        </div>
      `;
    }
    const batches = roomMaterials.filter(m=> m.structure_no===i && !m.harvest_confirmed_at);
    return `
      <div class="struct-col expanded">
        <div class="bed-col-title">베드 ${i}</div>
        ${batches.length ? batches.map(b=>spaceBatchCardHtml(b)).join('') : `<div class="empty-chip">등록된 작물이 없어요</div>`}
      </div>
    `;
  };

  // 인공교배실(1·2): 베드 줄 사이에 입구 · 통로 띠를 두고, 통로에 계통이 있으면 띠 안에 카드로 보여준다 (인공교배실 1과 같은 모양)
  if(AISLE_ROOMS.has(room.name)){
    const layout = ROOM_BED_LAYOUT[room.name];
    let topOrder, bottomOrder;
    if(layout){ topOrder = layout.top; bottomOrder = layout.bottom; }
    else {
      topOrder = []; bottomOrder = [];
      for(let i=1;i<=bedCount;i++){ (i<=colsPerRow ? topOrder : bottomOrder).push(i); }
    }
    const rowHtml = (order)=> structColsWrapper(order, order.map(colHtml).join(''));
    return `
      ${rowHtml(topOrder)}
      ${innerCorridorHtml(topOrder, bottomOrder, spaceAisleList(room, roomMaterials))}
      ${bottomOrder.length ? rowHtml(bottomOrder) : ''}
    `;
  }

  const many = bedCount > 4;
  const cls = many ? 'struct-cols scrollable' : 'struct-cols';
  const style = many ? '' : ` style="grid-template-columns:repeat(${colsPerRow}, 1fr);"`;
  let cols = '';
  for(let i=1;i<=bedCount;i++) cols += colHtml(i);
  return `<div class="${cls}"${style}>${cols}</div>`;
}

function lightDurationLabel(start, end){
  if(!start || !end) return '';
  const toMin = (t)=>{ const [h,m] = t.split(':').map(Number); return h*60+m; };
  let diff = toMin(end) - toMin(start);
  if(diff < 0) diff += 24*60;
  const h = Math.floor(diff/60), m = diff%60;
  return `${h}시간${m ? m+'분':''}`;
}

function envSettingsHtml(room){
  const t = room.temperature, ls = room.light_start, le = room.light_end;
  if(!isAdmin){
    return '';
  }
  return `
    <div class="env-config" data-room-id="${room.id}">
      <label style="width:80px;">온도
        <div style="position:relative; width:80px;">
          <input type="number" step="0.1" data-env-field="temperature" value="${t ?? ''}" style="padding-right:22px; width:80px; box-sizing:border-box;" />
          <span style="position:absolute; right:9px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:12px; pointer-events:none;">℃</span>
        </div>
      </label>
      <label>점등${hourSelectHtml('light_start', ls)}</label>
      <label>소등${hourSelectHtml('light_end', le)}</label>
      <button class="btn small primary" onclick="saveEnvSettings('${room.id}', this)">저장</button>
    </div>
  `;
}

function hourSelectHtml(field, currentTime){
  const currentHour = currentTime ? currentTime.slice(0,2) : '';
  let opts = '<option value="">-</option>';
  for(let h=0; h<=24; h++){
    const hh = String(h).padStart(2,'0');
    opts += `<option value="${hh}:00" ${currentHour===hh?'selected':''}>${hh}시</option>`;
  }
  return `<select data-env-field="${field}" style="width:80px; box-sizing:border-box;">${opts}</select>`;
}

async function saveEnvSettings(roomId, btnEl){
  if(tourBlockWrite()) return;
  const wrap = btnEl.closest('.env-config');
  const get = (f)=> wrap.querySelector(`[data-env-field="${f}"]`).value;
  const payload = {
    temperature: get('temperature')===''? null : Number(get('temperature')),
    light_start: get('light_start') || null,
    light_end: get('light_end') || null,
    updated_at: new Date().toISOString()
  };
  const { error } = await sb.from('rooms').update(payload).eq('id', roomId);
  if(error){ alert('저장 실패!\n\n' + (error.message||JSON.stringify(error))); return; }
  showToast('저장됐어요');
  await loadAll();
}

// ── 방 상태(정상 · 점검중 · 수리중) · 사용 활성화/비활성화 ─────────────────────────────
// 관리자만 바꿀 수 있고, 표시는 누구에게나 보인다. rooms 테이블의 status · status_note · is_active 컬럼에 저장한다.
// 컬럼이 아직 없으면(값이 undefined) 정상 · 사용 중으로 본다.
const ROOM_STATUSES = ['정상', '점검중', '수리중'];
const ROOM_STATE_SQL = "alter table rooms add column if not exists status text default '정상';\nalter table rooms add column if not exists status_note text;\nalter table rooms add column if not exists is_active boolean default true;\nalter table rooms add column if not exists open_for_use boolean;";
function roomStatusOf(room){ return (room && ROOM_STATUSES.includes(room.status)) ? room.status : '정상'; }
function roomIsActive(room){ return !room || room.is_active !== false; }   // 아직 만들지 않은 방(room 없음)도 사용 중으로 본다
function roomByName(name){ return rooms.find(r=> r.name===name) || null; }
// 방 이름 옆에 붙이는 뱃지: 사용 중지 · 점검중 · 수리중 (정상 · 사용 중이면 아무것도 붙이지 않는다). mini: 작은 배치도용 작은 뱃지
function roomStateBadgesHtml(room, mini){
  if(!room) return '';
  const st = roomStatusOf(room), note = String(room.status_note || '').trim();
  const tip = note ? ` title="${escapeHtml(note)}"` : '';
  const cls = mini ? 'room-state-badge mini' : 'room-state-badge';
  let html = '';
  if(!roomIsActive(room)) html += `<span class="${cls} off"${tip}>사용 중지</span>`;
  if(st === '수리중') html += `<span class="${cls} repair"${tip}>수리중</span>`;
  else if(st === '점검중') html += `<span class="${cls} check"${tip}>점검중</span>`;
  return html;
}
// 방 상세 머리글 아래에 붙이는 안내 줄 (메모가 있거나 사용 중지일 때)
function roomStateNoticeHtml(room){
  if(!room) return '';
  const st = roomStatusOf(room), note = String(room.status_note || '').trim(), off = !roomIsActive(room);
  if(!off && st === '정상' && !note) return '';
  const parts = [];
  if(off) parts.push('<b>사용 중지된 방이에요.</b> 새 계통 등록 · 수요조사 · 계획에서 고를 수 없어요 (심겨 있는 계통 조회 · 수정 · 수확은 할 수 있어요)');
  if(st !== '정상') parts.push(`<b>${st}</b>${note ? ` · ${escapeHtml(note)}` : ''}`);
  else if(note) parts.push(escapeHtml(note));
  return `<div class="room-state-notice ${off ? 'off' : st === '수리중' ? 'repair' : st === '점검중' ? 'check' : ''}">${parts.join('<br>')}</div>`;
}
// 사용 중지된 방에 새로 심으려고 할 때의 안내. 막혔으면 true
function blockInactiveRoom(room){
  if(roomIsActive(room)) return false;
  alert(`${roomLabel(room.name)}은(는) 관리자가 사용 중지한 방이에요.\n새 계통을 등록할 수 없어요. (심겨 있는 계통 조회 · 수정 · 수확은 할 수 있어요)`);
  return true;
}
// 관리자용 방 상태 · 사용 설정 칸 (계통작성 베드 맵 아래 · 종합현황 방 상세에 붙는다)
function roomStateSettingsHtml(room){
  if(!isAdmin || !room) return '';
  const st = roomStatusOf(room);
  // 조사실 · 세대단축실 4처럼 기본은 쓰지 않는 칸: '사용 가능'은 open_for_use(켜야 쓰는 칸)로 저장한다
  const openable = OPENABLE_MUTED_ROOMS.has(room.name);
  const active = openable ? (room.open_for_use === true && roomIsActive(room)) : roomIsActive(room);
  // 도면 기준 베드 구성이 정해지지 않은 방(DEFAULT_ROOM_CONFIG에 없음)은 베드 수 · 층을 관리자가 정한다
  const bedCfgHtml = DEFAULT_ROOM_CONFIG[room.name] ? '' : `
      <label style="width:70px;">베드 수
        <input type="number" min="0" max="30" data-rs-field="structure_count" value="${room.structure_count ?? 0}" style="width:70px; box-sizing:border-box;" />
      </label>
      <label>층
        <select data-rs-field="bed_floors" style="width:72px; box-sizing:border-box;">
          <option value="2" ${(room.bed_floors || 2)===2 ? 'selected' : ''}>2층</option>
          <option value="1" ${room.bed_floors===1 ? 'selected' : ''}>1층</option>
        </select>
      </label>`;
  return `
    <div class="env-config room-state-config" data-room-id="${room.id}">
      <label style="min-width:150px;">표시 이름
        <input data-rs-field="display_label" placeholder="${escapeHtml(ROOM_DISPLAY_LABELS[room.name] || room.name)}" value="${escapeHtml(room.display_label || '')}" title="화면에 보이는 방 이름이에요. 비워 두면 기본 이름(${escapeHtml(ROOM_DISPLAY_LABELS[room.name] || room.name)})으로 보여요" />
      </label>
      <label>방 상태
        <select data-rs-field="status" style="width:96px; box-sizing:border-box;">${ROOM_STATUSES.map(s=> `<option value="${s}" ${s===st ? 'selected' : ''}>${s}</option>`).join('')}</select>
      </label>
      <label style="flex:1; min-width:160px;">메모 (선택)
        <input data-rs-field="status_note" placeholder="예: 냉방기 교체, ~10/20" value="${escapeHtml(room.status_note || '')}" />
      </label>
      ${bedCfgHtml}
      <label class="room-state-toggle" ${openable ? 'title="기본은 쓰지 않는 칸이에요. 켜면 다른 방처럼 계통작성 · 수요조사 · 계획에서 쓸 수 있어요"' : ''}><input type="checkbox" data-rs-field="is_active" ${active ? 'checked' : ''} /> 사용 가능${openable ? ' (기본 미사용 칸)' : ''}</label>
      <button class="btn small primary" onclick="saveRoomState('${room.id}', this)">상태 저장</button>
    </div>`;
}
async function saveRoomState(roomId, btnEl){
  if(tourBlockWrite()) return;
  if(!isAdmin){ alert('방 상태는 전체 관리자만 바꿀 수 있어요.'); return; }
  const wrap = btnEl.closest('.room-state-config');
  const get = (f)=> wrap.querySelector(`[data-rs-field="${f}"]`);
  const room = rooms.find(r=> r.id===roomId);
  const isActive = get('is_active').checked;
  const openable = !!room && OPENABLE_MUTED_ROOMS.has(room.name);
  const usableNow = room && (openable ? !isMutedRoom(room.name) && roomIsActive(room) : roomIsActive(room));
  if(usableNow && !isActive){
    const n = materials.filter(m=> m.room_id===roomId && !m.harvest_confirmed_at).length;
    if(!confirm(`이 방을 사용 중지할까요?\n새 계통 등록 · 수요조사 · 계획에서 이 방을 고를 수 없게 돼요.${n ? `\n(지금 심겨 있는 계통 ${n}개는 그대로 두고, 조회 · 수정 · 수확은 계속할 수 있어요)` : ''}`)) return;
  }
  const payload = {
    status: get('status').value || '정상',
    status_note: get('status_note').value.trim() || null,
    // 기본 미사용 칸은 끄면 예전처럼 흐린 칸으로 돌아간다 ('사용 중지' 뱃지는 붙이지 않는다)
    is_active: openable ? true : isActive,
    updated_at: new Date().toISOString()
  };
  if(openable) payload.open_for_use = isActive;
  // 베드 구성(도면 기준이 없는 방만): 베드 수 0~30, 층 1 · 2
  const cntEl = get('structure_count'), flEl = get('bed_floors');
  if(cntEl){
    const cnt = parseInt(cntEl.value);
    if(!(cnt >= 0 && cnt <= 30)){ alert('베드 수는 0~30 사이로 적어주세요.'); cntEl.focus(); return; }
    payload.structure_count = cnt;
    payload.bed_floors = flEl && flEl.value === '1' ? 1 : 2;
  }
  // 표시 이름: 바뀌었을 때만 보낸다 (컬럼이 아직 없어도 다른 설정은 저장되게)
  const labelEl = get('display_label');
  const newLabel = labelEl ? (labelEl.value.trim() || null) : undefined;
  const labelChanged = labelEl && newLabel !== (String(room?.display_label || '').trim() || null);
  if(labelChanged) payload.display_label = newLabel;
  let { error } = await sb.from('rooms').update(payload).eq('id', roomId);
  if(error && labelChanged && /display_label/.test(error.message||'')){
    delete payload.display_label;
    ({ error } = await sb.from('rooms').update(payload).eq('id', roomId));
    if(!error) alert('다른 설정은 저장됐지만, 표시 이름은 rooms 테이블에 컬럼이 없어 저장되지 않았어요.\n\n(관리자 확인 필요) Supabase SQL Editor에서 아래를 한 번 실행해주세요:\n\n' + ROOM_LABEL_SQL);
  }
  if(error){
    if(/status|is_active|open_for_use/.test(error.message||'')){
      alert('저장 실패: rooms 테이블에 방 상태 컬럼이 아직 없어요.\n\n(관리자 확인 필요) Supabase SQL Editor에서 아래를 한 번 실행해주세요:\n\n' + ROOM_STATE_SQL);
    } else alert('저장 실패!\n\n' + (error.message||JSON.stringify(error)));
    return;
  }
  showToast('방 상태를 저장했어요');
  await loadAll();
}

// ── 계통작성 화면: 시설 배치도 | 실 내부 베드 맵 | 작성 패널 ─────────────────────────────
// 수요조사 화면과 같은 3열 틀이다.
//   ① 배치도에서 방을 고르면  ② 가운데에 그 방의 베드 맵이 나오고
//   ③ 맵에서 자리(베드 · 층)를 누르면 오른쪽에서 그 자리의 계통을 등록 · 수정한다.
function renderWorkView(){
  // 방이 지워졌으면 선택을 푼다
  if(workActiveRoomId && !rooms.some(r=> r.id===workActiveRoomId)){ workActiveRoomId = null; resetWorkMulti(); }
  const room = rooms.find(r=> r.id===workActiveRoomId) || null;
  renderWorkMap(room);
  renderWorkBedPanel(room);
  renderWorkWritePanel(room);
}

function workRoomInfo(room){
  const cfg = DEFAULT_ROOM_CONFIG[room.name];
  const bedCount = cfg ? cfg.bed_count : (room.structure_count || 0);
  const bedFloors = cfg ? cfg.bed_floors : (room.bed_floors || 2);
  return { bedCount, bedFloors, floors: bedFloors===2 ? ['2층','1층'] : ['1층'] };
}
// 한 자리(베드 · 층)에 지금 심겨 있는 계통들. 층이 하나뿐인 방은 층 구분 없이 베드 번호로만 찾는다
function workSpotBatches(room, bedNo, floor){
  const info = workRoomInfo(room);
  return materials.filter(m=> m.room_id===room.id && m.structure_no===bedNo && (info.bedFloors===2 ? m.floor===floor : true) && !m.harvest_confirmed_at);
}

// 배치도의 방 카드 밑에 붙이는 사용 현황 글 ('3계통' · '비어 있음'). 아직 만들지 않은 방이면 null. 계통작성과 수요조사가 함께 쓴다
function roomUseSubText(name){
  const room = rooms.find(r=> r.name===name);
  if(!room) return null;
  const n = materials.filter(m=> m.room_id===room.id && !m.harvest_confirmed_at).length;
  return n ? `${n}계통` : '비어 있음';
}

// ① 시설 공간 배치도
function renderWorkMap(activeRoom){
  const wrap = document.getElementById('workMapPanel');
  if(!wrap) return;
  // 방마다 사용 현황('3계통' · '비어 있음' · 아직 안 만든 방)은 카드 안에 쓰지 않고 마우스를 올리면 보이게 한다 (수요조사와 카드 크기를 맞추려고)
  const tip = (name)=>{
    if(isMutedRoom(name)) return '';
    const use = roomUseSubText(name) ?? (isAdmin ? '+ 방 만들기' : '미등록');
    return `${roomLabel(name)} · ${use}`;
  };
  wrap.innerHTML = `
    <div class="survey-facility-title">시설 공간 배치도</div>
    <div class="survey-facility-hint">방을 누르면 안쪽 베드가 나와요</div>
    ${miniFacilityHtml(activeRoom ? activeRoom.name : null, 'pickWorkRoom', tip)}
  `;
}

// ② 실 내부 베드 맵
function renderWorkBedPanel(room){
  const wrap = document.getElementById('workBedPanel');
  if(!wrap) return;
  if(!room){
    wrap.innerHTML = `<div class="empty-materials" style="padding:60px 20px;">← 왼쪽 배치도에서 방을 선택해주세요</div>`;
    return;
  }
  const info = workRoomInfo(room);
  const hint = !info.bedCount ? '이 방은 베드 구조가 없어요' : '자리를 눌러 여러 개 고르세요 · 베드 이름을 누르면 두 층이 함께 선택돼요';
  const actions = isAdmin ? `<button class="btn small danger-text" onclick="deleteRoom('${room.id}')">방 삭제</button>` : '';
  wrap.innerHTML = `
    ${bedPanelHeadHtml(room, hint, actions, info.bedCount ? { nameNote: '(복수선택가능)' } : {})}
    ${info.bedCount ? workBedMapHtml(room, info) : ''}
    ${bedMapLegendHtml(room)}
    <div style="margin-top:16px;">${envSettingsHtml(room)}${roomStateSettingsHtml(room)}</div>
  `;
}

// 베드 맵 위쪽 머리글: 방 이름 · 온도/일장 · 위치/담당자 + 안내 글. (계통작성과 수요조사가 함께 쓴다)
//  opts.hideEnv: 온도 · 일장 칩을 숨긴다 · opts.nameNote: 방 이름 옆에 붙이는 작은 글 (수요조사)
function bedPanelHeadHtml(room, hint, actionsHtml, opts = {}){
  const envChip = (!opts.hideEnv && (room.temperature!=null || (room.light_start && room.light_end))) ? `
    <span style="font-size:12px; font-weight:600; color:var(--teal-deep); background:var(--teal-soft); border-radius:7px; padding:3px 10px; display:inline-flex; gap:8px;">
      ${room.temperature!=null ? `${room.temperature}°C` : ''}
      ${room.light_start && room.light_end ? lightDurationLabel(room.light_start, room.light_end) : ''}
    </span>` : '';
  const meta = [room.location, room.manager ? `담당자 ${room.manager}` : ''].filter(Boolean).map(escapeHtml).join(' · ');
  return `
    <div class="panel-box-head">
      <div>
        <h3 style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">${escapeHtml(roomLabel(room.name))}${opts.nameNote ? ` <span style="font-size:12.5px; font-weight:800; color:var(--ink);">${escapeHtml(opts.nameNote)}</span>` : ''} ${roomStateBadgesHtml(room)} ${envChip}</h3>
        <p>${meta ? meta + ' · ' : ''}${hint}</p>
      </div>
      <div style="display:flex; align-items:center; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;">${actionsHtml || ''}
      </div>
    </div>
    ${roomStateNoticeHtml(room)}`;
}
// 베드 맵 아래 작물 색 범례 (지금 심겨 있는 작물만)
function bedMapLegendHtml(room){
  if(!room || !room.id) return '';
  const cropNames = [...new Set(materials.filter(m=> m.room_id===room.id && !m.harvest_confirmed_at).map(m=> m.name).filter(Boolean))];
  return cropNames.length ? `
    <div class="crop-legend" style="margin:14px 0 0;">
      ${cropNames.map(n=>`<span class="legend-chip"><span class="legend-dot" style="background:${cropColor(n)};"></span>${escapeHtml(n)}</span>`).join('')}
    </div>` : '';
}

// 계통작성의 베드 맵: 수요조사처럼 늘 여러 자리를 고르는 상태다 (누를 때마다 고름/풀림, 고른 칸에 ✓, 베드 이름을 누르면 두 층이 함께)
function workBedMapHtml(room, info){
  return bedMapHtml(room, info, {
    multi: true,
    isSelected: (bedNo, floor)=> workMultiSpots.has(workSpotKey(bedNo, floor)),
    pickFn: 'toggleWorkMultiSpot',
    bedPickFn: 'toggleWorkMultiBed'
  });
}
// 수요조사의 베드 맵: 계통작성과 같은 모양이고, 늘 여러 자리를 고르는 상태다 (고른 칸에 ✓, 베드 이름을 누르면 두 층이 함께).
// plain: 이미 등록된 계통 · 계획은 그리지 않고 '1층 · 2층' 칸만 보여준다
function surveyBedMapHtml(room, info){
  return bedMapHtml(room, info, {
    plain: true,
    multi: true,
    isSelected: (bedNo, floor)=> surveySelectedBeds.has(bedNo+'|'+floor),
    pickFn: 'selectSurveyBed',
    bedPickFn: 'toggleSurveyBedFloors'
  });
}

// 베드 맵 공통 그리기. 계통작성(workBedMapHtml)과 수요조사(surveyBedMapHtml)가 같은 모양을 쓴다.
//  opts.multi: 여러 자리를 고르는 맵인가 (✓ 표시, 베드 이름 눌러 두 층 선택) · opts.isSelected(bedNo, floor): 고른 칸인가
//  opts.pickFn: 칸을 눌렀을 때 부를 함수 이름 · opts.bedPickFn: 베드 이름을 눌렀을 때 부를 함수 이름
//  opts.plain: 심긴 계통 · 계획 없이 층 이름만 있는 칸으로 그린다 (수요조사)
function bedMapHtml(room, info, opts){
  const multi = !!opts.multi, plain = !!opts.plain;
  const colsPerRow = ROOM_COLS_PER_ROW[room.name] || info.bedCount;
  const layout = ROOM_BED_LAYOUT[room.name];
  let topOrder, bottomOrder;
  if(layout){ topOrder = layout.top; bottomOrder = layout.bottom; }
  else {
    topOrder = []; bottomOrder = [];
    for(let i=1;i<=info.bedCount;i++){ (i<=colsPerRow ? topOrder : bottomOrder).push(i); }
  }
  // 한 칸 = 한 베드의 한 층: 심긴 계통 이름 + 수확 D-day. 비어 있으면 '빈 자리'(분기별 계획이 있으면 📅)
  // aisle=true: 인공교배실의 통로. 베드 사이 띠 전체가 하나의 자리(버튼)이고, 입구는 왼쪽 끝에 둔다
  const slot = (bedNo, floor, aisle = false)=>{
    const list = plain ? [] : workSpotBatches(room, bedNo, floor);
    const selected = opts.isSelected(bedNo, floor);
    const floorLabel = (!aisle && !plain && info.bedFloors===2) ? `<span class="wbed-floor">${floor}</span>` : '';
    const check = (multi && selected) ? `<span class="wbed-check">✓</span>` : '';
    const entrance = aisle ? `<span class="survey-bed-entrance">입구</span>` : '';
    const attrs = `onclick="${opts.pickFn}(${bedNo}, '${floor}')"`;
    if(!list.length){
      const planned = plain ? [] : bedPlansAt(room.name, bedNo, floor).filter(x=> x.when!=='past');
      const tip = plain ? (aisle ? '통로도 선택할 수 있어요' : '') : planned.length ? `계획 있음 · ${planTitleText(planned[0].p)}` : (aisle ? '통로 · 빈 자리' : '빈 자리');
      return `
        <button type="button" class="wbed-slot ${aisle ? 'aisle' : ''} empty ${selected ? 'selected' : ''}" ${attrs}${tip ? ` title="${escapeHtml(tip)}"` : ''}>
          ${check}${entrance}${floorLabel}
          <span class="wbed-main" style="color:var(--ink-faint);">${aisle ? '통로(선택가능)' : plain ? floor : '빈 자리'}</span>
          ${planned.length ? `<span class="wbed-sub"><span class="wbed-chip plan">📅 계획</span></span>` : ''}
        </button>`;
    }
    const b = list[0];
    const color = cropColor(b.name);
    const nextHarvest = list.filter(m=> m.harvest_date).sort((x, y)=> x.harvest_date.localeCompare(y.harvest_date))[0];
    const stat = nextHarvest ? workRowStatus(nextHarvest.harvest_date) : null;
    const tip = list.map(m=> [batchTitleOf(m), (m.name && m.name !== batchTitleOf(m)) ? m.name : '', m.generation].filter(Boolean).join(' · ')).join('\n');
    const chips = [
      list.some(m=> m.record_type==='heat_test') ? `<span class="wbed-chip heat">고온검정</span>` : '',
      list.some(m=> batchPurposeOf(m)==='인공교배') ? `<span class="wbed-chip cross">인공교배</span>` : '',
      list.some(m=> batchPurposeOf(m)==='기타') ? `<span class="wbed-chip etc">기타</span>` : '',
      stat ? `<span class="wbed-chip" style="${stat.style}">${stat.label}</span>` : ''
    ].join('');
    // 재료가 있는 칸에는 늘 '사용중 N' 뱃지를 붙인다 (계통번호 줄 아래 뱃지 줄 맨 앞). 고르면 칸 전체가 주황 테두리로 바뀐다
    const usedChip = `<span class="wbed-chip used">사용중 ${list.length}</span>`;
    return `
      <button type="button" class="wbed-slot filled ${aisle ? 'aisle' : ''} ${selected ? 'selected' : ''}" ${attrs} title="${escapeHtml(tip)}">
        ${check}${entrance}${floorLabel}
        <span class="wbed-main">
          <span class="crop-dot" style="background:${color}; width:9px; height:9px;"></span>
          <span class="wbed-name" style="color:${color};">${escapeHtml(batchTitleOf(b))}</span>
          ${list.length>1 ? `<span class="wbed-more">외 ${list.length-1}</span>` : ''}
        </span>
        <span class="wbed-sub">${usedChip}${chips}</span>
      </button>`;
  };
  const col = (bedNo)=> `
    <div class="survey-bed-col">
      <div class="survey-bed-col-title ${multi ? 'wbed-title-pick' : ''}" ${multi ? `onclick="${opts.bedPickFn}(${bedNo})" title="${info.bedFloors===2 ? '두 층을 함께 선택 · 해제' : '선택 · 해제'}"` : ''}>베드 ${bedNo}</div>
      ${info.floors.map(fl=> slot(bedNo, fl)).join('')}
    </div>`;
  const grid = (order)=> `<div class="survey-bed-grid">${order.map(col).join('')}</div>`;
  // 통로 띠: 입구는 왼쪽 끝, 통로는 가운데. 인공교배실 1·2는 이 띠가 하나의 자리라서 눌러서 계통을 등록할 수 있다
  const corridor = AISLE_ROOMS.has(room.name)
    ? slot(AISLE_BED_NO, AISLE_FLOOR, true)
    : `<div class="survey-bed-corridor"><span class="survey-bed-entrance">입구</span>통&nbsp;&nbsp;로</div>`;
  return grid(topOrder) + (bottomOrder.length ? `${corridor}${grid(bottomOrder)}` : '');
}

// ③ 작성 패널: 선택한 자리의 계통 카드(편집 · 수확 · 복사 · 삭제)와 집단 추가
function renderWorkWritePanel(room){
  const wrap = document.getElementById('workRoomDetail');
  if(!wrap) return;
  renderWorkHarvestPanel(room);
  // 집단 추가 · 복사 입력칸이 열려 있으면 그대로 둔다. 다른 사람이 저장해서 화면이 다시 그려져도 입력하던 내용이 지워지지 않게 하려는 것.
  // (다른 방이나 자리를 눌러 선택이 바뀌었으면 입력칸을 닫고 아래에서 평소 패널을 그린다)
  if(batchCompose){
    if(room && batchCompose.auto){
      // 자리를 눌러 저절로 열린 입력칸: 자리를 더 누르거나 빼도 입력하던 내용은 두고 자리 목록 · 개체수 칸만 맞춘다
      // (같은 방에서 아직 입력칸이 열려야 하는 선택일 때만. 계통이 있는 자리 하나만 남았거나 방이 바뀌면 닫는다)
      if(batchCompose.roomId===room.id && workAutoComposeWanted(room) && wrap.querySelector('.batch-compose')){ refreshWorkMultiCompose(room); return; }
    } else if(room && batchCompose.sig===workSelectionSig() && wrap.querySelector('.batch-compose')) return;
    batchCompose = null;
  }
  if(!room){
    wrap.innerHTML = `<div class="empty-materials" style="padding:60px 20px;">방을 선택하면 여기서<br>재료를 등록 · 수정할 수 있어요</div>`;
    return;
  }
  const info = workRoomInfo(room);
  if(!info.bedCount){
    // 베드 구조가 없는 방: 재료 표로 관리
    const roomMaterials = materials.filter(m=> m.room_id===room.id);
    wrap.innerHTML = `
      <div class="panel-box-head"><div><h3>${escapeHtml(roomLabel(room.name))}</h3><p>재료 표</p></div></div>
      ${roomMaterials.length ? `
      <table>
        <thead>
          <tr>
            <th style="width:26%">재료명</th>
            <th style="width:22%">수량</th>
            <th style="width:18%">보관 위치</th>
            <th style="width:14%">유통기한</th>
            <th style="width:12%">담당자</th>
            ${isAdmin ? '<th style="width:8%"></th>' : ''}
          </tr>
        </thead>
        <tbody>${roomMaterials.map(m=>materialRow(m)).join('')}</tbody>
      </table>` : `<div class="empty-materials">등록된 재료가 없어요.${isAdmin?' 아래 버튼으로 추가해보세요.':''}</div>`}
      ${isAdmin ? `<button class="add-row-btn" onclick="addMaterial('${room.id}')">+ 재료 추가</button>` : ''}
    `;
    return;
  }
  // 빈 자리를 누르거나 두 자리 이상 골랐으면 바로 작성 칸(자리마다 개체수 칸), 계통이 있는 자리 하나만 골랐으면 그 자리의 계통 카드, 아무것도 안 골랐으면 안내
  if(workAutoComposeWanted(room)){ openBatchLocationModal(room.id, null, { multi: workMultiTargets() }); return; }
  const roomOff = !roomIsActive(room);
  const offNote = roomOff ? `<div class="room-state-notice off">사용 중지된 방이라 새 계통은 등록할 수 없어요. 심겨 있는 계통 조회 · 수정 · 수확은 할 수 있어요.</div>` : '';
  // 사용 중지된 방에서 여러 자리를 골랐으면: 작성 칸 대신 사용중 상자와 [한번에 수확]만 보여 준다
  if(roomOff && workMultiSpots.size > 1){
    const targets = workMultiTargets();
    wrap.innerHTML = `
      <div class="panel-box-head"><div><h3>선택한 자리 ${targets.length}곳</h3><p>${escapeHtml(roomLabel(room.name))}</p></div></div>
      ${offNote}
      ${workMultiLocationHtml(room, targets)}`;
    return;
  }
  const spot = workOnlySpot();
  if(!spot){
    wrap.innerHTML = `
      <div class="panel-box-head"><div><h3>작성</h3><p>가운데 베드 맵에서 자리를 선택해주세요 (여러 개 선택 가능)</p></div></div>
      <div class="empty-materials" style="padding:36px 20px;">베드와 층을 선택해주세요 (여러 개 선택 가능)</div>`;
    return;
  }
  const list = workSpotBatches(room, spot.bedNo, spot.floor);
  const addBtn = (canWriteMaterials() && !roomOff) ? `<button class="add-batch-btn" onclick="confirmAddBatch('${room.id}', ${spot.bedNo}, '${spot.floor}', true)">+ 집단 추가</button>` : '';
  // 접힌 계통 카드는 위 주황 상자와 내용이 겹쳐서 그리지 않는다 ([수확] · [편집] 버튼은 상자의 각 줄로 옮겼다).
  // [편집]을 눌러 펼친 카드와, 아직 내용이 비어 있는 카드(바로 입력 양식)는 저장 · 복사 · 삭제를 해야 하므로 그대로 보여 준다.
  const editCards = canWriteMaterials() ? list.filter(b=> expandedBatchIds.has(b.id) || !(b.name || b.line_no)).map(b=> batchCardHtml(b)).join('') : '';
  wrap.innerHTML = `
    <div class="panel-box-head">
      <div>
        <h3>${isAisleSpot(spot.bedNo) ? '통로' : `베드 ${spot.bedNo}${info.bedFloors===2 ? ` · ${escapeHtml(spot.floor)}` : ''}`}</h3>
        <p>${escapeHtml(roomLabel(room.name))} · ${list.length ? `계통 ${list.length}개` : '비어 있는 자리'}</p>
      </div>
      ${list.length ? `<span class="wbed-chip used" style="flex-shrink:0; font-size:11px; padding:3px 10px;">사용중 ${list.length}</span>` : ''}
    </div>
    ${offNote}
    <div style="margin-bottom:12px;">${workSpotOccupancyHtml(room, [spot], { actions: true })}</div>
    ${list.length ? editCards + addBtn : `<div class="empty-chip">등록된 작물이 없어요</div>`}
  `;
}
// 수확 완료 목록: 작성 칸(#workRoomDetail) 아래의 따로 떨어진 칸에 그린다. 방을 안 골랐거나 작성 권한이 없으면 칸을 숨긴다.
function renderWorkHarvestPanel(room){
  const box = document.getElementById('workHarvestPanel');
  if(!box) return;
  const html = room ? recentHarvestedHtml(room.id) : '';
  box.innerHTML = html;
  box.style.display = html ? '' : 'none';
}
// 자리를 눌러서 작성 칸이 저절로 열려야 하는 선택인지: 두 자리 이상 골랐거나, 비어 있는 자리 하나를 골랐을 때
// (계통이 있는 자리 하나는 그 자리의 계통 카드를 보여주고, 더 심으려면 [+ 집단 추가]를 누른다)
function workAutoComposeWanted(room){
  if(!canWriteMaterials()) return false;
  if(!roomIsActive(room)) return false;   // 사용 중지된 방은 작성 칸을 열지 않는다 (조회 · 수확만)
  if(workMultiSpots.size > 1) return true;
  const only = workOnlySpot();
  return !!only && workSpotBatches(room, only.bedNo, only.floor).length === 0;
}

function innerCorridorHtml(topOrder, bottomOrder, aisleList){
  // 인공교배실의 통로에 계통이 있으면, 띠 안에 입구 · 통로 이름표와 계통 카드를 함께 담는다
  if(aisleList && aisleList.length){
    return `
      <div class="inner-corridor aisle-filled">
        <div class="aisle-head">
          <span class="entrance-label">입구</span>
          <span class="corridor-text">통&nbsp;&nbsp;로</span>
          <span class="aisle-count">${aisleList.length}집단</span>
        </div>
        ${structColsWrapper(aisleList, aisleList.map(b=> `<div class="struct-col expanded">${spaceBatchCardHtml(b)}</div>`).join(''))}
      </div>`;
  }
  return `
    <div class="inner-corridor">
      <span class="entrance-label">입구</span>
      <span class="corridor-text">통&nbsp;&nbsp;로</span>
    </div>
  `;
}

function structColsWrapper(items, innerHtml){
  const many = items.length > 4;
  const cls = many ? 'struct-cols scrollable' : 'struct-cols';
  const style = many ? '' : ` style="grid-template-columns:repeat(${items.length}, 1fr);"`;
  return `<div class="${cls}"${style}>${innerHtml}</div>`;
}

// ── 수확 완료 목록 ────────────────────────────────────────────────────────────
// 수확 · 사용 · 실험 · 검정을 마치고 자리를 비운 계통의 기록이다. 날짜별로 묶어서 보여 주고,
// [세대진전](세대단축) 또는 [다시 심기](고온검정 · 기타 실험)를 누르면 같은 내용으로 새 자리에 심는 입력칸이 열린다. 인공교배는 '사용 완료'로 끝난다.
const HARVEST_LIST_LIMIT = 8;      // 처음에 보여 주는 기록 수 (나머지는 '더 보기')
let harvestShowAll = false;
const WEEKDAYS_KO = ['일','월','화','수','목','금','토'];
// 'YYYY-MM-DD' → 날짜 묶음 제목: { main:'오늘' | '어제' | '10월 1일 (수)', sub:'10월 5일 (일)' | '4일 전' }
function harvestDateParts(ymd){
  const [y, m, d] = ymd.split('-').map(Number);
  const text = `${m}월 ${d}일 (${WEEKDAYS_KO[new Date(y, m-1, d).getDay()]})`;
  const ago = daysBetween(ymd, todayKST());
  if(ago <= 0) return { main:'오늘', sub:text };
  if(ago === 1) return { main:'어제', sub:text };
  return { main:text, sub: ago < 31 ? `${ago}일 전` : `${Math.floor(ago/30)}개월 전` };
}
// 수확 완료한 계통의 다음 행동: 세대단축은 [세대진전], 인공교배는 '사용 완료'로 끝(이어서 심지 않는다), 고온검정 · 기타 실험은 [다시 심기]
function harvestActionOf(m){ const k = batchPurposeOf(m); return k==='세대단축' ? 'advance' : k==='인공교배' ? 'end' : 'replant'; }
// 기록 한 줄: 계통번호(크게) · 작물 · 목적 뱃지 / 자리 · 세대 · 교배조합 · 목적 · 규모. 적혀 있는 것만 보여 준다 (inert면 눌러지지 않는 예시)
function harvestRowHtml(m, inert){
  const e = escapeHtml, kind = batchPurposeOf(m), cross = kind==='인공교배';
  const color = cropColor(m.name);
  // 인공교배는 계통번호가 없어서 교배조합이 이름이다
  const title = m.line_no || (cross ? crossComboLabel(m) : '') || m.name || '(계통번호 없음)';
  const cropText = (m.name && m.name !== title) ? m.name : '';
  const badge = { '인공교배':['cross','인공교배'], '고온검정':['heat','고온검정'], '기타':['etc','기타 실험'] }[kind];
  const loc = isAisleSpot(m.structure_no) ? '통로' : `베드 ${m.structure_no ?? '-'} · ${m.floor || '-'}`;
  const meta = [];
  if(kind==='고온검정' || kind==='기타'){
    if(m.purpose) meta.push(m.purpose);
    if(m.test_condition) meta.push(m.test_condition);
  } else {
    if(m.generation) meta.push(m.generation);
    if(m.cross_combo && !(cross && title===crossComboLabel(m))) meta.push(crossComboLabel(m));
    if(m.purpose) meta.push(m.purpose);
  }
  if(m.quantity != null) meta.push(`${Number(m.quantity).toLocaleString()}개체`);
  const btn = (cls, text, handler, tip)=> inert
    ? `<button type="button" class="${cls}" disabled>${text}</button>`
    : `<button type="button" class="${cls}" onclick="${handler}('${m.id}')"${tip ? ` title="${tip}"` : ''}>${text}</button>`;
  const act = harvestActionOf(m);
  const mainAction = act === 'advance' ? btn('hv-replant', '세대진전', 'advanceHarvested', '다음 세대로 새 자리에 심어요 (세대 칸을 고쳐주세요)')
    : act === 'end' ? '<span class="hv-done">✓ 사용 완료</span>'   // 인공교배는 사용 완료로 끝난다 (이어서 심는 버튼이 없다)
    : btn('hv-replant', '다시 심기', 'replantHarvested', '이 계통과 같은 내용으로 새 자리에 심어요');
  return `
    <div class="hv-row">
      <div class="hv-main">
        <div class="hv-title"><span class="crop-dot" style="background:${color}; width:9px; height:9px;"></span><b style="color:${color};">${e(title)}</b>${cropText ? `<span class="hv-crop">${e(cropText)}</span>` : ''}${badge ? `<span class="wbed-chip ${badge[0]}">${badge[1]}</span>` : ''}</div>
        <div class="hv-meta"><span class="hv-loc">${e(loc)}</span>${meta.map(x=> `<span>${e(x)}</span>`).join('')}</div>
      </div>
      <div class="hv-act">
        ${mainAction}
        ${btn('hv-del', '삭제', 'deleteHarvestRecord', '이 기록을 목록에서 지워요')}
      </div>
    </div>`;
}
function recentHarvestedHtml(roomId){
  if(!canWriteMaterials()) return '';
  const all = materials
    .filter(m=> m.room_id===roomId && m.harvest_confirmed_at && !m.replanted_at)   // 세대진전 · 다시 심기로 이미 등록한 계통은 뺀다
    .sort((a,b)=> (b.harvest_confirmed_at||'').localeCompare(a.harvest_confirmed_at||''));
  const head = `<div class="work-section-title">수확 완료 목록 <span class="hv-count">${all.length}건</span></div>`;
  if(!all.length){
    return `
    <div class="work-section hv-section">
      ${head}
      <div class="hv-empty">아직 수확 완료한 계통이 없어요.<br>계통 카드의 <b>수확</b>을 누르면 여기에 기록돼요.</div>
    </div>`;
  }
  // 한번에 세대진전할 수 있게 묶인 기록은 위 묶음 칸에만 보여 준다 ([자세히 보기]를 눌러야 하나씩 나온다)
  const bulkGroups = harvestAdvanceGroups(all);
  const groupedIds = new Set(bulkGroups.flat().map(m=> m.id));
  const singles = all.filter(m=> !groupedIds.has(m.id));
  // 날짜(한국 시간)별로 묶는다
  const shown = harvestShowAll ? singles : singles.slice(0, HARVEST_LIST_LIMIT);
  const groups = [];
  shown.forEach(m=>{
    const date = kstDateOfTimestamp(m.harvest_confirmed_at);
    let g = groups[groups.length - 1];
    if(!g || g.date !== date){ g = { date, items: [] }; groups.push(g); }
    g.items.push(m);
  });
  const rest = singles.length - HARVEST_LIST_LIMIT;
  const actions = new Set(all.map(harvestActionOf));
  const hintHtml = [
    actions.has('advance') ? '<b>세대진전</b>을 누르면 다음 세대로 새 자리에 심어요.' : '',
    actions.has('replant') ? '<b>다시 심기</b>는 같은 내용으로 새 자리에 심어요.' : ''
  ].filter(Boolean).join(' ');
  return `
    <div class="work-section hv-section">
      ${head}
      ${hintHtml ? `<p class="hv-hint">${hintHtml}</p>` : ''}
      ${harvestBulkAdvanceHtml(bulkGroups)}
      ${groups.map(g=>{
        const d = harvestDateParts(g.date);
        return `
        <div class="hv-date"><b>${d.main}</b><span>${d.sub}</span><i>${g.items.length}건</i></div>
        ${g.items.map(m=> harvestRowHtml(m)).join('')}`;
      }).join('')}
      ${rest > 0 ? `<button type="button" class="hv-more" onclick="toggleHarvestMore()">${harvestShowAll ? '접기' : `이전 기록 ${rest}건 더 보기`}</button>` : ''}
    </div>`;
}
// ── 수확 완료 목록 → 한번에 세대진전 ──
// 묶는 기준: 세대단축 기록 중 작물 · 세대가 같고, 계통번호가 같거나 교배목적이 같은 것끼리 (A-B 계통번호 같음, B-C 교배목적 같음이면 A·B·C 한 묶음)
function harvestAdvanceGroups(list){
  const items = list.filter(m=> harvestActionOf(m)==='advance' && !m.replanted_at);
  const t = (v)=> String(v ?? '').trim();
  const parent = items.map((_, i)=> i);
  const find = (i)=> parent[i]===i ? i : (parent[i] = find(parent[i]));
  for(let i = 0; i < items.length; i++){
    for(let j = i + 1; j < items.length; j++){
      const a = items[i], b = items[j];
      if(t(a.name) !== t(b.name) || t(a.generation) !== t(b.generation)) continue;
      const sameLine = t(a.line_no) && t(a.line_no) === t(b.line_no);
      const samePurpose = t(a.purpose) && t(a.purpose) === t(b.purpose);
      if(sameLine || samePurpose) parent[find(i)] = find(j);
    }
  }
  const map = new Map();
  items.forEach((m, i)=>{ const r = find(i); if(!map.has(r)) map.set(r, []); map.get(r).push(m); });
  return [...map.values()].filter(g=> g.length > 1);   // 1건짜리는 각 줄의 [세대진전]만 쓴다
}
// 묶음마다 한 줄 + [자세히 보기]를 누르면 묶인 기록이 하나씩 펼쳐진다 (펼친 묶음은 다시 그려도 펼친 채로 둔다)
const harvestOpenGroups = new Set();
function harvestBulkAdvanceHtml(groups){
  if(!groups.length) return '';
  const e = escapeHtml, t = (v)=> String(v ?? '').trim();
  const rows = groups.map(g=>{
    const f = g[0];
    const same = (k)=> g.every(m=> t(m[k]) === t(f[k])) ? t(f[k]) : '';
    const key = same('line_no') ? `계통번호 ${same('line_no')}` : same('purpose') ? `교배목적 ${same('purpose')}` : '계통번호 · 교배목적 일부 같음';
    // 계통번호가 모두 같으면 위 줄(계통번호 ○○)에 이미 나오므로 이름 목록은 생략하고, 다르면 겹치지 않게 한 번씩만
    const names = same('line_no') ? [] : [...new Set(g.map(m=> m.line_no || crossComboLabel(m) || m.name || '(계통번호 없음)'))];
    const gid = g.map(m=> m.id).sort().join(',');
    const open = harvestOpenGroups.has(gid);
    return `<div class="hv-bulk-group">
      <div class="hv-bulk-row">
        <div class="hv-bulk-text"><b style="color:${cropColor(f.name)};">${e(f.name || '')}</b> · ${e(f.generation || '세대 없음')} · ${e(key)} · <b>${g.reduce((s, m)=> s + (Number(m.quantity)||0), 0).toLocaleString()}개체</b>
          ${names.length ? `<span title="${e(names.join(', '))}">${e(names.join(', '))}</span>` : ''}</div>
        <button type="button" class="hv-bulk-toggle" onclick="toggleHarvestGroup(this, '${gid}')">${open ? '접기 ▲' : '자세히 보기 ▼'}</button>
        <button type="button" class="hv-replant" onclick="advanceHarvestedBulk('${g.map(m=> m.id).join(',')}')">${g.length}건 한번에 세대진전</button>
      </div>
      <div class="hv-bulk-detail"${open ? '' : ' hidden'}>${g.map(m=> harvestRowHtml(m)).join('')}</div>
    </div>`;
  }).join('');
  return `<div class="hv-bulk">${rows}</div>`;
}
function toggleHarvestGroup(btn, gid){
  const detail = btn.closest('.hv-bulk-group').querySelector('.hv-bulk-detail');
  const open = detail.hidden;
  detail.hidden = !open;
  btn.textContent = open ? '접기 ▲' : '자세히 보기 ▼';
  if(open) harvestOpenGroups.add(gid); else harvestOpenGroups.delete(gid);
}
// [N건 한번에 세대진전]: 세대진전 작성 칸 하나를 열어 공통 내용(세대 · 시작일 등)은 한 번만 적고, 심을 위치 · 개체수는 기록마다 따로 받는다.
// 심을 자리는 미리 골라 둔다: 원래 자리가 비어 있으면 원래 자리, 아니면 방의 빈 자리를 차례로 (이미 다른 기록에 배정한 자리는 건너뛴다)
const BULK_KEEP_TEXT = '(계통마다 원래 값 유지)';
function advanceHarvestedBulk(idsCsv){
  const records = String(idsCsv).split(',').map(id=> materials.find(m=> m.id===id)).filter(m=> m && !m.replanted_at);
  if(records.length < 2){ if(records[0]) advanceHarvested(records[0].id); return; }
  const room = rooms.find(r=> r.id===records[0].room_id);
  if(!room) return;
  const info = workRoomInfo(room);
  const taken = new Set();
  const free = (s)=> !!s && s.bedNo != null && !taken.has(workSpotKey(s.bedNo, s.floor)) && workSpotBatches(room, s.bedNo, s.floor).length === 0;
  const spots = records.map(r=>{
    const original = r.structure_no != null ? { bedNo: r.structure_no, floor: r.floor } : null;
    let spot = free(original) ? original : null;
    for(let bedNo = 1; bedNo <= info.bedCount && !spot; bedNo++){
      for(const floor of [...info.floors].reverse()){ if(free({ bedNo, floor })){ spot = { bedNo, floor }; break; } }
    }
    spot = spot || original || { bedNo: 1, floor: info.floors[info.floors.length - 1] };
    taken.add(workSpotKey(spot.bedNo, spot.floor));
    return spot;
  });
  // 기록마다 값이 다른 칸(계통번호 · 교배조합 · 교배목적 · 담당자)은 공통 칸에서 고치지 않고, 저장할 때 기록마다 원래 값을 그대로 쓴다
  const t = (v)=> String(v ?? '').trim();
  const diffKeys = ['line_no', 'cross_combo', 'cross_extra', 'purpose', 'manager', 'test_condition'].filter(k=> records.some(r=> t(r[k]) !== t(records[0][k])));
  const prefill = { ...records[0], sowing_date: todayKST(), harvest_date: null, quantity: null };
  diffKeys.filter(k=> k !== 'test_condition' && k !== 'cross_extra').forEach(k=>{ prefill[k] = BULK_KEEP_TEXT; });
  if(diffKeys.includes('cross_extra')) prefill.cross_extra = null;   // 숫자 칸은 비워 두고, 저장할 때 기록마다 원래 값을 쓴다
  openBatchLocationModal(room.id, prefill, null, { replant: true, advance: true, bulk: { records, spots, diffKeys } });
}
// 한번에 세대진전 작성 칸의 '심을 위치' 줄들
function bulkAdvanceLocHtml(room, records, spots){
  const info = workRoomInfo(room), e = escapeHtml;
  let bedOptions = '';
  for(let i = 1; i <= info.bedCount; i++) bedOptions += `<option value="${i}">베드 ${i}</option>`;
  if(AISLE_ROOMS.has(room.name)) bedOptions += `<option value="${AISLE_BED_NO}">통로</option>`;
  return `
    <label style="font-size:11px; color:var(--ink-faint); font-weight:700; display:block; margin-bottom:6px;">심을 위치 · 개체수 (계통마다)</label>
    <div class="bulk-adv-list">
      ${records.map((r, i)=>{
        const s = spots[i];
        const title = r.line_no || crossComboLabel(r) || r.name || '(계통번호 없음)';
        const from = r.structure_no != null ? `원래 ${spotText(r.structure_no, r.floor)}` : '';
        return `<div class="bulk-adv-row" data-src="${r.id}">
          <div class="bulk-adv-top">
            <div class="bulk-adv-name"><span class="crop-dot" style="background:${cropColor(r.name)}; width:8px; height:8px;"></span><span style="color:${cropColor(r.name)};">${e(title)}</span>${from ? `<small>${e(from)}</small>` : ''}</div>
            <input type="number" min="0" inputmode="numeric" data-bulk-qty placeholder="개체수" value="${r.quantity ?? ''}" />
          </div>
          <div class="bulk-adv-loc">
            <select data-bulk-bed onchange="syncBulkLocFloor(this, ${info.bedFloors})">${bedOptions.replace(`value="${s.bedNo}"`, `value="${s.bedNo}" selected`)}</select>
            <select data-bulk-floor>${locFloorOptionsHtml(s.bedNo, info.bedFloors).replace(`value="${s.floor}"`, `value="${s.floor}" selected`)}</select>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}
function syncBulkLocFloor(bedSel, bedFloors){
  const floorSel = bedSel.parentElement.querySelector('[data-bulk-floor]');
  if(!floorSel) return;
  const keep = floorSel.value;
  floorSel.innerHTML = locFloorOptionsHtml(parseInt(bedSel.value), bedFloors);
  if([...floorSel.options].some(o=> o.value===keep)) floorSel.value = keep;
}
// 한번에 세대진전 저장: 공통 칸은 한 번 읽고, 기록마다 새 계통 한 줄씩 만든다. 저장되면 묶인 원래 기록 모두에 replanted_at을 남긴다
async function submitBulkAdvance(){
  const bulk = batchCompose && batchCompose.bulk;
  if(!bulk) return;
  const fieldsRoot = document.getElementById('batchLocFields');
  const problem = validateBatchForm(fieldsRoot);
  if(problem){
    alert(problem.msg);
    if(problem.el){ problem.el.focus(); if(problem.el.scrollIntoView) problem.el.scrollIntoView({ block:'center', behavior:'smooth' }); }
    return;
  }
  const rowsEl = [...document.querySelectorAll('#batchLocLocation .bulk-adv-row')];
  const items = [];
  for(const el of rowsEl){
    const rec = bulk.records.find(r=> r.id===el.dataset.src);
    if(!rec) continue;
    const bedNo = parseInt(el.querySelector('[data-bulk-bed]').value), floor = el.querySelector('[data-bulk-floor]').value;
    const qtyEl = el.querySelector('[data-bulk-qty]');
    if(qtyEl.value === '' || !(Number(qtyEl.value) > 0)){
      alert(`${rec.line_no || crossComboLabel(rec) || rec.name || '계통'}의 개체수를 입력해주세요.`);
      qtyEl.focus(); return;
    }
    items.push({ rec, bedNo, floor, qty: Number(qtyEl.value) });
  }
  if(!items.length) return;
  const form = readBatchForm(fieldsRoot);
  const payload = form.payload;
  if(!payload.name){ alert('작물을 선택해주세요.'); return; }
  const occupied = items.filter(x=> materials.some(m=> m.room_id===batchLocModalRoomId && m.structure_no===x.bedNo && m.floor===x.floor && !m.harvest_confirmed_at));
  if(occupied.length && !confirm(`${occupied.map(x=> spotText(x.bedNo, x.floor)).join(', ')}에는 이미 등록된 작물이 있어요.\n그래도 새로 추가할까요?`)) return;
  const keys = items.map(x=> workSpotKey(x.bedNo, x.floor));
  if(new Set(keys).size !== keys.length && !confirm('같은 자리에 두 계통 이상을 심게 돼요. 그래도 등록할까요?')) return;
  const needsPurposeCol = form.purpose==='인공교배' || form.purpose==='기타';
  if(needsPurposeCol) payload.use_purpose = form.purpose;
  // 기록마다 다른 칸: 공통 칸에 '(계통마다 원래 값 유지)'가 그대로 있으면 기록의 원래 값을 쓴다
  //  (온도 · 일장 같은 숨은 조건(test_condition)은 사용 목적을 세대단축 그대로 둘 때만 기록마다 원래 값을 쓴다)
  //  ('외 N조합'(cross_extra)은 숫자 칸이라 잠가 둘 수 없어서, 기록마다 다르면 사용 목적이 인공교배일 때 기록마다 원래 값을 쓴다)
  const keepVal = (k, rec)=> (k==='test_condition' ? form.purpose==='세대단축' : k==='cross_extra' ? form.purpose==='인공교배' : payload[k] === BULK_KEEP_TEXT) ? (rec[k] ?? null) : payload[k];
  let rows = items.map(x=>{
    const row = { room_id: batchLocModalRoomId, structure_no: x.bedNo, floor: x.floor, ...payload, quantity: x.qty };
    bulk.diffKeys.forEach(k=>{ if(k in row || k==='test_condition') row[k] = keepVal(k, x.rec); });
    return tidyCrossExtra(row);
  });
  const submitBtn = document.querySelector('#workRoomDetail .batch-compose-actions .primary');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '등록 중…'; }
  let { error } = await sb.from('materials').insert(rows);
  let purposeDropped = false, crossDropped = false;
  for(let tries = 0; error && tries < 2; tries++){
    if(needsPurposeCol && !purposeDropped && /use_purpose/.test(error.message||'')){
      rows = rows.map(r=>{ const c = { ...r }; delete c.use_purpose; return c; });
      purposeDropped = true;
    } else if(!crossDropped && isCrossExtraColError(error)){
      rows = stripCrossExtra(rows);
      crossDropped = true;
    } else break;
    ({ error } = await sb.from('materials').insert(rows));
  }
  if(error){
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '등록'; }
    alert('등록 실패!\n\n' + (error.message||JSON.stringify(error)));
    return;
  }
  if(crossDropped) crossExtraDroppedAlert();
  batchCompose = null;
  if(form.rememberDays){
    await sb.from('crop_profiles').upsert({ name: payload.name, typical_days: payload.expected_days, updated_at: new Date().toISOString() });
  }
  if(purposeDropped) alert('등록은 됐지만, 사용 목적(' + form.purpose + ')은 materials 테이블에 해당 컬럼이 없어 저장되지 않았어요.\n\n(관리자 확인 필요) Supabase SQL Editor에서 아래를 한 번 실행해주세요:\n\n' + MATERIAL_PURPOSE_SQL);
  const { error: rpErr } = await sb.from('materials').update({ replanted_at: new Date().toISOString() }).in('id', items.map(x=> x.rec.id));
  if(rpErr) alert('등록은 됐지만, 수확 완료 목록에서 자동으로 빼지 못했어요.\n\n(관리자 확인 필요) Supabase SQL Editor에서 아래를 한 번 실행해주세요:\n\n' + MATERIAL_REPLANT_SQL + '\n\n' + (rpErr.message||''));
  showToast(`세대진전으로 ${items.length}건 심었어요${payload.generation ? ` · ${payload.generation}` : ''}`);
  setWorkOnlySpot(items[0].bedNo, items[0].floor);
  await loadAll();
  if(document.querySelector('#workRoomDetail .batch-compose')) closeBatchLocModal();
}
function toggleHarvestMore(){
  harvestShowAll = !harvestShowAll;
  renderDetail('work');
}
// [다시 심기] · [세대진전]: 수확 완료한 계통과 같은 내용으로 새 자리에 심는 입력칸을 연다. 세대진전이면 세대 칸을 강조하고 '수정 필요'를 알린다.
// 심을 자리는 미리 골라 둔다: 지금 열어 둔 자리가 비어 있으면 그 자리 → 원래 있던 자리가 비어 있으면 그 자리 → 방의 첫 빈 자리.
// 시작일(파종일 · 사용 시작일)은 오늘로 채워 둔다. 기록에 남아 있는 예전 날짜는 새로 심을 때 맞지 않기 때문이다.
function advanceHarvested(id){ replantHarvested(id, true); }
function replantHarvested(id, advance){
  const b = materials.find(m=> m.id===id);
  const room = b && rooms.find(r=> r.id===b.room_id);
  if(!room) return;
  const info = workRoomInfo(room);
  const isEmpty = (s)=> !!s && workSpotBatches(room, s.bedNo, s.floor).length === 0;
  const original = b.structure_no != null ? { bedNo: b.structure_no, floor: b.floor } : null;
  const openedSpot = workOnlySpot();
  let spot = [openedSpot, original].find(isEmpty);
  if(!spot){
    for(let bedNo = 1; bedNo <= info.bedCount && !spot; bedNo++){
      for(const floor of [...info.floors].reverse()){ if(isEmpty({ bedNo, floor })){ spot = { bedNo, floor }; break; } }
    }
  }
  spot = spot || openedSpot || original;
  openBatchLocationModal(b.room_id, { ...b, sowing_date: todayKST(), harvest_date: null }, null, { replant: true, advance: !!advance, spot });
}
// [세대진전]: 고쳐야 하는 칸(세대 · 파종일)을 눈에 띄게 하고 '수정(필수)'를 알린다.
//  · 세대 · 파종일(오늘 날짜로 채워 둠): 처음 값과 다르게 고치면 초록 '✓', 그대로면 계속 '수정(필수)'
// 칸마다 위쪽 테두리에 태그(수정(필수) · 수정(선택) · ✓)를 걸어 둔다. 사용 목적을 바꿔서 숨겨진 칸은 빠진다.
function markFieldsForEdit(root, prefill){
  const trim = (v)=> String(v ?? '').trim();
  const genOrig = trim(prefill.generation);
  const sowOrig = trim(prefill.sowing_date);
  // 심을 위치(선택): 미리 골라 둔 자리를 그대로 써도 되고, 바꾸고 싶으면 바꾼다
  const bedSel = document.getElementById('locBedNo'), floorSel = document.getElementById('locFloorSel');
  const locText = ()=> bedSel && bedSel.value ? spotText(parseInt(bedSel.value), floorSel ? floorSel.value : '') : '';
  const locOrig = locText();
  // input: 값을 읽는 칸 · box: 강조 표시를 입히는 칸 (세대는 값이 숨은 칸에 있어서 칩 줄을 감싼 틀이 box다)
  // optional: 고치지 않아도 되는 칸 ('수정(선택)'), 나머지는 꼭 고쳐야 하는 칸 ('수정(필수)')
  // 한번에 세대진전: 계통마다 있는 심을 위치 줄도 같은 '수정(선택)' 칸으로 다룬다
  const bulkLocFields = [...document.querySelectorAll('#batchLocLocation .bulk-adv-loc')].map(box=>{
    const b = box.querySelector('[data-bulk-bed]'), f = box.querySelector('[data-bulk-floor]');
    const value = ()=> b && b.value ? spotText(parseInt(b.value), f ? f.value : '') : '';
    return { key:'loc', optional:true, input: b, box, orig: value(), value };
  });
  const fields = [
    ...(bedSel ? [{ key:'loc', optional:true, input: bedSel, box: bedSel.parentElement, orig: locOrig, value: locText }] : []),
    ...bulkLocFields,
    { key:'gen', input: root.querySelector('[data-bf="generation"]'), box: root.querySelector('[data-gen-box]'), orig: genOrig },
    { key:'sow', input: root.querySelector('[data-bf="sowing_date"]'), orig: sowOrig }
  ].filter(f=> f.input);
  if(!fields.length) return;
  fields.forEach(f=>{
    f.box = f.box || f.input;
    f.flag = document.createElement('span');
    f.flag.className = 'bf-flag';
    f.box.parentElement.classList.add('bf-attn-row');
    f.box.parentElement.appendChild(f.flag);
  });
  // todo: 아직 수정 필요 / opt: 고치지 않아도 되는 칸(아직 그대로) / changed: 처음 값과 다르게 고침 (값이 그대로면 계속 수정 필요)
  const valueOf = (f)=> f.value ? f.value() : trim(f.input.value);
  const stateOf = (f)=>{
    const now = valueOf(f);
    if(now && now !== f.orig) return 'changed';
    return f.optional ? 'opt' : 'todo';
  };
  const TAG = { todo:'수정(필수)', opt:'수정(선택)', changed:'✓' };
  const isOk = (s)=> s === 'changed';
  const update = ()=>{
    const live = fields.filter(f=> f.box.offsetParent !== null);   // 사용 목적을 바꿔서 숨겨진 칸은 뺀다
    fields.forEach(f=>{
      const on = live.includes(f), s = on ? stateOf(f) : 'todo';
      f.flag.hidden = !on;
      f.box.classList.toggle('bf-attn', on && s === 'todo');
      f.box.classList.toggle('bf-opt', on && s === 'opt');
      f.box.classList.toggle('bf-ok', on && isOk(s));
      f.flag.classList.toggle('ok', isOk(s));
      f.flag.classList.toggle('opt', s === 'opt');
      f.flag.textContent = TAG[s];
      if(on) f.flag.style.top = (f.box.offsetTop - 10) + 'px';   // 칸의 윗줄에 걸쳐 놓는다
    });
  };
  fields.forEach(f=> f.input.addEventListener('input', update));
  root.addEventListener('change', update);
  if(bedSel) bedSel.parentElement.addEventListener('change', update);   // 심을 위치는 입력 양식(root) 밖에 있다
  bulkLocFields.forEach(f=> f.box.addEventListener('change', update));
  update();
  const first = fields.find(f=> !f.optional && f.box.offsetParent !== null);   // 포커스는 꼭 고쳐야 하는 첫 칸에 준다
  if(first){
    // 날짜 칸은 바로 쓸 수 있게 포커스를 주고, 세대는 지금 고른 칩에 포커스를 둔다
    const target = first.input.type === 'hidden' ? (first.box.querySelector('.task-bed-chip.active') || first.box.querySelector('.task-bed-chip')) : first.input;
    if(target){ target.focus({ preventScroll: true }); if(target.select) target.select(); }
  }
}
// 수확 완료 기록 하나를 목록에서 지운다 (지금 심겨 있는 계통에는 영향이 없다)
async function deleteHarvestRecord(id){
  if(tourBlockWrite()) return;
  const m = materials.find(x=> x.id===id);
  const label = m ? (m.line_no || crossComboLabel(m) || m.name || '이 계통') : '이 계통';
  const hasHistory = generationHistory.some(h=> h.material_id===id);
  if(!confirm(`'${label}'의 수확 완료 기록을 목록에서 지울까요?\n지금 심겨 있는 계통에는 영향이 없어요.${hasHistory ? '\n(이 기록의 세대 이력도 함께 지워져요)' : ''}`)) return;
  const { error } = await sb.from('materials').delete().eq('id', id);
  if(error){ alert('삭제 실패!\n\n' + (error.message||JSON.stringify(error))); return; }
  showToast('기록을 지웠어요');
  await loadAll();
}

// 계통 카드에 붙는 사용 목적 표시 (세대단축은 표시하지 않는다. 고온검정은 카드마다 따로 그린다)
function batchPurposeBadgeHtml(b){
  const p = batchPurposeOf(b);
  if(p==='인공교배') return `<span class="task-worker-badge" style="background:#E7EEF9; color:#2F5DA8; white-space:nowrap; flex-shrink:0;">인공교배용</span>`;
  if(p==='기타') return `<span class="task-worker-badge" style="background:#EFE8F7; color:#6A3FA0; white-space:nowrap; flex-shrink:0;">기타 실험</span>`;
  return '';
}
// 고온검정 계통의 품종 목록: 계통/품종 칸의 글자를 쉼표로 나눈다 (끝에 적힌 '(3반복)' 같은 글자는 뗀다)
const VARIETY_SPLIT = /[,，、·\n]/;
function stripRepeatSuffix(s){ return String(s ?? '').replace(/\s*[(（]?\s*\d+\s*반복\s*[)）]?\s*$/, '').trim(); }
function heatVarietiesOf(b){ return stripRepeatSuffix(b.line_no).split(VARIETY_SPLIT).map(s=> s.trim()).filter(Boolean); }
// 고온검정 카드 제목: 품종이 여러 개면 '대원콩 외 4개' (전체 목록은 마우스를 올리거나 카드를 펼치면 보인다). 하나뿐이면 그대로
function heatTitleParts(b){
  const v = heatVarietiesOf(b);
  return { first: v[0] || batchTitleOf(b), more: v.length > 1 ? `외 ${v.length - 1}개` : '' };
}
function heatTitleOf(b){ const t = heatTitleParts(b); return t.more ? `${t.first} ${t.more}` : t.first; }
// 좁은 카드용 제목: 자리가 모자라면 첫 품종 이름만 줄어들고 '외 4개'는 늘 보인다
function heatTitleHtml(b){
  const t = heatTitleParts(b);
  return `<span style="display:flex; align-items:baseline; gap:4px; min-width:0;"><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;">${escapeHtml(t.first)}</span>${t.more ? `<span style="flex-shrink:0; white-space:nowrap;">${t.more}</span>` : ''}</span>`;
}
// '고온검정용' 뱃지: 좁은 카드에서도 글자가 세로로 쪼개지지 않게 한 줄로 고정한다 (다른 목적 뱃지와 같다). tight: 바깥 여백을 없앤다 (공간 모자랄 때)
function heatTestBadgeHtml(tight){ return `<span class="task-worker-badge" style="background:#FBEEDD; color:#C2410C; white-space:nowrap; flex-shrink:0;${tight ? ' margin-left:0;' : ''}">고온검정용</span>`; }
// 끝내는 버튼 이름: 세대단축은 수확, 인공교배는 사용완료, 기타는 실험완료
function batchDoneLabel(b){ return { '인공교배':'사용완료', '기타':'실험완료' }[batchPurposeOf(b)] || '수확'; }
// 세대단축 · 인공교배 · 기타 계통 카드의 내용 줄들 (고온검정은 카드마다 따로 그린다)
function batchDetailLinesHtml(b){
  const p = batchPurposeOf(b), e = escapeHtml;
  const ln = (s, style = 'color:var(--ink-soft);')=> `<div style="font-size:13px; ${style}">${s}</div>`;
  const out = [];
  const nw = (d)=> `<span style="white-space:nowrap;">${d}</span>`;   // 날짜는 줄이 바뀌어도 가운데서 끊기지 않게
  if(p==='기타'){
    if(b.purpose) out.push(ln(`실험 내용: ${e(b.purpose)}`));
    if(b.test_condition) out.push(ln(`처리 조건: ${e(b.test_condition)}`));
    if(b.quantity!=null) out.push(ln(`규모: ${e(String(b.quantity))}개`));
    if(b.manager) out.push(ln(`담당: ${e(b.manager)}`));
    if(b.sowing_date) out.push(`<div class="bd-period" style="font-size:12.5px; color:var(--ink-faint);">기간 ${nw(b.sowing_date)}${b.harvest_date ? ` → ${nw(b.harvest_date)}` : ''}</div>`);
    return out.join('');
  }
  const cross = p==='인공교배';
  out.push(`<div style="font-size:13px; color:var(--ink-soft); display:flex; gap:12px; flex-wrap:wrap;"><span>교배조합: ${b.cross_combo ? e(crossComboLabel(b)) : '-'}</span>${(cross && !b.generation) ? '' : `<span>세대: ${b.generation ? e(b.generation) : '-'}</span>`}</div>`);
  if(b.purpose) out.push(ln(`목적: ${e(b.purpose)}`));
  if(b.test_condition) out.push(ln(`처리 조건: ${e(b.test_condition)}`));
  if(b.quantity!=null) out.push(ln(`규모: ${e(String(b.quantity))}개`));
  if(b.manager) out.push(ln(`담당: ${e(b.manager)}`));
  if(b.sowing_date) out.push(`<div class="bd-period" style="font-size:12.5px; color:var(--ink-faint);">${cross ? '사용' : '파종'} ${nw(b.sowing_date)}${b.harvest_date ? ` → ${cross ? '종료' : '수확예정'} ${nw(b.harvest_date)}` : ''}</div>`);
  return out.join('');
}

async function saveBatchCard(id, btnEl){
  if(tourBlockWrite()) return;
  const card = btnEl.closest('.batch-card');
  // 선택한 사용 목적(세대단축 · 인공교배 · 고온검정 · 기타)의 칸만 읽는다
  const form = readBatchForm(card);
  const payload = form.payload, name = payload.name;
  const cur = materials.find(m=> m.id===id);

  // 사용 목적(인공교배 · 기타)은 use_purpose에 담는다. 세대단축 · 고온검정은 컬럼이 이미 있을 때만 비워 둔다(없는 컬럼은 건드리지 않는다)
  const needsPurposeCol = form.purpose==='인공교배' || form.purpose==='기타';
  if(needsPurposeCol) payload.use_purpose = form.purpose;
  else if(cur && 'use_purpose' in cur) payload.use_purpose = null;

  tidyCrossExtra(payload, cur);   // '외 N조합': 값이 없고 원래도 없던 계통이면 칸을 아예 보내지 않는다
  btnEl.textContent = '저장 중...';
  let { error } = await sb.from('materials').update(payload).eq('id', id);
  let purposeDropped = false, crossDropped = false;
  // 컬럼이 아직 없으면(use_purpose · cross_extra), 그 항목만 빼고 다시 저장해서 내용 자체는 잃지 않게 한다
  for(let tries = 0; error && tries < 2; tries++){
    if(needsPurposeCol && !purposeDropped && /use_purpose/.test(error.message||'')){ delete payload.use_purpose; purposeDropped = true; }
    else if(!crossDropped && isCrossExtraColError(error)){ delete payload.cross_extra; crossDropped = true; }
    else break;
    ({ error } = await sb.from('materials').update(payload).eq('id', id));
  }
  if(crossDropped && !error) crossExtraDroppedAlert();
  if(error){
    alert('저장 실패!\n\n' + (error.message||JSON.stringify(error)));
    btnEl.textContent = '저장';
    return;
  }
  // 세대단축의 예상기간만 작물별 기본 기간으로 기억한다 (인공교배 · 기타의 사용기간은 작물의 생육일수가 아니다)
  if(form.rememberDays){
    await sb.from('crop_profiles').upsert({ name, typical_days: payload.expected_days, updated_at: new Date().toISOString() });
  }
  expandedBatchIds.delete(id);
  showToast('저장됐어요');
  const scrollPositions = captureScrollPositions();
  await loadAll();
  restoreScrollPositions(scrollPositions);
  if(purposeDropped) alert('저장은 됐지만, 사용 목적(' + form.purpose + ')은 materials 테이블에 해당 컬럼이 없어 저장되지 않았어요.\n\n(관리자 확인 필요) Supabase SQL Editor에서 아래를 한 번 실행해주세요:\n\n' + MATERIAL_PURPOSE_SQL);
}

function historySummary(materialId){

    .sort((a,b)=> (b.end_date||'').localeCompare(a.end_date||''));

function tourSelectWorkSpot(kind){
  tourGoWork();
  const r = tourPickRoom();
  if(!r) return null;
  const info = workRoomInfo(r);
  for(let bedNo=1; bedNo<=info.bedCount; bedNo++){
    for(const floor of info.floors){
      const filled = workSpotBatches(r, bedNo, floor).length > 0;
      if(filled !== (kind==='filled')) continue;
      const only = workOnlySpot();
      if(!only || only.bedNo!==bedNo || only.floor!==floor){
        setWorkOnlySpot(bedNo, floor);
        renderDetail('work');
      }
      return { bedNo, floor };
    }
  }
  return null;
}
