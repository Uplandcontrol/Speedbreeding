// 일정표 위의 '수요조사 반영' 패널: 반영 대기 요청을 방별로 모아 보여주고, 한 줄에서 바로 [반영] / [수정]
function renderDemandInboxHtml(st){
  if(!st.groups.length) return '';
  const c = st.counts;
  const byRoom = new Map();
  st.actionable.forEach(g=> pushTo(byRoom, g.room, g));
  const cardHtml = (g)=>{
    const s0 = g.rows[0];
    const title = [g.who || '(이름 없음)', g.crop || '작물 미정', (s0.purposes||[]).join(', ')].filter(Boolean).map(escapeHtml).join(' · ');
    const dated = g.todo.filter(it=> it.start);
    const sub = [dated.length ? demandPeriodText(dated) : '희망 기간 없음', s0.line_no ? `${lineNoLabel((s0.purposes||[])[0])} ${s0.line_no}` : '', s0.expected_scale!=null ? `예상 ${Number(s0.expected_scale).toLocaleString()}개체` : ''].filter(Boolean).join(' · ');
    const flags = [];
    if(g.conflicts.length) flags.push(`<span class="pd-flag warn" title="${escapeHtml(g.conflicts.map(demandConflictText).join('\n'))}">⚠ 기간 겹침 ${g.conflicts.length}</span>`);
    if(g.problem) flags.push(`<span class="pd-flag info">${escapeHtml(g.problem)}</span>`);
    if(g.status==='partial') flags.push(`<span class="pd-flag info">일부 기간만 반영됨</span>`);
    if(g.drafted) flags.push(`<span class="pd-flag draft">✎ 저장 전</span>`);
    else if(g.moved) flags.push(`<span class="pd-flag info">↪ 옮김</span>`);
    const fam = demandFamilyInfo(st, g.family);
    if(fam.members.length > 1){
      flags.push(`<span class="pd-flag copy" title="같은 요청을 복사해서 ${fam.members.length}곳에 놓았어요">⧉ ${g.isCopy ? '복사본' : '원본'}</span>`);
      if(fam.orig != null && fam.sum !== fam.orig) flags.push(`<span class="pd-flag info" title="개체수 합계가 처음 신청과 달라요. [분배]에서 맞춰 주세요">개체수 합계 ${fam.sum.toLocaleString()}/${fam.orig.toLocaleString()}</span>`);
    }
    const id = escapeHtml(g.gid);
    return `
      <div class="pd-card ${g.conflicts.length ? 'conflict' : ''}">
        <button type="button" class="pd-loc" title="일정표에서 이 자리 보기" onclick="goToPlanLane('${escapeHtml(g.room)}', ${g.bedNo}, '${escapeHtml(g.floor)}')">${isAisleSpot(g.bedNo) ? '통로' : `베드 ${g.bedNo}<br>${escapeHtml(g.floor)}`}</button>
        <div class="pd-main">
          <div class="pd-title"><span class="pd-dot" style="background:${planColorOf(g.crop, (s0.purposes||[])[0])};"></span>${title}${flags.join('')}</div>
          <div class="pd-sub">${escapeHtml(sub)}</div>
          ${g.drafted ? `<div class="pd-sub pd-orig">✎ 저장된 위치: ${escapeHtml(demandSavedText(g))}</div>` : ''}
          ${g.moved ? `<div class="pd-sub pd-orig">↪ 원래 신청 (원본 그대로 보관 중): ${escapeHtml(demandOrigText(g))}</div>` : ''}
        </div>
        <div class="pd-act">
          <button type="button" class="btn small" onclick="copyDemandToClip('${id}')" title="복사해 두고 다른 베드 · 층에 붙여넣어요">복사</button>
          ${fam.members.length > 1 ? `<button type="button" class="btn small" onclick="openScaleSplit('${escapeHtml(g.family)}')" title="원본과 복사본의 개체수를 나눠요">분배</button>` : ''}
          ${g.drafted ? `<button type="button" class="btn small" onclick="cancelPlanDraft('${id}')">옮김 취소</button>` : ''}
          ${g.moved && !g.drafted ? `<button type="button" class="btn small" onclick="restoreDemand('${id}')" title="저장해 둔 조율을 지우고 원래 신청 상태로 돌려요">원래대로</button>` : ''}
          ${g.moved ? `<button type="button" class="btn small" onclick="adoptOriginalDemand('${id}')" title="저장해 둔 조율은 지우고, 원래 신청 그대로 계획에 넣어요">원본 그대로 반영</button>` : ''}
          <button type="button" class="btn small ${g.problem ? 'primary' : ''}" onclick="openPlanModalForDemand('${id}')">수정</button>
          ${g.problem ? '' : `<button type="button" class="btn small ${g.conflicts.length ? '' : 'primary'}" onclick="adoptDemand('${id}')">반영</button>`}
        </div>
      </div>`;
  };
  const listHtml = byRoom.size
    ? `<div class="pd-list">${[...byRoom.entries()].map(([room, list])=> `
        <div>
          <div class="pd-room-name">${escapeHtml(roomLabel(room))} · ${list.length}건</div>
          <div class="pd-cards">${list.map(cardHtml).join('')}</div>
        </div>`).join('')}</div>`
    : `<div class="empty-materials" style="padding:18px 0;">접수된 요청 ${c.done}건이 모두 계획에 반영됐어요 ✓</div>`;
  return `
    <div class="panel-box pd-panel">
      <div class="panel-box-head">
        <div>
          <h3>수요조사 반영</h3>
          <p>접수된 요청을 일정표에 넣는 곳이에요. <b>반영</b>은 요청한 그대로, <b>수정</b>은 고쳐서 넣어요. 왼쪽 위치 버튼을 누르면 일정표의 그 자리로 이동해요.</p>
        </div>
        <div class="pd-head-act">
          <label class="pd-toggle"><input type="checkbox" ${planShowDemand ? 'checked' : ''} onchange="togglePlanShowDemand(this.checked)" /> 일정표에 요청 함께 보기</label>
          ${c.moved ? `<button type="button" class="btn small" onclick="restoreDemand()">저장된 옮김 ${c.moved}건 모두 원래대로</button>` : ''}
          ${c.quick ? `<button type="button" class="btn small primary" onclick="adoptAllCleanDemand()">겹침 없는 ${c.quick}건 한 번에 반영</button>` : ''}
        </div>
      </div>
      <div class="pd-stats">
        <span class="pd-stat"><b>${c.wait}</b> 반영 대기</span>
        ${c.conflict ? `<span class="pd-stat warn"><b>${c.conflict}</b> 기간 겹침</span>` : ''}
        ${c.drafted ? `<span class="pd-stat draft"><b>${c.drafted}</b> 저장 전</span>` : ''}
        ${c.moved ? `<span class="pd-stat"><b>${c.moved}</b> 저장된 옮김</span>` : ''}
        <span class="pd-stat ok"><b>${c.done}</b> 반영 완료</span>
      </div>
      ${listHtml}
    </div>`;
}
function togglePlanShowDemand(on){
  planShowDemand = !!on;
  renderPlanView();
}

// 지금 그려진 일정표에서 그 자리(방 · 베드 · 층)를 찾아 스크롤하고 잠깐 강조한다. 찾으면 true
function flashPlanLane(room, bedNo, floor){
  const key = demandSpot(room, bedNo, floor);
  const lane = [...document.querySelectorAll('#planViewWrap .plan-lane')].find(el=> el.dataset.lane===key);
  if(!lane) return false;
  lane.scrollIntoView({ behavior:'smooth', block:'center' });
  lane.classList.remove('flash');
  void lane.offsetWidth;   // 같은 자리를 연달아 눌러도 강조가 다시 시작되도록
  lane.classList.add('flash');
  setTimeout(()=> lane.classList.remove('flash'), 2600);
  return true;
}
// 분기별 계획 탭으로 가서 그 자리를 보여준다. 수요조사 탭에서도 쓴다.
function goToPlanLane(room, bedNo, floor){
  const needRender = !planShowDemand;
  planShowDemand = true;
  if(viewMode!=='plan') switchView('plan');
  else if(needRender) renderPlanView();
  if(!flashPlanLane(room, bedNo, floor)) showToast('일정표에서 이 자리를 찾지 못했어요');
}

// 수요조사 탭의 응답 카드 한 장에 붙는 '계획 반영 상태' 줄
function demandLinkHtml(st, s){
  const hit = st.byRow.get(String(s.id));
  if(!hit) return '';
  const { g, it } = hit;
  const id = escapeHtml(g.gid);
  const jump = (room, bedNo, floor)=> `<button type="button" class="btn small" onclick="goToPlanLane('${escapeHtml(room)}', ${Number(bedNo)}, '${escapeHtml(floor)}')">일정표에서 보기</button>`;
  // 이 응답에 적힌 내용(위)은 신청한 그대로다. 관리자가 조율을 저장해 뒀으면 계획에 쓰이는 조율 위치를 따로 보여준다
  const adj = demandAdjOf(s);
  const adjChip = adj ? `<span class="sv-chip adj" title="관리자가 조율해서 저장해 둔 자리 · 날짜예요. 이 응답에 적힌 원래 신청은 그대로 보관돼 있어요">↪ 조율 저장됨 → ${escapeHtml([demandOrigSpotText(adj), demandOrigDateText(s, adj)].filter(Boolean).join(' · '))}</span>` : '';
  if(it.state==='done'){
    const p = it.plan.p;
    const note = it.plan.spot!==g.spot ? ` · ${spotText(p.structure_no, p.floor, true)}에 반영` : it.how==='adjusted' ? ' · 기간은 조정됨' : '';
    return `<div class="sv-link"><span class="sv-chip done">✓ 계획에 반영됨${escapeHtml(note)}</span>${adjChip}${jump(p.room_name, p.structure_no, p.floor)}</div>`;
  }
  if(it.state==='nodate') return `<div class="sv-link"><span class="sv-chip wait">희망 기간이 없어 일정표에 넣을 수 없어요</span>${adjChip}</div>`;
  return `<div class="sv-link">
    <span class="sv-chip wait">${g.conflicts.length ? '⚠ 기간 겹침 · ' : ''}반영 대기</span>
    ${adjChip}
    ${g.problem
      ? `<button type="button" class="btn small primary" onclick="openPlanModalForDemand('${id}')">수정하고 반영</button>`
      : `<button type="button" class="btn small primary" onclick="adoptDemand('${id}')">${adj ? '조율한 대로 반영' : '계획에 반영'}</button>`}
    ${adj ? `<button type="button" class="btn small" onclick="adoptOriginalDemand('${id}')" title="저장해 둔 조율은 지우고, 이 응답에 적힌 원래 신청 그대로 계획에 넣어요">원래 신청 그대로 반영</button>` : ''}
    ${jump(g.room, g.bedNo, g.floor)}
  </div>`;
}

function planRangeMonths(){
  if(planPeriod && planPeriod.period_start && planPeriod.period_end){
    const s = new Date(planPeriod.period_start+'T00:00:00');
    const e = new Date(planPeriod.period_end+'T00:00:00');
    e.setDate(e.getDate()+1);
    return { start: s, end: e };
  }
  const start = kstTodayDate(); start.setDate(1);
  const end = new Date(start.getFullYear(), start.getMonth()+6, 1);
  return { start, end };
}
function genStageIndex(genStr){
  const stage = extractGenStage(genStr);
  if(!stage) return null;
  if(stage==='포장') return 7;
  const m = stage.match(/F(\d+)/);
  return m ? parseInt(m[1]) : null;
}

// 일정표 막대를 누르면 그 계획의 내용을 팝업으로 보여준다 (위치 · 기간 · 수요조사에서 온 상세 내용)
function openPlanBarPopup(idx){
  const p = currentPlanBarItems[idx];
  if(!p) return;
  const start = p.planned_start, end = p.planned_end || p.planned_start;
  const days = (p.planned_days!=null && p.planned_days!=='') ? Number(p.planned_days) : daysBetween(start, end);
  const color = planColorOf(p.crop_name, planPurposeKind(p));
  const txt = (v)=> `<span style="white-space:pre-wrap;">${escapeHtml(String(v))}</span>`;
  const rows = [
    ['위치', txt(`${roomLabel(p.room_name)} · ${spotText(p.structure_no, p.floor)}`)],
    ['작물', p.crop_name ? txt(p.crop_name) : ''],
    ['세대', p.generation ? txt(p.generation) : ''],
    ['사용 목적', p.use_purpose ? txt(p.use_purpose) : ''],
    ['기간', txt(`${start} ~ ${end} (${days}일)`)],
    [lineNoLabel(p.use_purpose), p.line_no ? txt(p.line_no) : ''],
    ['교배조합', p.cross_combo ? txt(crossComboLabel(p)) : ''],
    [purposeFieldLabel(p.use_purpose), p.purpose ? txt(p.purpose) : ''],
    ['처리 온도', p.heat_temp ? txt(p.heat_temp) : ''],
    ['처리 단계', p.heat_stage ? txt(p.heat_stage) : ''],
    ['예상 개체수', p.expected_scale!=null ? txt(`${Number(p.expected_scale).toLocaleString()}개체`) : ''],
    ['요청사항', p.notes ? txt(p.notes) : ''],
    ['담당자', p.submitted_by ? txt(p.submitted_by) : '']
  ].filter(([, html])=> html);

  const titleText = [p.crop_name, p.generation || p.use_purpose].filter(Boolean).join(' ') || '계획';
  document.getElementById('planBarModalTitle').innerHTML =
    `<span style="width:10px; height:10px; border-radius:3px; background:${color}; flex-shrink:0;"></span><span>${escapeHtml(titleText)}</span>`;
  document.getElementById('planBarModalBody').innerHTML = `
    <div style="display:grid; grid-template-columns:78px 1fr; gap:10px 12px; font-size:13px; line-height:1.45;">
      ${rows.map(([k, html])=> `<div style="color:var(--ink-faint); font-weight:700;">${k}</div><div style="min-width:0; color:var(--ink); word-break:break-word;">${html}</div>`).join('')}
    </div>`;
  // 관리자는 팝업에서 바로 이 층의 계획을 수정할 수 있다
  const gi = isAdmin ? currentPlanGroups.findIndex(g=> g.room_name===p.room_name && g.structure_no===p.structure_no && g.floor===p.floor) : -1;
  document.getElementById('planBarModalActions').innerHTML =
    (gi>=0 ? `<button class="btn" onclick="closePlanBarPopup(); openPlanModal(currentPlanGroups[${gi}])">이 층 계획 수정</button>` : '') +
    (isAdmin && p.id!=null ? `<button class="btn danger-text" onclick="deletePlanRow(${idx})">이 계획 삭제</button>` : '') +
    `<button class="btn primary" onclick="closePlanBarPopup()">닫기</button>`;
  document.getElementById('planBarModalOverlay').classList.add('open');
}
function closePlanBarPopup(){
  document.getElementById('planBarModalOverlay').classList.remove('open');
}
// 관리자: 일정표 막대 하나(계획 한 건)만 지운다 (같은 층의 다른 계획은 그대로)
async function deletePlanRow(idx){
  if(tourBlockWrite()) return;
  if(!isAdmin){ alert('전체 관리자만 할 수 있어요.'); return; }
  const p = currentPlanBarItems[idx];
  if(!p || p.id==null) return;
  const what = [p.crop_name, p.generation || p.use_purpose, p.line_no || (p.cross_combo ? crossComboLabel(p) : '')].filter(Boolean).join(' · ') || '이 계획';
  const where = `${roomLabel(p.room_name)} ${spotText(p.structure_no, p.floor)}`;
  if(!confirm(`${where}의 '${what}' 계획(${p.planned_start} ~ ${p.planned_end || p.planned_start})을 삭제할까요?\n(되돌릴 수 없어요)`)) return;
  const { data: gone, error } = await sb.from('bed_plans').delete().eq('id', p.id).select('id');
  if(error){ alert('삭제 실패!\n\n' + (error.message||JSON.stringify(error))); return; }
  if(!(gone||[]).length){ alert('삭제되지 않았어요.\n\n(Supabase의 bed_plans 삭제 권한 설정을 확인해주세요)'); return; }
  closePlanBarPopup();
  showToast('계획을 삭제했어요');
  await loadAll();
}

// 분기별 계획 일정표: 방 → 베드 → 층 순서로 묶어서, 한 베드의 1층·2층을 한 카드에 나란히 보여준다
// st(수요조사 연계 상태)를 받으면(관리자) 아직 계획에 넣지 않은 요청을 점선 막대로 함께 보여준다
function renderPlanTimeline(st){
  const { start, end } = planRangeMonths();
  const totalDays = Math.max(1, surveyDateToDays(end) - surveyDateToDays(start));
  const startYmd = `${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`;

  let axisTicks = '', gridLines = '';
  let cursor = new Date(start);
  while(cursor < end){
    const offsetDays = surveyDateToDays(cursor) - surveyDateToDays(start);
    const leftPct = (offsetDays/totalDays*100).toFixed(2);
    axisTicks += `<div style="position:absolute; left:${leftPct}%; top:0; bottom:0; border-left:1px dashed var(--plan-month-line); font-size:10.5px; font-weight:700; color:var(--ink-faint); padding-left:5px;">${cursor.getMonth()+1}월</div>`;
    // 위아래로 4px 늘려서(층 줄의 여백만큼) 두 층 사이에서도 끊기지 않고 이어져 보이게 한다
    gridLines += `<div style="position:absolute; left:${leftPct}%; top:-4px; bottom:-4px; border-left:1px dashed var(--plan-month-line);"></div>`;
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }
  const axisHtml = `
    <div class="plan-axis">
      <div class="plan-axis-spacer"></div>
      <div class="plan-axis-lane"><div class="plan-axis-tag"></div><div class="plan-axis-track">${axisTicks}</div>${isAdmin ? '<div class="plan-axis-act"></div>' : ''}</div>
    </div>`;

  // 방 → 베드 → 층 → 계획들
  const roomBeds = {};
  bedPlans.forEach(p=>{
    const beds = (roomBeds[p.room_name] = roomBeds[p.room_name] || {});
    const floors = (beds[p.structure_no] = beds[p.structure_no] || {});
    (floors[p.floor] = floors[p.floor] || []).push(p);
  });
  // 아직 계획에 넣지 않은 요청: 자리(방 · 베드 · 층)별로 모은다. 계획이 하나도 없는 베드도 일정표에 나타나도록 베드를 만들어 둔다
  const ghostBySpot = new Map();
  if(st && planShowDemand){
    st.actionable.forEach(g=> g.items.forEach(it=>{
      if(it.state!=='pending') return;
      pushTo(ghostBySpot, g.spot, { g, it });
      const beds = (roomBeds[g.room] = roomBeds[g.room] || {});
      beds[g.bedNo] = beds[g.bedNo] || {};
    }));
  }
  // 수요도 계획도 없는 방과 빈 베드도 모두 만들어 둔다 (요청을 끌어다 놓을 자리 · 어디가 비었는지 한눈에 보기). '남은 베드 보기'는 아래에서 이 중 쓰이는 줄을 걸러낸다.
  // 도면의 고정 방뿐 아니라 관리자가 추가한 방 · '사용 가능'을 켠 칸도 포함하고, 사용 중지한 방도 (흐리게 표시해서) 보여준다. 베드가 없는 칸(창고 · 쓰지 않는 조사실)만 뺀다
  new Set([...ROW1, ...ROW2, ...rooms.map(r=> r.name)]).forEach(name=>{
    const cfg = roomBedConfig(name);
    if(!cfg || isMutedRoom(name)) return;
    const beds = (roomBeds[name] = roomBeds[name] || {});
    for(let n = 1; n <= cfg.bed_count; n++) beds[n] = beds[n] || {};
    if(AISLE_ROOMS.has(name)) beds[AISLE_BED_NO] = beds[AISLE_BED_NO] || {};
  });
  const roomOrder = [...new Set([...ROW1, ...ROW2])];
  const allRoomNames = Object.keys(roomBeds).sort((a,b)=>{
    const ra = roomOrder.indexOf(a), rb = roomOrder.indexOf(b);
    return (ra<0?999:ra) - (rb<0?999:rb) || a.localeCompare(b);   // 도면 순서 → 그 밖의 방은 이름 순
  });
  const roomIsOff = (name)=> !roomIsActive(roomByName(name));   // 관리자가 사용 중지한 방
  const pendingByRoom = new Map();   // 방별 반영 대기 요청 수 ('방 바로가기'에 보여준다)
  if(st && planShowDemand) st.actionable.forEach(g=> pendingByRoom.set(g.room, (pendingByRoom.get(g.room) || 0) + 1));
  const FLOOR_ORDER = ['2층','1층'];   // 위층이 위에 오도록 (수요조사 베드 선택 화면과 같은 순서)
  const floorRank = (fl)=>{ const i = FLOOR_ORDER.indexOf(fl); return i<0 ? 99 : i; };

  // 계획 하나가 일정표에서 차지하는 구간 { left, width } (일 단위, 범위에 맞게 잘라낸 값). 일정표 범위 밖이면 null
  const planSpan = (p)=>{
    if(!p.planned_start) return null;
    const pStart = new Date(p.planned_start+'T00:00:00');
    const pEnd = p.planned_end ? new Date(p.planned_end+'T00:00:00') : pStart;
    let left = surveyDateToDays(pStart) - surveyDateToDays(start);
    let width = Math.max(1, surveyDateToDays(pEnd) - surveyDateToDays(pStart));
    if(left < 0){ width += left; left = 0; }
    if(left + width > totalDays) width = totalDays - left;
    if(width <= 0 || left >= totalDays) return null;
    return { left, width };
  };

  // 한 베드에서 보여줄 층들 (방 설정에 있는 층은 계획이 없어도 함께 보여준다). '남은 베드 보기'에서는 일정표 기간에 확정된 계획이 하나도 없는 층만 남긴다.
  // 반영 대기 요청이 있는 층은 계획이 있어도 남겨서 요청이 일정표에서 사라지지 않게 한다
  const bedNoOf = (bedKey, byFloor)=>{
    // 객체 키는 문자열이 되므로, 베드 번호는 계획 데이터에 들어 있는 원래 값(숫자)을 쓴다 (수정 창·팝업이 베드를 정확히 찾도록)
    // 계획이 하나도 없고 요청만 있는 베드는 키를 숫자로 바꿔 쓴다
    const firstPlans = Object.values(byFloor).find(arr=> arr.length);
    return firstPlans ? firstPlans[0].structure_no : Number(bedKey);
  };
  const floorsOf = (roomName, bedNo, byFloor)=>{
    const cfg = roomBedConfig(roomName);
    const cfgFloors = isAisleSpot(bedNo) ? [AISLE_FLOOR] : cfg ? (cfg.bed_floors===2 ? ['2층','1층'] : ['1층']) : [];   // 인공교배실의 통로는 '통로' 한 줄뿐
    const floors = [...new Set([...cfgFloors, ...Object.keys(byFloor)])].sort((a,b)=> floorRank(a)-floorRank(b) || a.localeCompare(b));
    if(planBedView!=='free') return floors;
    return floors.filter(fl=> !(byFloor[fl]||[]).some(planSpan) || ghostBySpot.has(demandSpot(roomName, bedNo, fl)));
  };
  const roomNames = planBedView==='free'
    ? allRoomNames.filter(name=> Object.keys(roomBeds[name]).some(k=> floorsOf(name, bedNoOf(k, roomBeds[name][k]), roomBeds[name][k]).length))
    : allRoomNames;

  // 한 층 줄의 확정 계획 막대들. 기간이 겹치는 계획(예: '겹침 확인 후 반영'으로 같은 자리에 넣은 계획)은 줄을 나눠 위아래로 쌓아서
  // 화살표가 모두 보이게 한다. 돌려주는 값: { html, rows } (rows = 쌓인 줄 수)
  const barsFor = (items)=>{
    const placed = [];
    items.forEach(p=>{
      const span = planSpan(p);
      if(span) placed.push({ p, left: span.left, width: span.width });
    });
    placed.sort((a, b)=> a.left - b.left);   // 먼저 시작하는 계획이 위쪽 줄
    const rowEnds = [];
    placed.forEach(b=>{
      let r = rowEnds.findIndex(e=> e <= b.left);
      if(r < 0){ r = rowEnds.length; rowEnds.push(0); }
      b.row = r;
      rowEnds[r] = b.left + b.width;
    });
    return { rows: Math.max(1, rowEnds.length), html: placed.map(({ p, left, width, row })=>{
      const color = planColorOf(p.crop_name, planPurposeKind(p));   // 고온검정은 작물 색에 붉은 기를 섞는다
      const stageIdx = genStageIndex(p.generation);
      const brightness = stageIdx ? Math.max(0.62, 1.22 - stageIdx*0.09) : 1;
      // 화면에 그려지는 구간(잘린 경우 잘린 만큼)의 한국 시간 시작·끝 → 지금까지 지난 비율만큼 색이 찬다
      const visS = kstMidnightMs(addDays(startYmd, left));
      const visE = visS + width * 86400000;
      const fillPct = planFillPct(Date.now(), visS, visE);
      const leftPct = (left/totalDays*100).toFixed(2);
      const widthPct = Math.max(1.2, (width/totalDays*100)).toFixed(2);
      // 세대가 없는 계획(인공교배·고온검정 등)은 막대 이름에 사용 목적을 붙인다
      const label = [p.crop_name, p.generation || p.use_purpose].filter(Boolean).join(' ');
      const tooltip = [label, `${p.planned_start} ~ ${p.planned_end||''}`,
        (p.generation && p.use_purpose) ? `사용 목적: ${p.use_purpose}` : '',
        p.line_no?`${lineNoLabel(p.use_purpose)}: ${p.line_no}`:'', p.cross_combo?`교배조합: ${crossComboLabel(p)}`:'', p.purpose?`목적: ${p.purpose}`:'',
        p.heat_temp?`처리 온도: ${p.heat_temp}`:'', p.heat_stage?`처리 단계: ${p.heat_stage}`:'',
        p.expected_scale!=null?`예상 ${Number(p.expected_scale).toLocaleString()}개체`:'', p.notes?`요청: ${p.notes}`:'',
        `담당: ${p.submitted_by||''}`].filter(Boolean).join(' · ');
      // 막대 이름 뒤에 목적(교배목적, 없으면 이름에 아직 안 나온 사용 목적)과 예상 개체수를 연하게 덧붙인다
      const subText = [p.purpose || (p.generation ? p.use_purpose : ''), p.expected_scale!=null ? `${Number(p.expected_scale).toLocaleString()}개체` : ''].filter(Boolean).join(' · ');
      // 맨 앞에는 담당자 이름 (반영 대기 요청 막대와 같은 순서: 이름 · 작물 세대)
      const who = String(p.submitted_by || '').trim();
      const labelHtml = `${who ? `<span class="plan-bar-who">${escapeHtml(who)}</span>` : ''}${escapeHtml(label)}${subText ? `<i class="plan-bar-sub">${escapeHtml(subText)}</i>` : ''}`;
      const barIdx = currentPlanBarItems.length;
      currentPlanBarItems.push(p);
      return `<div class="plan-bar" role="button" tabindex="0" title="${escapeHtml(tooltip)}" onclick="openPlanBarPopup(${barIdx})" onkeydown="if(event.key==='Enter'||event.key===' '){ event.preventDefault(); openPlanBarPopup(${barIdx}); }" data-vs="${visS}" data-ve="${visE}" style="left:${leftPct}%; width:${widthPct}%; top:calc((var(--plan-bar-h) + 2px) * ${row}); bottom:auto; height:var(--plan-bar-h); --c:${color}; --plan-p:${fillPct}%; filter:brightness(${brightness});"><span class="plan-bar-label plan-bar-label-empty">${labelHtml}</span><span class="plan-bar-label plan-bar-label-full" aria-hidden="true">${labelHtml}</span></div>`;
    }).join('') };
  };

  // 아직 계획에 넣지 않은 요청 막대들 (확정된 계획 줄 바로 아래에 점선·빗금으로). 기간이 겹치는 요청끼리는 줄을 나눠 쌓는다
  const ghostTrackFor = (list)=>{
    const placed = [];
    list.forEach(({ g, it })=>{
      let left = surveyDateToDays(new Date(it.start+'T00:00:00')) - surveyDateToDays(start);
      let width = Math.max(1, surveyDateToDays(new Date(it.end+'T00:00:00')) - surveyDateToDays(new Date(it.start+'T00:00:00')));
      if(left < 0){ width += left; left = 0; }
      if(left + width > totalDays) width = totalDays - left;
      if(width <= 0 || left >= totalDays) return;   // 일정표 범위 밖
      placed.push({ g, it, left, width });
    });
    if(!placed.length) return '';
    placed.sort((a, b)=> a.left - b.left);
    const rowEnds = [];
    placed.forEach(b=>{
      let r = rowEnds.findIndex(e=> e <= b.left);
      if(r < 0){ r = rowEnds.length; rowEnds.push(0); }
      b.row = r;
      rowEnds[r] = b.left + b.width;
    });
    const bars = placed.map(({ g, it, left, width, row })=>{
      const conflict = it.conflicts.length > 0;
      const what = [g.crop || '작물 미정', it.gen || (g.rows[0].purposes||[])[0]].filter(Boolean).join(' ');
      const famN = (st.families.get(g.family) || []).length;   // 복사해서 나눈 요청이면 막대에 이 자리의 개체수를 보여준다
      const scaleNow = scaleNum(g.rows[0].expected_scale);
      const label = `${g.who || '익명'} · ${what}${famN > 1 && scaleNow != null ? ` · ${scaleNow.toLocaleString()}개체` : ''}`;
      const tip = [`반영 대기 요청 · ${what}`, `${it.start} ~ ${it.end}`, g.rows[0].line_no ? `${lineNoLabel((g.rows[0].purposes||[])[0])}: ${g.rows[0].line_no}` : '', `담당: ${g.who || '익명'}`,
        famN > 1 ? `⧉ ${g.isCopy ? '복사본' : '원본'} · 같은 조합 ${famN}곳${scaleNow != null ? ` · 이 자리 ${scaleNow.toLocaleString()}개체` : ''}` : '',
        g.drafted ? `✎ 저장 전에 옮긴 상태 · 저장된 위치: ${demandSavedText(g)}` : '',
        g.moved ? `↪ 원래 신청: ${demandOrigText(g)}` : '',
        ...it.conflicts.map(c=> `⚠ 겹침: ${demandConflictText(c)}`), '(누르면 계획에 반영 · 끌어서 자리 · 날짜 옮기기)'].filter(Boolean).join('\n');
      const id = escapeHtml(g.gid);
      return `<div class="plan-ghost movable ${conflict ? 'conflict' : ''} ${g.moved ? 'moved' : ''} ${g.drafted ? 'draft' : ''}" data-gid="${id}" data-c="${planColorOf(g.crop, (g.rows[0].purposes||[])[0])}" role="button" tabindex="0" title="${escapeHtml(tip)}" onpointerdown="planGhostDown(event, '${id}')" onclick="openDemandPopup('${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){ event.preventDefault(); openDemandPopup('${id}'); }" style="left:${(left/totalDays*100).toFixed(2)}%; width:${Math.max(1.2, width/totalDays*100).toFixed(2)}%; top:calc((var(--plan-bar-h) + 2px) * ${row}); ${conflict ? '' : `--c:${planColorOf(g.crop, (g.rows[0].purposes||[])[0])};`}">${g.drafted ? '✎ ' : g.moved ? '↪ ' : ''}${famN > 1 ? '⧉ ' : ''}${conflict ? '<span class="gh-warn">⚠ </span>' : ''}${escapeHtml(label)}</div>`;
    }).join('');
    const rowCount = rowEnds.length;
    return `<div class="plan-demand-track" style="height:calc(var(--plan-bar-h) * ${rowCount} + ${(rowCount-1)*2}px);">${gridLines}${bars}</div>`;
  };

  currentPlanGroups = [];
  currentPlanBarItems = [];
  const clipNow = (st && planShowDemand && isAdmin) ? activeClip() : null;   // 붙여넣을 복사본 (없으면 [붙여넣기] 버튼도 없다)
  // 한 베드의 한 층 줄 (계획이 없으면 '계획 없음'). 층별 상세 내용은 줄 안에 적지 않고 막대에 마우스를 올리면 툴팁으로 보여준다
  const renderLane = (roomName, bedNo, floor, items)=>{
    let editBtn = '';
    if(items.length && isAdmin){
      const gIdx = currentPlanGroups.length;
      currentPlanGroups.push({ room_name: roomName, structure_no: bedNo, floor, items });
      editBtn = `<button class="btn small" onclick="openPlanModal(currentPlanGroups[${gIdx}])">수정</button>`;
    }
    // 복사해 둔 요청이 있으면 모든 줄에 [붙여넣기] (고른 복사본을 이 베드 · 층에 붙여넣는다)
    const pasteBtn = clipNow ? `<button class="btn small primary" onclick="pasteClipToLane(this)" title="${escapeHtml(`복사한 '${clipNow.label}'을(를) 이 자리에 붙여넣어요`)}">붙여넣기</button>` : '';
    const spot = demandSpot(roomName, bedNo, floor);
    const bars = items.length ? barsFor(items) : null;
    const trackStyle = (bars && bars.rows > 1) ? ` style="height:calc(var(--plan-bar-h) * ${bars.rows} + ${(bars.rows-1)*2}px);"` : '';
    return `
      <div class="plan-lane ${roomIsOff(roomName) ? 'room-off' : ''}" data-lane="${escapeHtml(spot)}" data-room="${escapeHtml(roomName)}" data-bed="${Number(bedNo)}" data-floor="${escapeHtml(floor)}">
        <div class="plan-lane-tag">${escapeHtml(floor)}</div>
        <div class="plan-lane-body">
          <div class="plan-lane-track"${trackStyle}>${gridLines}${bars ? bars.html : '<span class="plan-lane-empty">계획 없음</span>'}</div>
          ${ghostBySpot.has(spot) ? ghostTrackFor(ghostBySpot.get(spot)) : ''}
        </div>
        ${isAdmin ? `<div class="plan-lane-act">${pasteBtn}${editBtn}</div>` : ''}
      </div>`;
  };
  // 베드 카드: 왼쪽 '베드 N' + 오른쪽 층별 줄 (방 설정에 있는 층은 계획이 없어도 함께 보여준다)
  const renderBedBlock = (roomName, bedKey, byFloor)=>{
    const bedNo = bedNoOf(bedKey, byFloor);
    const aisle = isAisleSpot(bedNo);   // 인공교배실의 통로: 베드가 아니라 '통로' 한 줄만 있다
    const floors = floorsOf(roomName, bedNo, byFloor);
    if(!floors.length) return '';   // 남은 베드 보기에서 모든 층이 쓰이는 베드
    return `
      <div class="plan-bed-block">
        <div class="plan-bed-name">${aisle ? '통로' : `베드 ${escapeHtml(String(bedNo))}`}</div>
        <div class="plan-lanes">${floors.map(fl=> renderLane(roomName, bedNo, fl, byFloor[fl]||[])).join('')}</div>
      </div>`;
  };
  // 실 박스: 왼쪽에 실 이름, 오른쪽에 월 눈금과 베드 카드들 (베드 번호 순)
  const sectionsHtml = roomNames.map(roomName=>{
    const beds = roomBeds[roomName];
    const bedNos = Object.keys(beds).sort((a,b)=> bedOrder(a) - bedOrder(b));
    const off = roomIsOff(roomName);
    return `
      <div class="plan-room-section ${off ? 'room-off' : ''}" data-room-name="${escapeHtml(roomName)}">
        <div class="plan-room-name">${escapeHtml(roomLabel(roomName))}${off ? '<small>사용 중지</small>' : ''}</div>
        <div class="plan-room-main">
          <div class="plan-room-section-body">${bedNos.map(no=> renderBedBlock(roomName, no, beds[no])).join('')}</div>
        </div>
      </div>
    `;
  }).join('');

  // 월 눈금은 맨 위에 하나만 (실 박스와 같은 구조: 실 이름 칸 자리를 비우고 그 오른쪽에 눈금)
  const stickyAxisHtml = roomNames.length ? `
    <div class="plan-axis-sticky">
      <div class="plan-axis-roomspacer"></div>
      <div class="plan-axis-main">${axisHtml}</div>
    </div>` : '';

  // 방 바로가기: 수요가 있는 방도 없는 방도 한 줄에 모두 보여주고, 눌러서 그 방으로 이동한다 (요청을 멀리 있는 방으로 옮길 때 어디에 어떤 방이 있는지 한눈에 보이게)
  const roomJumpHtml = (st && planShowDemand && roomNames.length > 1) ? `
    <div class="plan-room-jump">
      <span>방 바로가기</span>
      ${roomNames.map(n=>{
        const c = pendingByRoom.get(n) || 0, off = roomIsOff(n);
        return `<button type="button" class="rj ${c ? 'has' : ''} ${off ? 'off' : ''}" data-room="${escapeHtml(n)}" onclick="jumpToPlanRoom(this.dataset.room)">${escapeHtml(roomLabel(n))}<i>${off ? '사용 중지' : c ? `요청 ${c}` : '요청 없음'}</i></button>`;
      }).join('')}
    </div>` : '';

  return `
    <div class="plan-bed-list${clipNow ? ' has-clip' : ''}">
      ${roomJumpHtml}
      ${stickyAxisHtml}
      ${roomNames.length ? sectionsHtml : `<div class="empty-materials" style="padding:24px 0;">${planBedView==='free' ? '일정표 기간에 남은 베드가 없어요. 모든 베드에 계획이 있어요.' : isAdmin ? '아직 제출된 장기 계획이 없어요. "+ 계획 제출"로 등록해보세요.' : '아직 등록된 장기 계획이 없어요.'}</div>`}
    </div>
  `;
}

  const fam = (st.families.get(act.family) || []).length;
  const chips = planClip.map(c=>{
    const sc = scaleNum(c.rows[0] && c.rows[0].expected_scale);
    return `<span class="pc-chip ${c.id===act.id ? 'on' : ''}"><button type="button" class="pc-pick" onclick="selectClip('${c.id}')" title="이 복사본을 붙여넣기 대상으로 골라요">${escapeHtml(c.label)}${sc!=null ? ` · ${sc.toLocaleString()}개체` : ''}</button><button type="button" class="pc-x" onclick="removeClip('${c.id}')" title="복사한 목록에서 빼요">×</button></span>`;
  }).join('');
  return `
      <div class="plan-clip-bar" role="status">

          <small>같은 복사본을 여러 번 붙여넣을 수 있어요${planClip.length > 1 ? ' · 붙여넣을 것을 아래에서 골라요' : ''}</small></span>

function renderPlanView(){

  // 일정표 위의 '날짜 고정' 체크: 요청을 끌어 옮길 때 날짜를 받은 그대로 둘지 (끌 수 있는 요청이 있을 때만 보인다)
  const lockHtml = (st && planShowDemand && st.counts.wait) ? `
        <label class="plan-lock ${planLockDates ? 'on' : ''}" title="체크하면 수요조사로 받은 날짜는 그대로 두고 자리(방 · 베드 · 층)만 옮겨요. 풀면 좌우로 끌어서 날짜도 옮길 수 있어요.">
          <input type="checkbox" id="planLockDates" ${planLockDates ? 'checked' : ''} onchange="togglePlanLockDates(this.checked)" />

  // 일정표 위의 '남은 베드만' 체크 (종합현황의 '진행중만'과 같은 작은 체크박스): 체크하면 남은 베드만, 풀면 전체. 누구에게나 보이고, 고른 상태는 브라우저에 기억

          남은 베드만

  const draftBarHtml = (st && st.counts.drafted) ? `

        <button type="button" class="btn small primary" onclick="savePlanDraft()">저장</button>

  // 복사해 둔 요청들: 붙여넣을 것을 고르고(칩), 각 베드 · 층 줄의 [붙여넣기]로 붙여넣는다
  const clipBarHtml = renderPlanClipBarHtml(st);
  const floatHtml = (draftBarHtml || clipBarHtml) ? `<div class="plan-float">${clipBarHtml}${draftBarHtml}</div>` : '';
  wrap.innerHTML = `
    ${st ? renderDemandInboxHtml(st) : ''}

      <div class="panel-box-head">
        <div>
          <h3>분기별 일정${(planPeriod && planPeriod.period_start && planPeriod.period_end) ? ` (${planPeriod.period_start} ~ ${planPeriod.period_end})` : ' (6개월)'}</h3>
        </div>
        <div style="display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; align-items:center;">
          ${bedViewHtml}
          ${lockHtml}
          ${isAdmin ? `<button class="btn small danger-text" onclick="deleteAllPlans()">전체 삭제</button>` : ''}
          ${isAdmin ? `<button class="btn small primary" onclick="openPlanModal()">+ 계획 제출</button>` : ''}
        </div>
      </div>
      ${legendHtml}
      ${renderPlanTimeline(st)}
    </div>
    ${floatHtml}
  `;
  const newList = wrap.querySelector('.pd-list');
  if(newList) newList.scrollTop = prevListTop;
  updatePlanStickyTop();
}

// 고정된 월 눈금이 앱 맨 위 헤더 바로 아래에 붙도록 위치를 맞춘다.
// 화면 확대(zoom)가 겹쳐 있어 CSS 길이와 실제 화면 픽셀의 비율이 다르므로, 눈금 영역 안에 폭 100px짜리 자를 넣어 그 비율을 재고 헤더 높이를 환산한다.
function updatePlanStickyTop(){
  const list = document.querySelector('#planViewWrap .plan-bed-list');
  const header = document.querySelector('header');
  if(!list || !header) return;
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute; visibility:hidden; width:100px; height:0; pointer-events:none;';
  list.appendChild(probe);
  const scale = probe.getBoundingClientRect().width / 100;   // 화면 픽셀 ÷ CSS px
  probe.remove();
  if(!(scale > 0)) return;   // 화면에 안 보이는 상태(숨김)면 다음 렌더 때 다시 맞춘다
  list.style.setProperty('--plan-sticky-top', (header.getBoundingClientRect().height / scale) + 'px');
}
window.addEventListener('resize', updatePlanStickyTop);

function groupTasksByBatch(tasksArr){
  const groups = {};
  const order = [];
  tasksArr.forEach(t=>{
    const key = [t.room_name||'', t.note||'', t.task_date||'', t.requester_name||'', t.floor||'', t.source||'', t.task_type||''].join('|||');
    if(!groups[key]){ groups[key] = { ids:[], sample:t, bedNos:[], completedCount:0 }; order.push(key); }
    groups[key].ids.push(t.id);
    if(t.bed_no!=null) groups[key].bedNos.push(t.bed_no);
    if(t.completed_at) groups[key].completedCount++;
  });
  return order.map(key=>{
    const g = groups[key];
    g.bedNos.sort((a,b)=>a-b);
    g.allCompleted = g.completedCount === g.ids.length;
    return g;
  });
}

function batchGroupLocLabel(g){
  const room = g.sample.room_name;
  if(!room) return '시설 전체';
  if(!g.bedNos.length) return room;
  const cfg = roomBedConfig(room);
  if(cfg && g.bedNos.length === cfg.bed_count && g.bedNos.every((b,i)=> b===i+1)){
    return `${room} 전체`;
  }
  return `${room} 베드${g.bedNos.join(',')}`;
}

async function toggleTaskGroupDone(idsCsv, checked){
  if(tourBlockWrite()) return;
  const ids = idsCsv.split(',');
  const val = checked ? new Date().toISOString() : null;
  const { error } = await sb.from('daily_tasks').update({ completed_at: val }).in('id', ids);
  if(error){ alert('처리 실패!\n\n'+error.message); return; }
  await loadAll();
}

async function cancelTaskGroup(idsCsv){
  if(tourBlockWrite()) return;
  const ids = idsCsv.split(',');
  const t = dailyTasks.find(x=> ids.includes(x.id));
  const isWorkerItem = t && t.source==='worker';
  const requiredLabel = isWorkerItem ? '작업담당자' : '작물담당자';
  const hasAuth = isWorkerItem ? workerAuth : materialAuth;
  if(!hasAuth){
    const pw = prompt(`${requiredLabel} 비밀번호를 입력하세요`);
    if(pw === null) return;
    if(isWorkerItem){
      if(pw !== '0000'){ alert('비밀번호가 틀렸어요!'); return; }
      workerAuth = true;
    } else {
      if(pw !== '7942'){ alert('비밀번호가 틀렸어요!'); return; }
      materialAuth = true;
    }
  }
  if(!confirm(ids.length>1 ? `이 항목(베드 ${ids.length}개)을 한 번에 취소할까요?` : '이 항목을 취소(삭제)할까요?')) return;
  const { error } = await sb.from('daily_tasks').delete().in('id', ids);
  if(error){ alert('취소 실패!\n\n'+error.message); return; }
  showToast('취소됐어요');
  await loadAll();
}

function renderTasksView(){
  const wrap = document.getElementById('tasksViewWrap');
  if(!wrap) return;

  const tasksForDate = dailyTasks.filter(t=> t.task_date===taskViewDate);

  const ROOM_ORDER = [...new Set([...ROW1, ...ROW2])];
  const sortByRoomBed = (a,b)=>{
    const ra = ROOM_ORDER.indexOf(a.room_name), rb = ROOM_ORDER.indexOf(b.room_name);
    if(ra!==rb) return (ra<0?999:ra) - (rb<0?999:rb);
    return (a.bed_no ?? 999) - (b.bed_no ?? 999);
  };
  const requestItemsAllRaw = tasksForDate.filter(t=> t.source!=='worker').sort(sortByRoomBed);
  const requestItemsAll = groupTasksByBatch(requestItemsAllRaw);
  const requestItems = taskFilterRoom ? requestItemsAll.filter(g=> g.sample.room_name===taskFilterRoom) : requestItemsAll;
  const requestFilterHtml = `
    <select onchange="setTaskFilterRoom(this.value)" style="font-size:11px; padding:5px 8px; border:1.6px solid var(--line); border-radius:7px; font-family:inherit; font-weight:600;">
      <option value="">전체 장소</option>
      ${[...new Set([...ROW1, ...ROW2])].filter(n=>!isMutedRoom(n)).map(n=>`<option value="${escapeHtml(n)}" ${taskFilterRoom===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
    </select>
  `;
  const sectionsHtml = requestItemsAll.length ? taskSectionHtml('요청사항', requestItems.length ? requestItems.map(g=>{
    const t = g.sample;
    const loc = batchGroupLocLabel(g);
    const idsCsv = g.ids.join(',');
    return `
      <div class="task-row-wrap">
        <label class="task-row ${g.allCompleted?'done':''}" style="flex:1;">
          <input type="checkbox" ${g.allCompleted?'checked':''} onchange="toggleTaskGroupDone('${idsCsv}', this.checked)" />
          <div class="task-row-body">
            <span class="task-row-loc">${escapeHtml(loc)}</span>
            ${t.note ? `<span class="task-row-note">${escapeHtml(t.note)}</span>` : ''}
            ${t.requester_name ? `<span class="task-requester-tag">담당자: ${escapeHtml(t.requester_name)}</span>` : ''}
          </div>
        </label>
        ${g.ids.length===1 ? `<button class="task-cancel-btn" onclick="editTaskItem('${g.ids[0]}')" title="요청 수정" style="width:auto; padding:0 10px; font-size:11px; font-weight:700;">✏️ 수정</button>` : ''}
        <button class="task-cancel-btn" onclick="cancelTaskGroup('${idsCsv}')" title="요청 취소">✕</button>
      </div>
    `;
  }).join('') : `<div class="empty-materials" style="padding:10px 0;">이 장소엔 요청이 없어요</div>`, requestFilterHtml) : '';

  const workerLogItemsAllRaw = tasksForDate.filter(t=> t.source==='worker').sort(sortByRoomBed);
  const workerLogItemsAll = groupTasksByBatch(workerLogItemsAllRaw);
  const workerLogItems = taskFilterRoom ? workerLogItemsAll.filter(g=> g.sample.room_name===taskFilterRoom) : workerLogItemsAll;
  const workerLogHtml = workerLogItems.length ? taskSectionHtml('작업자 기록', workerLogItems.map(g=>{
    const t = g.sample;
    const loc = batchGroupLocLabel(g);
    const idsCsv = g.ids.join(',');
    return `
      <div class="task-row-wrap">
        <div class="task-row worker-log" style="flex:1;">
          <div class="task-row-body">
            <span class="task-row-loc">${escapeHtml(loc)}</span>
            ${t.note ? `<span class="task-row-note worker-note">${escapeHtml(t.note)}</span>` : ''}
          </div>
        </div>
        <button class="task-cancel-btn" onclick="editTaskItem('${g.ids[0]}')" title="기록 수정" style="width:auto; padding:0 10px; font-size:11px; font-weight:700;">✏️ 수정</button>
        <button class="task-cancel-btn" onclick="cancelTaskGroup('${idsCsv}')" title="기록 취소">✕</button>
      </div>
    `;
  }).join('')) : '';

  const allEmpty = requestItemsAll.length===0 && workerLogItems.length===0;

  wrap.innerHTML = `
    <div class="tasks-split">
      <div class="panel-box tasks-cal-col">
        <div class="panel-box-head">
          <div>
            <h3>작업계획</h3>
            <p>달력에서 날짜를 고르면 오른쪽에서 확인·체크할 수 있어요.</p>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn small primary" onclick="openAddTaskModal()">+ 작업 추가</button>
            ${isAdmin ? `<button class="btn small danger-text" onclick="deleteAllTasks()">작업계획 전체 삭제</button>` : ''}
          </div>
        </div>
        ${taskCalendarHtml()}
      </div>

      <div class="panel-box tasks-list-col">
        <div class="panel-box-head" style="border-bottom:none; margin-bottom:12px; padding-bottom:0;">
          <div>
            <h3 style="font-size:14px;">${taskViewDate}${taskViewDate===todayKST()?' (오늘)':''}</h3>
          </div>
        </div>
        ${sectionsHtml}
        ${workerLogHtml}
        ${allEmpty ? `<div class="empty-materials" style="padding:16px 0;">${taskFilterRoom?`"${escapeHtml(taskFilterRoom)}"에 등록된 작업이 없어요`:'이 날짜엔 별도로 등록된 작업(청소·파종 등)이 없어요. "+ 작업 추가"로 등록해보세요.'}</div>` : ''}
      </div>
    </div>
  `;
}

function taskCalendarHtml(){
  if(!taskCalendarMonth) taskCalendarMonth = kstTodayDate();
  const year = taskCalendarMonth.getFullYear();
  const month = taskCalendarMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = todayKST();

  let cells = '';
  for(let i=0;i<startWeekday;i++){ cells += `<div class="tcal-cell empty"></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr===todayStr;
    const isSelected = dateStr===taskViewDate;
    const dayTasks = dailyTasks.filter(t=> t.task_date===dateStr);
    const dayGroups = groupTasksByBatch(dayTasks);
    const MAX_CHIPS = 3;
    const chipsHtml = dayGroups.slice(0, MAX_CHIPS).map(g=>{
      const t = g.sample;
      const isWorker = t.source==='worker';
      const label = (t.note || t.task_type || '작업').slice(0, 14);
      const chipClass = isWorker ? 'worker' : (g.allCompleted ? 'done' : 'request');
      return `<div class="tcal-chip ${chipClass}">${escapeHtml(label)}</div>`;
    }).join('');
    const moreCount = dayGroups.length - MAX_CHIPS;
    const hasAnyRequest = dayGroups.some(g=> g.sample.source!=='worker');
    const dotClass = dayGroups.length ? (hasAnyRequest ? 'has-request' : 'has-task') : '';
    cells += `
      <div class="tcal-cell ${isToday?'today':''} ${isSelected?'selected':''} ${dotClass}" onclick="setTaskViewDate('${dateStr}')">
        <span class="tcal-daynum">${d}</span>
        <div class="tcal-chips">
          ${chipsHtml}
          ${moreCount>0 ? `<div class="tcal-chip more">+${moreCount}건 더보기</div>` : ''}
        </div>
      </div>
    `;
  }

  return `
    <div class="task-calendar">
      <div class="tcal-header">
        <button type="button" onclick="shiftTaskCalendarMonth(-1)">‹</button>
        <span>${year}년 ${month+1}월</span>
        <button type="button" onclick="shiftTaskCalendarMonth(1)">›</button>
      </div>
      <div class="tcal-weekdays">${['일','월','화','수','목','금','토'].map(w=>`<div>${w}</div>`).join('')}</div>
      <div class="tcal-grid">${cells}</div>
      <div class="tcal-legend">
        <span><span class="tcal-dot request"></span> 요청사항</span>
        <span><span class="tcal-dot worker"></span> 작업자 기록</span>
        <span><span class="tcal-dot done"></span> 완료</span>
      </div>
    </div>
  `;
}

function shiftTaskCalendarMonth(delta){
  taskCalendarMonth = new Date(taskCalendarMonth.getFullYear(), taskCalendarMonth.getMonth()+delta, 1);
  renderTasksView();
}

function taskSectionHtml(type, rowsHtml, extraHtml){
  return `
    <div class="task-section">
      <div class="task-section-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>${escapeHtml(type)}</span>
        ${extraHtml||''}
      </div>
      <div class="task-rows">${rowsHtml}</div>
    </div>
  `;
}

function setTaskViewDate(v){
  taskViewDate = v;
  renderTasksView();
}

let editingTaskId = null;
async function editTaskItem(id){
  const t = dailyTasks.find(x=>x.id===id);
  if(!t) return;
  const isWorkerItem = t.source==='worker';
  const requiredLabel = isWorkerItem ? '작업담당자' : '작물담당자';
  const hasAuth = isWorkerItem ? workerAuth : materialAuth;

  if(!hasAuth){
    const pw = prompt(`${requiredLabel} 비밀번호를 입력하세요`);
    if(pw === null) return;
    if(isWorkerItem){
      if(pw !== '0000'){ alert('비밀번호가 틀렸어요! (이건 작업담당자 기록이라 작업담당자 비밀번호가 필요해요)'); return; }
      workerAuth = true;
    } else {
      if(pw !== '7942'){ alert('비밀번호가 틀렸어요! (이건 작물담당자 요청이라 작물담당자 비밀번호가 필요해요)'); return; }

  editingTaskId = id;

  document.getElementById('editTaskModalTitle').textContent = isWorkerLog ? '작업 기록 수정' : '요청사항 수정';
  document.getElementById('editTaskModalBody').innerHTML = `
    <select id="editTaskRoomInput">${roomSelectHtml}</select>

      <input id="editTaskBedInput" type="number" placeholder="베드 번호(선택)" value="${t.bed_no ?? ''}" />

        <option value="전체" ${(!t.floor||t.floor==='전체')?'selected':''}>층 전체</option>
        <option value="1층" ${t.floor==='1층'?'selected':''}>1층</option>
        <option value="2층" ${t.floor==='2층'?'selected':''}>2층</option>
      </select>
    </div>
    <textarea id="editTaskNoteInput" rows="5" style="width:100%; box-sizing:border-box; padding:10px 12px; border:1.2px solid var(--line); border-radius:9px; font-family:inherit; font-size:13px; resize:vertical;">${escapeHtml(t.note||'')}</textarea>
    ${!isWorkerLog ? `<input id="editTaskRequesterInput" placeholder="요청자 이름" value="${escapeHtml(t.requester_name||'')}" />` : ''}
  `;
  document.getElementById('editTaskModalOverlay').classList.add('open');
}
function closeEditTaskModal(){
  document.getElementById('editTaskModalOverlay').classList.remove('open');
  editingTaskId = null;
}
async function saveEditedTask(){
  if(tourBlockWrite()) return;
  const t = dailyTasks.find(x=>x.id===editingTaskId);
  if(!t) return;
  const room_name = document.getElementById('editTaskRoomInput').value || null;
  const bedVal = document.getElementById('editTaskBedInput').value;
  const bed_no = bedVal===''? null : parseInt(bedVal);
  const floor = document.getElementById('editTaskFloorInput').value;
  const note = document.getElementById('editTaskNoteInput').value || null;
  const requesterEl = document.getElementById('editTaskRequesterInput');
  if(!note){ alert('내용을 꼭 적어주세요!'); return; }

  const payload = { room_name, bed_no, floor, note };
  if(requesterEl){
    if(!requesterEl.value){ alert('요청자 이름을 적어주세요!'); return; }
    payload.requester_name = requesterEl.value;
  }

  const { error } = await sb.from('daily_tasks').update(payload).eq('id', editingTaskId);
  if(error){ alert('수정 실패!\n\n'+error.message); return; }
  closeEditTaskModal();
  showToast('수정됐어요');
  await loadAll();
}

let pendingTaskMode = null; // '작업추가' 클릭시 입력한 비밀번호에 따라 'material_manager' | 'worker'

function openAddTaskModal(){
  let mode;
  if(materialAuth || workerAuth){
    mode = materialAuth ? 'material_manager' : 'worker';
  } else {
    const pw = prompt('비밀번호를 입력하세요');
    if(pw === null) return;
    if(pw === '7942') mode = 'material_manager';
    else if(pw === '0000') mode = 'worker';
    else { alert('비밀번호가 틀렸어요!'); return; }
    if(mode==='material_manager') materialAuth = true;
    if(mode==='worker') workerAuth = true;
  }
  pendingTaskMode = mode;

  const roomSelectHtml = `<option value="">시설 전체</option>${[...new Set([...ROW1, ...ROW2])].filter(n=>!isMutedRoom(n)).map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}`;
  document.getElementById('addTaskModalTitle').textContent = mode==='worker' ? '오늘 한 일 기록' : '+ 작업 요청';
  document.getElementById('addTaskModalBody').innerHTML = mode==='worker' ? `
    <select id="taskRoomInput" onchange="renderTaskBedChips()">${roomSelectHtml}</select>
    <div id="taskBedChipWrap"></div>
    <textarea id="taskNoteInput" placeholder="예: 세대단축실 1번 1층베드 청소" rows="5" style="width:100%; box-sizing:border-box; padding:10px 12px; border:1.2px solid var(--line); border-radius:9px; font-family:inherit; font-size:13px; resize:vertical;"></textarea>
    <input id="taskTypeInput" type="hidden" value="요청사항" />
    <input id="taskFloorInput" type="hidden" value="전체" />
    <input id="taskDateInput" type="hidden" value="${taskViewDate}" />
  ` : `
    <select id="taskRoomInput" onchange="renderTaskBedChips()">${roomSelectHtml}</select>
    <div id="taskBedChipWrap"></div>
    <div>
      <div style="font-size:11px; font-weight:700; color:var(--ink-faint); margin-bottom:6px;">층</div>
      <div class="task-bed-chips">
        ${['전체','1층','2층'].map(f=>`<button type="button" class="task-bed-chip ${f==='전체'?'active':''}" data-floor="${f}" onclick="selectTaskFloorChip('${f}', this)">${f}</button>`).join('')}
      </div>
      <input id="taskFloorInput" type="hidden" value="전체" />
    </div>
    <textarea id="taskNoteInput" placeholder="요청 내용/메모 (예: 3번 베드 수확해주세요)" rows="5" style="width:100%; box-sizing:border-box; padding:10px 12px; border:1.2px solid var(--line); border-radius:9px; font-family:inherit; font-size:13px; resize:vertical;"></textarea>
    <input id="taskRequesterInput" placeholder="요청자 이름" />
    <input id="taskDateInput" type="date" value="${taskViewDate}" />
    <input id="taskTypeInput" type="hidden" value="요청사항" />
  `;
  document.getElementById('addTaskModalOverlay').classList.add('open');
  renderTaskBedChips();
}

function selectTaskFloorChip(floor, el){
  document.getElementById('taskFloorInput').value = floor;
  el.parentElement.querySelectorAll('.task-bed-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
}

let selectedTaskBeds = new Set();
function renderTaskBedChips(){
  selectedTaskBeds = new Set();
  const wrap = document.getElementById('taskBedChipWrap');
  if(!wrap) return;
  const roomName = document.getElementById('taskRoomInput').value;
  const cfg = roomBedConfig(roomName);
  if(!roomName || !cfg){
    const msg = pendingTaskMode==='worker' ? '작업을 추가해주세요' : '시설 전체 요청이에요 (베드 지정 없음)';
    wrap.innerHTML = `<div style="font-size:11.5px; color:var(--ink-faint); padding:4px 0;">${msg}</div>`;
    return;
  }
  const beds = Array.from({length: cfg.bed_count}, (_,i)=> i+1);
  wrap.innerHTML = `
    <div style="font-size:11px; font-weight:700; color:var(--ink-faint); margin-bottom:6px;">베드 선택 (여러 개 가능, 안 고르면 방 전체)</div>
    <div class="task-bed-chips">
      ${beds.map(b=>`<button type="button" class="task-bed-chip" data-bed="${b}" onclick="toggleTaskBedChip(${b}, this)">베드 ${b}</button>`).join('')}
      <button type="button" class="task-bed-chip all" onclick="selectAllTaskBedChips(${cfg.bed_count})">전체</button>
    </div>
  `;
}
function toggleTaskBedChip(bed, el){
  if(selectedTaskBeds.has(bed)){ selectedTaskBeds.delete(bed); el.classList.remove('active'); }
  else{ selectedTaskBeds.add(bed); el.classList.add('active'); }
}
function selectAllTaskBedChips(bedCount){
  const wrap = document.getElementById('taskBedChipWrap');
  const allSelected = selectedTaskBeds.size === bedCount;
  selectedTaskBeds = new Set();
  wrap.querySelectorAll('.task-bed-chip[data-bed]').forEach(el=>{
    if(!allSelected){ selectedTaskBeds.add(parseInt(el.dataset.bed)); el.classList.add('active'); }
    else{ el.classList.remove('active'); }
  });
}
function closeAddTaskModal(){
  document.getElementById('addTaskModalOverlay').classList.remove('open');
}
async function saveNewTask(){
  if(tourBlockWrite()) return;
  const task_type = document.getElementById('taskTypeInput').value;
  const room_name = document.getElementById('taskRoomInput').value || null;
  const floor = document.getElementById('taskFloorInput').value;
  const note = document.getElementById('taskNoteInput').value || null;
  const task_date = document.getElementById('taskDateInput').value || taskViewDate;
  const isWorkerLog = pendingTaskMode==='worker';
  const requesterEl = document.getElementById('taskRequesterInput');
  const requester_name = requesterEl ? (requesterEl.value || null) : null;
  if((task_type==='요청사항' || isWorkerLog) && !note){ alert('내용을 꼭 적어주세요!'); return; }
  if(!isWorkerLog && !requester_name){ alert('요청자 이름을 적어주세요!'); return; }

  const bedNos = selectedTaskBeds.size ? Array.from(selectedTaskBeds).sort((a,b)=>a-b) : [null];
  const rows = bedNos.map(bed_no => ({
    task_type, room_name, bed_no, floor, note, task_date, requester_name,
    source: isWorkerLog ? 'worker' : 'material_manager',
    completed_at: isWorkerLog ? new Date().toISOString() : null
  }));

  const { error } = await sb.from('daily_tasks').insert(rows);
  if(error){ alert('저장 실패!\n\n'+error.message); return; }
  closeAddTaskModal();
  showToast(isWorkerLog ? '기록됐어요' : `작업이 추가됐어요${bedNos.length>1?` (베드 ${bedNos.length}개)`:''}`);
  await loadAll();
}

function openWorkRoomDetail(roomId){
  workActiveRoomId = roomId;
  resetWorkMulti();
  renderDetail('work');
}

function closeWorkRoomDetail(){
  workActiveRoomId = null;
  resetWorkMulti();
  renderDetail('work');
}
function resetWorkMulti(){ workMultiSpots = new Set(); }

// 계통작성 ─ 배치도에서 방을 누르면: 그 방을 열고, 이미 열린 방을 다시 누르면 닫는다. 아직 만들지 않은 방은 관리자만 만들 수 있다.
function pickWorkRoom(name){
  if(isMutedRoom(name)) return;
  const room = rooms.find(r=> r.name===name);
  if(!room){
    if(!isAdmin){ showToast('아직 만들어지지 않은 방이에요 (관리자가 만들 수 있어요)'); return; }
    createWorkRoom(name);
    return;
  }
  if(workActiveRoomId===room.id) closeWorkRoomDetail();
  else openWorkRoomDetail(room.id);
}
async function createWorkRoom(name){
  await quickCreateRoom(name);
  const room = rooms.find(r=> r.name===name);
  if(room) openWorkRoomDetail(room.id);
}
// ── 자리 선택: 베드 맵에서 자리를 눌러 여러 개 고르면, 같은 계통을 적는 작성 칸이 바로 열리고 개체수는 베드마다 따로 적는다 ──
function workSpotKey(bedNo, floor){ return `${bedNo}|${floor}`; }
function parseWorkSpotKey(key){ const [b, f] = key.split('|'); return { bedNo: parseInt(b), floor: f }; }
function workSpotLabel(room, t){ return isAisleSpot(t.bedNo) ? '통로' : `베드 ${t.bedNo}${workRoomInfo(room).bedFloors===2 ? ` · ${t.floor}` : ''}`; }
function workMultiTargets(){
  // 베드 번호 순(통로는 맨 뒤), 같은 베드에서는 2층이 먼저
  return [...workMultiSpots].map(parseWorkSpotKey).sort((a, b)=> bedOrder(a.bedNo)-bedOrder(b.bedNo) || b.floor.localeCompare(a.floor));
}
// 딱 한 자리만 골랐을 때 그 자리 { bedNo, floor } (아니면 null)
function workOnlySpot(){
  return workMultiSpots.size === 1 ? parseWorkSpotKey([...workMultiSpots][0]) : null;
}
// 한 자리만 고른 상태로 만든다 (등록을 마치고 그 자리를 열어 보여 줄 때)
function setWorkOnlySpot(bedNo, floor){ workMultiSpots = new Set([workSpotKey(bedNo, floor)]); }
// 지금 방·자리 선택 상태를 한 줄로 만든다. 집단 추가 입력칸을 연 뒤 이 값이 바뀌면(다른 자리 · 방을 눌렀다는 뜻) 입력칸을 닫는다.
function workSelectionSig(){
  return `${workActiveRoomId}#${[...workMultiSpots].sort().join(',')}`;
}
// 그 자리에 지금 심겨 있는 계통이 없는가
function workSpotKeyIsEmpty(room, key){
  const s = parseWorkSpotKey(key);
  return workSpotBatches(room, s.bedNo, s.floor).length === 0;
}
// 빈 자리만 새로 고르는 클릭이면, 이미 골라 둔 '사용중' 자리는 선택에서 뺀다 → 빈 자리만 골라진다.
// (자리를 등록하고 나면 그 자리가 선택된 채 남는데, 이어서 빈 자리를 눌렀을 때 방금 등록한 자리가 같이 끼지 않게 하려는 것)
function dropFilledWorkSpotsWhenAddingEmpty(room, addedKeys){
  if(!room || !addedKeys.length || !addedKeys.every(k=> workSpotKeyIsEmpty(room, k))) return;
  [...workMultiSpots].forEach(k=>{ if(!workSpotKeyIsEmpty(room, k)) workMultiSpots.delete(k); });
}
// 베드 맵의 칸을 누르면 그 자리를 고르거나 푼다 (수요조사와 같다)
function toggleWorkMultiSpot(bedNo, floor){
  const key = workSpotKey(bedNo, floor);
  if(workMultiSpots.has(key)) workMultiSpots.delete(key);
  else{
    workMultiSpots.add(key);
    dropFilledWorkSpotsWhenAddingEmpty(rooms.find(r=> r.id===workActiveRoomId), [key]);
  }
  renderDetail('work');
}
// 베드 이름을 누르면 그 베드의 모든 층을 함께 고르거나 푼다
function toggleWorkMultiBed(bedNo){
  const room = rooms.find(r=> r.id===workActiveRoomId);
  if(!room) return;
  const keys = workRoomInfo(room).floors.map(fl=> workSpotKey(bedNo, fl));
  const allOn = keys.every(k=> workMultiSpots.has(k));
  keys.forEach(k=>{ if(allOn) workMultiSpots.delete(k); else workMultiSpots.add(k); });
  if(!allOn) dropFilledWorkSpotsWhenAddingEmpty(room, keys);
  renderDetail('work');
}
function clearWorkMulti(){ workMultiSpots = new Set(); renderDetail('work'); }

function workRowStatus(harvestDate){
  if(!harvestDate) return { cls:'none', label:'-', diff:null, style:'background:var(--line-soft); color:var(--ink-faint);' };
  const diff = daysBetween(todayKST(), harvestDate);
  let cls, label, style;
  if(diff < 0){
    cls = 'overdue';
    label = `${Math.abs(diff)}일 지남`;
    if(Math.abs(diff) >= 7) style = 'background:#B5453B; color:#fff;';
    else if(Math.abs(diff) >= 3) style = 'background:#D9756A; color:#fff;';
    else style = 'background:#F5D4CF; color:#8A342B;';
  } else if(diff <= 7){
    cls = 'soon';
    label = `D-${diff}`;
    style = diff <= 2 ? 'background:#F0AE7A; color:#fff;' : 'background:#FBEEDD; color:var(--amber);';
  } else {
    cls = 'ok';
    label = `D-${diff}`;
    style = 'background:var(--teal-soft); color:var(--teal-deep);';
  }
  return { cls, label, diff, style };
}

async function harvestAndReplant(materialId){
  if(tourBlockWrite()) return;
  const b = materials.find(m=>m.id===materialId);
  if(!b) return;
  const doneWord = { '인공교배':'사용 완료', '기타':'실험 완료' }[batchPurposeOf(b)] || '수확';
  const againWord = { advance:'세대진전', replant:'다시 심기' }[harvestActionOf(b)];   // 인공교배는 사용 완료로 끝이라 이어서 심는 안내가 없다
  if(!confirm(`${doneWord} 처리할까요?\n이 자리가 비워져요.${againWord ? ` (나중에 "수확 완료 목록"에서 [${againWord}] 버튼으로 이어서 심을 수 있어요)` : ''}`)) return;
  const now = new Date().toISOString();

  showToast(`${doneWord} 처리됐어요, 자리가 비워졌어요`);

}

function extractGenStage(genStr){
  if(!genStr) return null;
  if(genStr.includes('포장')) return '포장';
  const m = genStr.match(/F\s*(\d+)/i);
  if(m){
    const num = parseInt(m[1]);
    if(num>=1 && num<=6) return 'F'+num;
  }
  return null;
}

function searchLineHistory(){
  const q = document.getElementById('lineHistorySearchInput').value.trim();
  const resultsEl = document.getElementById('lineHistoryResults');
  if(!q){ resultsEl.innerHTML = `<div class="empty-materials" style="padding:20px 0;">계통번호를 입력해주세요.</div>`; return; }

  const allMatches = materials.filter(m=> (m.line_no||'').toLowerCase().includes(q.toLowerCase()));

  if(!allMatches.length){
    resultsEl.innerHTML = `<div class="empty-materials" style="padding:20px 0;">"${escapeHtml(q)}" 계통번호로 등록된 이력이 없어요.</div>`;
    return;
  }

  // 검색어와 일치하는 실제 계통번호별로 나눠서 각각 이력을 만듦
  const byLineNo = {};
  allMatches.forEach(m=>{
    const key = m.line_no || '(계통번호 없음)';
    if(!byLineNo[key]) byLineNo[key] = [];
    byLineNo[key].push(m);
  });
  const lineNoKeys = Object.keys(byLineNo).sort();

  const GEN_STAGES = ['F1','F2','F3','F4','F5','F6','포장'];
  const stageSortKey = (stage)=>{
    const idx = GEN_STAGES.indexOf(stage);
    return idx>=0 ? idx : 999;
  };

  // 검색 결과가 여러 계통이고 아직 하나를 선택 안 했으면: 클릭 가능한 요약 목록만 보여줌
  if(lineNoKeys.length > 1 && !lineHistoryFocusedLineNo){
    const summaryHtml = lineNoKeys.map(lineNoKey=>{
      const lineMatches = byLineNo[lineNoKey];
      const color = cropColor(lineMatches[0].name);
      const totalQty = lineMatches.reduce((s,m)=> s + (Number(m.quantity)||0), 0);
      const purposes = [...new Set(lineMatches.map(m=>m.purpose).filter(Boolean))];
      return `
        <div class="task-row" onclick="focusLineHistory('${escapeHtml(lineNoKey).replace(/'/g,"\\'")}')">
          <div class="task-row-body">
            <span class="task-row-loc"><b style="color:${color};">${escapeHtml(lineNoKey)}</b> <span style="color:var(--ink-faint); font-weight:600;">(${escapeHtml(lineMatches[0].name||'-')})</span></span>
            <span class="task-row-note">${purposes.length ? purposes.map(p=>''+escapeHtml(p)).join(', ') : '목표 미설정'} · ${totalQty.toLocaleString()}개체</span>
          </div>
          <span style="color:var(--ink-faint); font-size:13px;">›</span>
        </div>
      `;
    }).join('');
    resultsEl.innerHTML = `
      <div style="font-size:11px; color:var(--ink-faint); margin-bottom:12px;">"${escapeHtml(q)}"로 검색된 계통 ${lineNoKeys.length}개 · 하나를 클릭하면 상세 이력을 볼 수 있어요</div>
      <div class="task-rows">${summaryHtml}</div>
    `;
    return;
  }

  const targetKeys = lineHistoryFocusedLineNo ? [lineHistoryFocusedLineNo] : lineNoKeys;
  const sectionsHtml = targetKeys.map(lineNoKey=>{
    const matches = byLineNo[lineNoKey].sort((a,b)=> (a.sowing_date||'9999').localeCompare(b.sowing_date||'9999'));
    const color = cropColor(matches[0].name);

    const stageInfo = {};
    const stageQty = {};
    matches.forEach(m=>{
      const stage = extractGenStage(m.generation);
      if(!stage) return;
      stageInfo[stage] = true;
      stageQty[stage] = (stageQty[stage] || 0) + (Number(m.quantity)||0);
    });

    const timelineHtml = `
      <div class="gen-timeline" style="margin-bottom:6px; align-items:flex-start;">
        ${GEN_STAGES.map((g,i)=>{
          const active = !!stageInfo[g];
          return `
          <div class="gen-step ${active?'active':'inactive'}" style="${active?`--dot-glow:${color};`:''}">
            <div class="gen-dot" style="${active ? `background:${color}; border-color:${color}; color:#fff;` : `border-color:var(--line); color:var(--ink-faint);`} ${g.length>2?'font-size:7.5px; line-height:1; white-space:normal;':''}">${g.length>2 ? escapeHtml(g.slice(0,2))+'<br>'+escapeHtml(g.slice(2)) : escapeHtml(g)}</div>
            <div style="font-size:9.5px; font-weight:800; color:${active?color:'var(--ink-faint)'}; margin-top:3px; white-space:nowrap;">${active && stageQty[g] ? stageQty[g].toLocaleString()+'개체' : ''}</div>
          </div>
          ${i<GEN_STAGES.length-1 ? `<div class="gen-line" style="background:${active?color:'var(--line)'}; margin-top:15px;"></div>` : ''}
        `;}).join('')}
      </div>
    `;

    const groups = {};
    matches.forEach(m=>{
      const stage = extractGenStage(m.generation) || (m.generation ? m.generation : '세대 미기재');
      const purpose = m.purpose || '목표 미설정';
      const key = stage + '|||' + purpose;
      if(!groups[key]) groups[key] = { stage, purpose, qty:0, starts:[], ends:[], rooms:new Set(), ongoing:false };
      groups[key].qty += Number(m.quantity)||0;
      if(m.sowing_date) groups[key].starts.push(m.sowing_date);
      const endDate = m.harvest_confirmed_at ? kstDateOfTimestamp(m.harvest_confirmed_at) : null;
      if(endDate) groups[key].ends.push(endDate);
      if(!m.harvest_confirmed_at) groups[key].ongoing = true;
      const room = rooms.find(r=>r.id===m.room_id);
      if(room) groups[key].rooms.add(room.name);
    });
    const groupList = Object.values(groups).sort((a,b)=> stageSortKey(a.stage) - stageSortKey(b.stage) || (a.starts[0]||'9999').localeCompare(b.starts[0]||'9999'));

    const listHtml = groupList.map(g=>{
      const start = g.starts.length ? g.starts.sort()[0] : null;
      const end = g.ongoing ? '진행중' : (g.ends.length ? g.ends.sort().slice(-1)[0]+' (수확)' : null);
      const period = start ? `${start} ~ ${end||'-'}` : '파종일 미기재';
      const roomsText = [...g.rooms].join(', ') || '-';
      return `
        <div class="task-row" style="cursor:default;">
          <div class="task-row-body">
            <span class="task-row-loc"><b style="color:${color};">${escapeHtml(String(g.stage))}</b> · ${period}</span>
            <span class="task-row-note">${escapeHtml(roomsText)}${g.purpose!=='목표 미설정'?(' · '+escapeHtml(g.purpose)):''} · ${g.qty.toLocaleString()}개</span>
          </div>
        </div>
      `;
    }).join('');

    const allPurposes = [...new Set(matches.map(m=>m.purpose).filter(Boolean))];

    return `
      <div class="panel-box" style="margin-bottom:16px; padding:18px;">
        <div style="font-size:13px; font-weight:800; color:var(--ink); margin-bottom:2px;">${escapeHtml(lineNoKey)} <span style="font-weight:600; color:var(--ink-faint);">(${escapeHtml(matches[0].name||'-')})</span></div>
        <div style="font-size:11px; color:var(--ink-faint); margin-bottom:14px;">${allPurposes.length ? allPurposes.map(p=>`${escapeHtml(p)}`).join(', ') : '등록된 목표 없음'}</div>
        ${timelineHtml}
        <div class="task-rows" style="margin-top:16px;">${listHtml}</div>
      </div>
    `;
  }).join('');

  resultsEl.innerHTML = `
    ${lineHistoryFocusedLineNo && lineNoKeys.length>1 ? `<button class="btn small" onclick="unfocusLineHistory()" style="margin-bottom:12px;">← 전체 목록으로</button>` : ''}
    ${sectionsHtml}
  `;
}
